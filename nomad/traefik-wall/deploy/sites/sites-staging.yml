http:
  routers:
    metrics:
      rule: PathPrefix(`/metrics`)
      service: prometheus@internal
      entryPoints:
        - metrics
      middlewares: 
        - metricAuth

    protected-sites:
      rule: "Header(`X-Forwarded-Host`, `catalog-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `dpul-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `dss-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `figgy-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `findingaids-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `lae-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `pulfalight-staging.princeton.edu`) || Header(`X-Forwarded-Host`, `maps-staging.princeton.edu`)"
      entrypoints:
        - http

    # Skip the bot wall on ajax requests.
    skip-bot-wall:
      rule: "Header(`Sec-Fetch-Dest`, `empty`)"
      parentRefs:
        - protected-sites

    apply-bot-wall:
      rule: "!Header(`Sec-Fetch-Dest`, `empty`)"
      middlewares:
        - captcha-protect
      parentRefs:
        - protected-sites

    catalog-staging:
      service: catalog-staging
      rule: "Header(`X-Forwarded-Host`, `catalog-staging.princeton.edu`)"
      middlewares:
        - append-catalog-regex
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    dpul-staging:
      service: dpul-staging
      rule: "Header(`X-Forwarded-Host`, `dpul-staging.princeton.edu`)"
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    dss-staging:
      service: dss-staging
      rule: "Header(`X-Forwarded-Host`, `dss-staging.princeton.edu`)"
      middlewares:
        - append-catalog-regex
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    figgy-staging:
      service: figgy-staging
      rule: "Header(`X-Forwarded-Host`, `figgy-staging.princeton.edu`)"
      middlewares:
        - append-catalog-regex
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    findingaids-staging:
      service: findingaids-staging
      rule: "Header(`X-Forwarded-Host`, `findingaids-staging.princeton.edu`)"
      middlewares:
        - append-catalog-regex
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    lae-staging:
      service: lae-staging
      rule: "Header(`X-Forwarded-Host`, `lae-staging.princeton.edu`)"
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    pulfalight-staging:
      service: findingaids-staging
      rule: "Header(`X-Forwarded-Host`, `pulfalight-staging.princeton.edu`)"
      middlewares:
        - append-catalog-regex
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall

    pulmap-staging:
      service: pulmap-staging
      rule: "Header(`X-Forwarded-Host`, `maps-staging.princeton.edu`)"
      middlewares:
        - append-catalog-regex
      parentRefs:
        - apply-bot-wall
        - skip-bot-wall
  services:
    catalog-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://catalog-staging1.princeton.edu:80
          - url: http://catalog-staging2.princeton.edu:80
    dpul-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://dpul-staging3.princeton.edu:80
          - url: http://dpul-staging4.princeton.edu:80
    dss-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://dss-staging1.princeton.edu:80
          - url: http://dss-staging1.princeton.edu:80
    figgy-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://figgy-web-staging1.princeton.edu:80
          - url: http://figgy-web-staging2.princeton.edu:80
    findingaids-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://pulfalight-staging1.princeton.edu:80
    lae-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://lae-staging2.princeton.edu:80
    pulmap-staging:
      loadBalancer:
        healthCheck:
          path: /health.json
          timeout: 10
        servers:
          - url: http://maps-staging2.princeton.edu:80
