---
# EE definition for our 'security-theater' playbook
# to build an EE, run `ansible-builder build`

# builder schema version
version: 3

images:
  # build a new image based on this image
  # ansible-core 2.20+ needs Python 3.12+, which the AAP 2.4 ee-supported
  # images do not ship. UBI 9 minimal also needs no registry.redhat.io login.
  base_image:
    name: registry.access.redhat.com/ubi9/ubi-minimal:latest

dependencies:
  ansible_core:
    package_pip: ansible-core==2.21.5
  ansible_runner:
    package_pip: ansible-runner
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  # python packages, stuff you install with 'pip install'
  python:
    # The ~100 collections that ship with Ansible 14 (ansible.posix,
    # community.general, ...), which pins ansible-core 2.21. The AAP base
    # image used to bundle these; UBI does not.
    - ansible==14.5.0
    - six
    - psutil

  # system packages, stuff you install with 'apt/yum/dnf install'
  # ansible-builder writes this list into the 'context/bindep.txt' file
  system:
    - git
    - openssh-clients
    - rsync
    - python3.12-pip
options:
  # default path is /usr/bin/dnf, which does not exist on the base image
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  append_final:
    # UBI only installs python3.12; localhost tasks look for /usr/bin/python3.
    - RUN ln -sf /usr/bin/python3.12 /usr/bin/python3
