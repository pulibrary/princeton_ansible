---
# The self-service desktop password.
#
# An administrator issuing desktop passwords would reintroduce exactly what the
# certificate authority removes: a credential somebody else knows. Instead each
# person sets their own, over an SSH session they could only open with a current
# certificate.

- name: Desktop CA login (password) | install the self-service command
  ansible.builtin.template:
    src: set-desktop-password.sh.j2
    dest: "{{ xrdp_ca_login_helper_path }}"
    owner: root
    group: root
    mode: "0755"

# Setting a password needs root, but nobody should need broad root rights to
# manage their own desktop session. The command takes the account from
# SUDO_USER, so this rule cannot be used to change anyone else's password. It
# names one command, so it grants nothing else either.
- name: Desktop CA login (password) | permit the desktop group to run it
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/xrdp_ca_login)
      %{{ xrdp_ca_login_group }} ALL=(root) NOPASSWD: \
        {{ xrdp_ca_login_helper_path }}
    dest: "{{ xrdp_ca_login_helper_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
