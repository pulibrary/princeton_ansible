---
galaxy_info:
  role_name: xrdp_ca_login
  company: Princeton University Library
  description: >-
    Remote desktop sign-in for hosts whose identity comes from the Library SSH
    certificate authority.
  author: pulibrary

  license: MIT

  min_ansible_version: "2.14"

  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Deliberately no dependencies. This role is a policy overlay on a desktop that
# roles/xrdp has already built and accounts that roles/ssh_ca_trust has already
# created, and it checks for both rather than pulling them in, so the order
# stays visible in the playbook instead of hidden in role metadata.
dependencies: []
