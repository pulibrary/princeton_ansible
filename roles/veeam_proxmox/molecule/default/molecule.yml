---
scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
platforms:
  # Veeam's sudoers entries need sudo 1.9.10 or newer, which Ubuntu 22.04 does
  # not ship. Proxmox VE 8 and 9 are new enough.
  - name: instance
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-24.04"
    command: ""  # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  # Molecule no longer puts the repository's roles directory on the role
  # search path, so playbooks cannot find roles by name without this.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    create: create.yml
    prepare: prepare.yml
    destroy: destroy.yml
  log: true
verifier:
  name: ansible
