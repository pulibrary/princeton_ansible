---
- name: Verify rootless client
  hosts: nomad_clients
  gather_facts: false
  tasks:
    - name: Get rootless user services
      ansible.builtin.shell: XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-active docker nomad
      become: true
      become_user: nomad
      register: pul_nomad_verify_units
      changed_when: false
      failed_when: false

    - name: Verify rootless user services are active
      ansible.builtin.assert:
        that:
          - pul_nomad_verify_units.stdout_lines == ['active', 'active']
        fail_msg: "docker, nomad: {{ pul_nomad_verify_units.stdout_lines }}"

    - name: Get Consul service state
      ansible.builtin.command: systemctl is-active consul
      register: pul_nomad_verify_consul
      changed_when: false
      failed_when: pul_nomad_verify_consul.stdout != 'active'

    - name: Find agents running as root
      ansible.builtin.command: pgrep -u root -x 'dockerd|containerd|nomad|pasta|rootlesskit'
      register: pul_nomad_verify_root
      changed_when: false
      failed_when: pul_nomad_verify_root.rc > 1

    - name: Verify no agent runs as root
      ansible.builtin.assert:
        that:
          - pul_nomad_verify_root.stdout == ''

    - name: Query Consul DNS through BIND
      ansible.builtin.command: dig @127.0.0.1 consul.service.consul +short
      register: pul_nomad_verify_dns
      changed_when: false

    - name: Verify Consul DNS through BIND
      ansible.builtin.assert:
        that:
          - pul_nomad_verify_dns.stdout | length > 0

- name: Verify jobs on the rootless client
  hosts: nomad_servers[0]
  gather_facts: false
  environment:
    NOMAD_TOKEN: "{{ pul_nomad_management_token }}"
  vars:
    pul_nomad_verify_client: "{{ groups['nomad_clients'][0] }}"
  tasks:
    - name: Write test job
      ansible.builtin.copy:
        dest: /tmp/rootless-web.nomad.hcl
        mode: "0644"
        content: |
          job "rootless-web" {
            node_pool = "{{ hostvars[pul_nomad_verify_client]['nomad_node_pool'] }}"
            group "web" {
              network {
                mode = "bridge"
                port "http" { to = 80 }
                port "static" {
                  static = 7777
                  to     = 80
                }
              }
              task "nginx" {
                driver = "docker"
                config {
                  image = "nginx:alpine"
                  ports = ["http", "static"]
                }
                resources {
                  memory = 64
                }
              }
            }
          }

    - name: Run test job
      ansible.builtin.command: nomad job run -detach /tmp/rootless-web.nomad.hcl
      changed_when: true

    - name: Wait for the test job to run
      ansible.builtin.uri:
        url: http://127.0.0.1:4646/v1/job/rootless-web/allocations
        headers:
          X-Nomad-Token: "{{ pul_nomad_management_token }}"
      register: pul_nomad_verify_allocs
      retries: 60
      delay: 5
      until: pul_nomad_verify_allocs.json | selectattr('ClientStatus', 'eq', 'running') | list | length > 0

    - name: Get test job ports
      ansible.builtin.uri:
        url: "http://127.0.0.1:4646/v1/allocation/{{ (pul_nomad_verify_allocs.json | selectattr('ClientStatus', 'eq', 'running') | first).ID }}"
        headers:
          X-Nomad-Token: "{{ pul_nomad_management_token }}"
      register: pul_nomad_verify_alloc

    - name: Request each port from the server
      ansible.builtin.uri:
        url: "http://{{ item.HostIP }}:{{ item.Value }}/"
      loop: "{{ pul_nomad_verify_alloc.json.AllocatedResources.Shared.Ports }}"
      register: pul_nomad_verify_http
      retries: 10
      delay: 3
      until: pul_nomad_verify_http.status == 200
