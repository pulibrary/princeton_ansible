---
- name: pul_nomad | nomad | Check for pre-package install
  ansible.builtin.stat:
    path: /usr/local/bin/nomad
  register: pul_nomad_legacy_binary

- name: pul_nomad | nomad | Remove pre-package systemd unit
  ansible.builtin.file:
    path: /lib/systemd/system/nomad.service
    state: absent
  when: pul_nomad_legacy_binary.stat.exists

- name: pul_nomad | nomad | Install Nomad
  ansible.builtin.apt:
    name: "nomad={{ nomad_version }}-1"
    allow_change_held_packages: true
  notify: restart nomad

- name: pul_nomad | nomad | Hold Nomad package
  ansible.builtin.dpkg_selections:
    name: nomad
    selection: hold

- name: pul_nomad | nomad | Remove pre-package install files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/nomad
    - /var/nomad/plugins
    - /var/nomad/.podman-plugin-version
  notify:
    - reload systemd
    - restart nomad

- name: pul_nomad | nomad | Remove packaged default config
  ansible.builtin.file:
    path: /etc/nomad.d/nomad.hcl
    state: absent
  notify: restart nomad

- name: pul_nomad | nomad | Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nomad.service.d
    state: directory
    mode: "0755"

- name: pul_nomad | nomad | Start Nomad after Consul
  ansible.builtin.copy:
    src: files/nomad/consul.conf
    dest: /etc/systemd/system/nomad.service.d/consul.conf
    mode: "0644"
  notify: reload systemd

- name: pul_nomad | nomad | Create data directory
  ansible.builtin.file:
    dest: /var/nomad
    state: directory
    mode: "0755"
