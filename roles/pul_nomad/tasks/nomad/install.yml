---
- name: pul_nomad | nomad | Install Nomad
  ansible.builtin.apt:
    name: "nomad={{ nomad_version }}-1"
    allow_change_held_packages: true
  notify: restart nomad

- name: pul_nomad | nomad | Hold Nomad package
  ansible.builtin.dpkg_selections:
    name: nomad
    selection: hold

- name: pul_nomad | nomad | Remove packaged default config
  ansible.builtin.file:
    path: /etc/nomad.d/nomad.hcl
    state: absent
  notify: restart nomad

- name: pul_nomad | nomad | Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nomad.service.d
    state: directory
    mode: "0755"

- name: pul_nomad | nomad | Start Nomad after Consul
  ansible.builtin.copy:
    src: files/nomad/consul.conf
    dest: /etc/systemd/system/nomad.service.d/consul.conf
    mode: "0644"
  notify: reload systemd

- name: pul_nomad | nomad | Create data directory
  ansible.builtin.file:
    dest: /var/nomad
    state: directory
    mode: "0755"
