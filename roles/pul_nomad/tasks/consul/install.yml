---
- name: 'pul_nomad | consul | Install OS packages for consul'
  ansible.builtin.apt:
    name:
      - iproute2
      - dmidecode
      - dnsutils
    state: present

- name: 'pul_nomad | consul | Install Consul'
  ansible.builtin.apt:
    name: "consul={{ consul_version }}-1"
    allow_change_held_packages: true
  notify: restart consul

- name: 'pul_nomad | consul | Hold Consul package'
  ansible.builtin.dpkg_selections:
    name: consul
    selection: hold

- name: 'pul_nomad | consul | Remove pre-package install files'
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/consul.service
    - /usr/local/bin/consul
  notify:
    - reload systemd
    - restart consul
