---
- name: Pul_nomad | consul | Gather minimal facts needed for pkg/service handling
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - min
      - distribution
      - pkg_mgr
      - service_mgr
  when:
    - ansible_os_family is not defined
      or ansible_pkg_mgr is not defined
      or ansible_service_mgr is not defined
# Get things like consul_installed_version.
- name: Pul_nomad | consul | Set consul facts
  ansible.builtin.import_tasks: consul_facts.yml

# Install servers first.
# `include_tasks` instead of `import_tasks` makes it safe to use
# `run_once: true` in child tasks, since they'll only execute for servers.
- name: pul_nomad | consul | Install & Configure Servers
  ansible.builtin.include_tasks: server.yml
  when: pul_nomad_role == 'server'

# Install clients.
# `include_tasks` instead of `import_tasks` makes it safe to use
# `run_once: true` in child tasks, since they'll only execute for clients.
- name: pul_nomad | consul | Install & Configure Clients
  ansible.builtin.include_tasks: client.yml
  when: pul_nomad_role == 'client'

# Install ACL Configuration
- name: pul_nomad | consul | Install ACLs
  ansible.builtin.import_tasks: acl.yml

# Create the directory before installing BIND so named-checkconf can validate
# the include during the bind9 role run.
- name: Pul_nomad | consul | Inspect BIND configuration directory
  ansible.builtin.stat:
    path: "{{ pul_nomad_bind9_config_dir }}"
  register: pul_nomad_bind9_config_dir_stat
  tags:
    - bind9
    - dns

- name: Pul_nomad | consul | Ensure BIND configuration directory exists
  ansible.builtin.file:
    path: "{{ pul_nomad_bind9_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not pul_nomad_bind9_config_dir_stat.stat.exists
  tags:
    - bind9
    - dns

- name: Pul_nomad | consul | Configure Consul forwarding zone
  ansible.builtin.template:
    src: consul/consul.conf.j2
    dest: "{{ pul_nomad_bind9_consul_config_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - restart bind
  tags:
    - bind9
    - dns

# Install BIND and forward .consul requests to the local Consul agent.
- name: Pul_nomad | consul | Install BIND
  ansible.builtin.include_role:
    name: bind9
    apply:
      tags:
        - bind9
        - dns
  vars:
    bind9_config_includes:
      - "{{ pul_nomad_bind9_consul_config_file }}"
    # Consul's private zone is intentionally unsigned.
    bind9_dnssec_validation: "no"
    bind9_remove_dnsmasq: true
  tags:
    - bind9
    - dns
