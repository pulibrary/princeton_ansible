---
# defaults file for pul_nomad
tower_github_token: 'blank'
consul_version: '2.0.2'
consul_installed_version: 
nomad_installed_version: 
nomad_version: 2.0.5
nomad_podman_version: 0.6.4
nomad_architecture_map:
  amd64: amd64
  x86_64: amd64
  armv7l: arm
  aarch64: arm64
  32-bit: "386"
  64-bit: amd64
nomad_architecture: "{{ nomad_architecture_map[ansible_architecture] }}"
nomad_host_volumes: []
nomad_meta:
# Containers run in a remapped user namespace, so a uid inside a container owns
# files on the host as that uid plus this offset. Host volumes must be owned by
# the remapped uid for a container to write to them.
nomad_docker_userns_offset: 1000000
nomad_server_group: 'nomad_servers'
nomad_http_address: 'http://127.0.0.1:4646'
pulibrary_nomad_cpu_total_compute:
