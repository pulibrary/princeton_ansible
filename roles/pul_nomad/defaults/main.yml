---
# defaults file for pul_nomad
tower_github_token: 'blank'
consul_version: '2.0.2'
consul_installed_version: 
nomad_installed_version: 
nomad_version: 2.0.5
nomad_podman_version: 0.6.4
nomad_architecture_map:
  amd64: amd64
  x86_64: amd64
  armv7l: arm
  aarch64: arm64
  32-bit: "386"
  64-bit: amd64
nomad_architecture: "{{ nomad_architecture_map[ansible_facts['architecture']] }}"
nomad_host_volumes: []
nomad_meta:
# Containers run in a remapped user namespace, so a uid inside a container owns
# files on the host as that uid plus this offset. Host volumes must be owned by
# the remapped uid for a container to write to them.
nomad_docker_userns_offset: 1000000
nomad_server_group: 'nomad_servers'
nomad_http_address: 'http://127.0.0.1:4646'
nomad_oidc_issuer: '{{ nomad_http_address }}'
pulibrary_nomad_cpu_total_compute:
pul_nomad_rootless: false
pul_nomad_rootless_cidr: '10.41.0.0/24'
pul_nomad_cni_version: '1.6.2'
pul_nomad_cni_url: 'https://github.com/containernetworking/plugins/releases/download'
pul_nomad_user_env: {}
pul_nomad_passt_repo: 'https://passt.top/passt'
pul_nomad_passt_version: 'cba357068dc586e7540971eb40bb56c5e62c4de1'
pul_nomad_rootless_gateway: "{{ ansible_facts['default_ipv4']['gateway'] }}"
pul_nomad_rootless_prefix: "{{ ansible_facts['default_ipv4']['prefix'] }}"
pul_nomad_host_address: "{{ pul_nomad_rootless | ternary('169.254.1.2', '172.17.0.1') }}"
