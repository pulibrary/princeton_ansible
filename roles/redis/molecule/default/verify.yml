---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: check redis package status
    ansible.builtin.apt:
      name: "{{ item }}"
      state: present
    check_mode: true
    register: pkg_status
    loop:
      - redis-server
      - redis-tools
      - python3-redis

  - name: test for redis packages
    ansible.builtin.assert:
      that:
        - not pkg_status.changed

  - name: redis listening on port 6379
    ansible.builtin.command: netstat -tunlp | grep "0.0.0.0:6379 "
    register: process
    changed_when: false
    failed_when:
      - process | length == 0

  - name: redis limits.d sets nofile
    ansible.builtin.command: grep -E 'nofile {{ redis_limit_nofile | default(65536) }}' /etc/security/limits.d/redis.conf
    changed_when: false

  - name: redis-server systemd drop-in sets LimitNOFILE
    ansible.builtin.command: grep -E '^LimitNOFILE={{ redis_limit_nofile | default(65536) }}$' /etc/systemd/system/redis-server.service.d/limits.conf
    changed_when: false
