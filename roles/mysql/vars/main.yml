---
# vars file for mysql
#
#
mysql_name: mariadb  # please be sure that this will install mariadb

mysql_packages:
  - mariadb-server-10.6
  - python3-mysqldb

mysql_client_packages:
  - mysql-client
  - python3-dev
  - default-libmysqlclient-dev

mysql_service: mariadb

mysql_socket: /var/run/mysqld/mysqld.sock

mysql_configuration_options:
  - option: bind-address
    section: mysqld
    value: "{{ mysql_bind_address }}"
  - option: socket
    section: mysqld
    value: "{{ mysql_socket }}"
  - section: mysqld
    option: innodb_buffer_pool_size
    value: "{{ mysql_innodb_buffer_pool_size }}"
  - section: mysqld
    option: innodb_io_capacity
    value: "{{ mysql_innodb_io_capacity }}"
  - section: mysqld
    option: log_error
    value: "{{ mysql_error_log }}"
  - section: mysqld
    option: log_output
    value: FILE
  - section: mysqld
    option: slow_query_log
    value: "{{ 1 if mysql_slow_query_log else 0 }}"
  - section: mysqld
    option: slow_query_log_file
    value: "{{ mysql_slow_query_log_file }}"
  - section: mysqld
    option: long_query_time
    value: "{{ mysql_long_query_time }}"

mysql_configuration_destination: /etc/mysql/mariadb.conf.d

mariadb_repo: "http://sfo1.mirrors.digitalocean.com/mariadb/repo/10.3/ubuntu"
