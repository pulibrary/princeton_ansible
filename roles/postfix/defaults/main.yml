---
# defaults file for roles/postfix
postfix_smtp_relay_host: "localhost"
postfix_smtp_relay_port: 25
postfix_smtp_relay_username: ""
postfix_smtp_relay_password: ""
domain_name: "{{ inventory_hostname }}"
# rsyslog writes the mail facility here as one JSON object per line, which the
# OpenTelemetry Collector ships to SigNoz.
postfix_json_log_path: /var/log/mail.log
