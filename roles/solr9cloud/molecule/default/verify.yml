# molecule/default/verify.yml
---
- name: Verify
  hosts: all
  become: true
  vars:
    solr_home: /solr
    solr_data_dir: "{{ solr_home }}/data"
  tasks:
    - name: Verify solr.in.sh is configured
      ansible.builtin.stat:
        path: /opt/solr/bin/solr.in.sh
      register: solr_in_sh_check
      failed_when: solr_in_sh_check.stat.exists == false

    - name: Verify solr.xml is configured
      ansible.builtin.stat:
        path: "{{ solr_data_dir }}/solr.xml"
      register: solr_xml_check
      failed_when: solr_xml_check.stat.exists == false

    - name: Verify log4j2.xml is configured
      ansible.builtin.stat:
        path: /solr/log4j2.xml
      register: log4j2_check
      failed_when: log4j2_check.stat.exists == false

    - name: Read logging configuration
      ansible.builtin.slurp:
        src: /solr/log4j2.xml
      register: solr_log4j2_config

    - name: Read JSON log layout
      ansible.builtin.slurp:
        src: /solr/log4j2-json-layout.json
      register: solr_json_layout

    - name: Verify logs are written as JSON
      ansible.builtin.assert:
        that:
          - "'JsonTemplateLayout' in log4j2_config"
          - "'PatternLayout' not in log4j2_config"
          - json_layout.timestamp is defined
          - json_layout.level is defined
          - json_layout.message is defined
        fail_msg: Solr logging is not configured for JSON output
      vars:
        log4j2_config: "{{ solr_log4j2_config.content | b64decode }}"
        json_layout: "{{ solr_json_layout.content | b64decode | from_json }}"
