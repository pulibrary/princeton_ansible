---
solr_cloud_download_version: "{{ solr_version | default('9.9.0') }}"
solr_cloud_build_name: "solr-{{ solr_cloud_download_version }}"
solr_cloud_package: "{{ solr_cloud_build_name }}.tgz"

# STABLE CANONICAL URL - will never break regardless of where files are stored
# The nginx config handles routing to the actual location
solr_cloud_url: "https://pulmirror.princeton.edu/mirror/solr/{{ solr_cloud_download_version }}/{{ solr_cloud_package }}"

solr_trust_forwarded_headers: false

## Service options
# Owner
solr_user: deploy
solr_group: deploy

# start on boot
solr_service_enabled: true
solr_service_state: started

# Files & Paths - SIMPLIFIED FOR CONSISTENCY
solr_home: /solr
solr_data_dir: "{{ solr_home }}/data"
solr_data_home: "{{ solr_home }}"
solr_log_dir: "{{ solr_data_home }}/logs"
solr_log4j_path: "{{ solr_data_home }}/log4j2.xml"

# Installation directories - SIMPLIFIED FOR CONSISTENCY
solr_install_dir: "/opt"
solr_versioned_dir: "/opt/solr-{{ solr_cloud_download_version }}" # Version-specific directory
solr_installation: "/opt/solr" # Symlink to versioned directory
solr_bin: "{{ solr_installation }}/bin/solr" # Path to solr binary

# put the PID directly in /run
# subdirectories of /run get deleted on reboot
solr_pid_dir: "/run/solr"

# Ports
solr_port: 8983
solr_jmx_enabled: "true"
solr_jmx_port: 1099
solr_host: "{{ inventory_hostname }}"

# JVM settings
solr_stack_size: 256k
solr_heap: "{{ solr_heap_setting | default('20g') }}"

# GC tuning
solr_gc_tune: "-XX:NewRatio=3 \
  -XX:SurvivorRatio=4 \
  -XX:TargetSurvivorRatio=90 \
  -XX:MaxTenuringThreshold=8 \
  -XX:ConcGCThreads=4 \
  -XX:ParallelGCThreads=4 \
  -XX:PretenureSizeThreshold=64m \
  -XX:+ParallelRefProcEnabled"

# GC logging settings. The JVM writes these directly and its -Xlog framework
# has no JSON output, so this file stays plain text.
solr_gc_log_file: "{{ solr_log_dir }}/solr_gc.log"
solr_gc_log_file_count: 9
solr_gc_log_file_size: 20M
solr_gc_log_opts: "-Xlog:gc*:file={{ solr_gc_log_file }}\
  :time,uptime,level,tags\
  :filecount={{ solr_gc_log_file_count }},filesize={{ solr_gc_log_file_size }}"

# ZooKeeper configuration
solr_zookeeper_hosts:
  - "sandbox-zk1.lib.princeton.edu:2181"
  - "sandbox-zk2.lib.princeton.edu:2181"
  - "sandbox-zk3.lib.princeton.edu:2181"

# Set zookeeper connection string
solr_zookeeper_hosts_string: "{{ solr_zookeeper_hosts | join(',') }}"

# LOG settings
log_root_level: WARN
log_file_size: 500MB
log_max_backup_index: 9
solr_log_root_level: "{{ log_root_level }}"
solr_log_file_size: "{{ log_file_size }}"
solr_log_max_backup_index: "{{ log_max_backup_index }}"

# Write solr.log, solr_slow_requests.log, the Jetty access log and the
# console log as one JSON object per line. Set to false to fall back to the
# plain text layout below.
solr_log_json_enabled: true
solr_log_json_layout_path: "{{ solr_data_home }}/log4j2-json-layout.json"
solr_log_json_service_name: solr
solr_log_pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p (%t) \
  [%notEmpty{c:%X{collection}}%notEmpty{ s:%X{shard}}\
  %notEmpty{ r:%X{replica}}%notEmpty{ x:%X{core}}\
  %notEmpty{ t:%X{trace_id}}] %c{1.} %m%n"

# Jetty writes its access log through Log4j, so it lands in a single rotated
# file instead of one plain text file per day.
solr_request_log_file: "{{ solr_log_dir }}/solr_request.log"
solr_request_log_logger: org.eclipse.jetty.server.RequestLog
solr_request_log_format: '%{client}a - %u "%r" %s %O %{ms}T'
# Daily files left behind by the previous Jetty access log writer.
solr_legacy_request_log_pattern: "[0-9][0-9][0-9][0-9]_[0-9][0-9]_[0-9][0-9].request.log"

# Security settings
solr_use_security: false
solr_block_unknown_users: false
solr_admin_password: "SolrRocks"

# cloud backup
gcs_bucket_name: "pul-solr-backup"
gcs_enable_logging: true
