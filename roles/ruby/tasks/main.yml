---
- name: Ruby | install the dependencies
  ansible.builtin.apt:
    name: software-properties-common
    state: present

- name: Ruby | remove legacy Brightbox apt source list
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/brightbox-ubuntu-ruby-ng-{{ ansible_facts['distribution_release'] }}.list"
    state: absent

- name: Ruby | Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ruby | add the Brightbox repository
  ansible.builtin.deb822_repository:
    name: brightbox-ruby-ng
    types: [deb]
    uris: https://ppa.launchpadcontent.net/brightbox/ruby-ng/ubuntu
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xFC1E65C4D60181C7E0A0116F8872ED2718602E9E"
    state: present

- name: Ruby | Update apt cache after adding repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  register: repo_cache_update
  retries: 3
  delay: 5
  until: repo_cache_update is succeeded

- name: Ruby | check version
  ansible.builtin.command: ruby -v
  register: installed_ruby
  ignore_errors: true
  changed_when: false

- name: Ruby | install Ruby "{{ ruby_version }}"
  ansible.builtin.apt:
    name: ["{{ ruby_version }}", "{{ ruby_version }}-dev", "ruby-switch"]
    state: present
  when: installed_ruby.rc !=0 or installed_ruby.stdout.split()[1] != ruby_version
  register: packages_installed

- name: Ruby | switch to Ruby "{{ ruby_version }}" release for the system default
  ansible.builtin.command: ruby-switch --set "{{ ruby_version }}"
  when: installed_ruby.rc !=0 or installed_ruby.stdout.split()[1] != ruby_version
  changed_when: false

- name: Ruby | uninstall bundler to get specific version
  community.general.gem:
    name: bundler
    state: absent
    user_install: false
  changed_when: false
  when: bundler_version is defined

- name: Ruby | install global bundler, specific version
  community.general.gem:
    name: bundler
    version: "{{ bundler_version }}"
    user_install: false
  when: bundler_version is defined
  changed_when: false

- name: Ruby | install global bundler, any version
  community.general.gem:
    name: bundler
    user_install: false
  when: bundler_version is undefined
