---
scenario:
  name: default
driver:
  name: docker
platforms:
  - name: instance
    image: "ghcr.io/pulibrary/vm-builds/almalinux-10:latest"
    command: "" # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    create: create.yml
    destroy: destroy.yml
  log: true
verifier:
  name: ansible
