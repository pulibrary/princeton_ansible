---
# Entra requires an "x5t" header on the client assertion. mod_auth_openidc
# added it in 2.4.11 and it was broken from 2.4.13 until 2.4.16.4, so EL8
# (2.4.9.x) cannot use private_key_jwt against Entra.
- name: Httpd | gather package facts
  ansible.builtin.package_facts:

- name: Httpd | assert mod_auth_openidc supports private_key_jwt with Entra
  ansible.builtin.assert:
    that:
      - ansible_facts['packages']['mod_auth_openidc'][0]['version'] is version('2.4.16.4', '>=')
    fail_msg: >-
      mod_auth_openidc {{ ansible_facts['packages']['mod_auth_openidc'][0]['version'] }}
      cannot do private_key_jwt with Entra ID (needs >= 2.4.16.4, EL9+).
      Use httpd_oidc_client_auth: client_secret on this host.

- name: Httpd | create OIDC key directory
  ansible.builtin.file:
    path: "{{ httpd_oidc_key_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Httpd | install OIDC private key
  ansible.builtin.copy:
    src: "{{ httpd_oidc_private_key_src }}"
    dest: "{{ httpd_oidc_key_dir }}/client.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart httpd

- name: Httpd | install OIDC certificate
  ansible.builtin.copy:
    src: "{{ httpd_oidc_certificate_src }}"
    dest: "{{ httpd_oidc_key_dir }}/client.crt"
    owner: root
    group: root
    mode: "0644"
  notify: restart httpd

- name: Httpd | read OIDC certificate thumbprint
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -noout
      - -fingerprint
      - -sha1
      - -in
      - "{{ httpd_oidc_key_dir }}/client.crt"
  register: httpd_oidc_thumbprint
  changed_when: false

- name: Httpd | Entra certificate instructions
  ansible.builtin.debug:
    msg: >-
      The certificate under Certificates & secrets on the app registration
      must have thumbprint
      {{ httpd_oidc_thumbprint.stdout.split('=')[-1] | replace(':', '') }}.
