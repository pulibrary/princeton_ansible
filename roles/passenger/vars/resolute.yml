---
nginx_version: "1.28.3-2ubuntu1.12"
passenger_version: "1:6.2.1-1~resolute1"
# Phusion rebuilds the module against each Ubuntu nginx update; the module
# package then carries a buildN suffix and pins nginx-common exactly.
passenger_module_version: "1:6.2.1-1~resolute1build1"

nginx_package_names:
  - nginx-core
  - nginx-common

passenger_package_specs:
  - "passenger={{ passenger_version }}"
  - "libnginx-mod-http-passenger={{ passenger_module_version }}"
