---
# tasks file for roles/beyla
- name: Beyla | Ensure install, config and release directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ [beyla_install_dir, beyla_config_dir, beyla_releases_dir,
        beyla_release_dir, beyla_download_dir] | unique }}
  when: beyla_enabled | bool

- name: Beyla | Look for an already downloaded release archive
  ansible.builtin.stat:
    path: "{{ beyla_archive_path }}"
    get_checksum: false
  register: beyla_archive
  when: beyla_enabled | bool

- name: Beyla | Download amd64 release archive
  ansible.builtin.get_url:
    url: "{{ beyla_download_url }}"
    dest: "{{ beyla_archive_path }}"
    mode: "0644"
    force: false
  when:
    - beyla_enabled | bool
    - not beyla_archive.stat.exists

- name: Beyla | Unarchive release
  ansible.builtin.unarchive:
    src: "{{ beyla_archive_path }}"
    dest: "{{ beyla_release_dir }}"
    remote_src: true
    creates: "{{ beyla_release_binary }}"
  when: beyla_enabled | bool

- name: Beyla | Install binary
  ansible.builtin.copy:
    src: "{{ beyla_release_binary }}"
    dest: "{{ beyla_binary_path }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart beyla
  when: beyla_enabled | bool

- name: Beyla | Template config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ beyla_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart beyla
  when: beyla_enabled | bool

- name: Beyla | Template environment file
  ansible.builtin.template:
    src: beyla.env.j2
    dest: "{{ beyla_env_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart beyla
  when: beyla_enabled | bool

- name: Beyla | Install systemd unit
  ansible.builtin.template:
    src: beyla.service.j2
    dest: /etc/systemd/system/beyla.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart beyla
  when: beyla_enabled | bool

- name: Beyla | Enable and start service
  ansible.builtin.systemd:
    name: beyla
    enabled: true
    state: started
    daemon_reload: true
  when: beyla_enabled | bool
