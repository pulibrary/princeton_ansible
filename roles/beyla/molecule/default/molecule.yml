---
scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
platforms:
  - name: beyla-instance
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-22.04"
    command: "" # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  # Beyla is enabled for every host below, so this one checks that membership
  # of an excluded group still keeps it off.
  - name: beyla-qa-instance
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-22.04"
    command: ""
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - qa
provisioner:
  name: ansible
  # Molecule no longer puts the repository's roles directory on the role
  # search path, so playbooks cannot find roles by name without this.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    create: create.yml
    destroy: destroy.yml
  log: true
  inventory:
    group_vars:
      all:
        beyla_enabled: true
        beyla_service_name: molecule-app
        beyla_environment: molecule
        beyla_bpf_context_propagation: "all"
        beyla_open_ports:
          - 80
verifier:
  name: ansible
