---
# Ensure dpkg-divert module is available (collection must be installed)
# ansible-galaxy collection install community.general
- name: Himmelblau | gather file state
  ansible.builtin.stat:
    path: "/etc/pam.d/{{ item }}"
  loop:
    - common-auth
    - common-account
    - common-session
    - common-password
  register: _pam_orig

- name: Himmelblau | gather .distrib state
  ansible.builtin.stat:
    path: "/etc/pam.d/{{ item }}.distrib"
  loop:
    - common-auth
    - common-account
    - common-session
    - common-password
  register: _pam_distrib
  failed_when: false

- name: Himmelblau | register dpkg-divert (no rename) for each file
  community.general.dpkg_divert:
    path: "/etc/pam.d/{{ item }}"
    divert: "/etc/pam.d/{{ item }}.distrib"
    state: present
    rename: false
  loop:
    - common-auth
    - common-account
    - common-session
    - common-password

# If original exists and diverted copy doesn't yet, save one-time copy
- name: Ubuntu PAM (strict) | seed .distrib from current file when needed
  ansible.builtin.copy:
    src: "/etc/pam.d/{{ item.item }}"
    dest: "/etc/pam.d/{{ item.item }}.distrib"
    remote_src: true
    force: false
    mode: "0644"
  loop: "{{ _pam_distrib.results }}"
  loop_control:
    label: "/etc/pam.d/{{ item.item }}"
  when:
    - (_pam_orig.results | selectattr('item','equalto', item.item) | list)[0].stat.exists | default(false)
    - not item.stat.exists | default(false)

- name: Himmelblau | write the strict PAM stacks
  ansible.builtin.template:
    src: "pam-{{ item }}.j2"
    dest: "/etc/pam.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    # A malformed PAM stack locks everyone out, so never install one that
    # Jinja could not render or that lost lines to a truncated write.
    validate: "grep -q pam_himmelblau.so %s"
  loop:
    - common-auth
    - common-account
    - common-session
    - common-password
