---
# tasks file for roles/himmelblau_entra_id
#
- name: Himmelblau | verify the host is supported
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: >-
      himmelblau_entra_id only supports Debian family (Ubuntu) hosts,
      but {{ inventory_hostname }} reports ansible_os_family={{ ansible_os_family }}.
    quiet: true

- name: Himmelblau | include Ubuntu tasks
  ansible.builtin.include_tasks: ubuntu.yml
