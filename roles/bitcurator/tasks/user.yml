---
- name: Bitcurator | create admin group
  ansible.builtin.group:
    name: "{{ admin_user }}"
    gid: "{{ bitcurator_admin_gid }}"
    state: present

- name: Bitcurator | create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: "{{ bitcurator_admin_uid }}"
    group: "{{ admin_user }}"
    state: present
    create_home: true
    shell: /bin/bash
    groups: sudo
    append: true

- name: Bitcurator | add members to the admin group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ admin_user }}"
    append: true
  loop: "{{ bitcurator_admin_group_members }}"

- name: Bitcurator | set admin password when provided
  ansible.builtin.user:
    name: "{{ admin_user }}"
    password: "{{ admin_user_password }}"
  when: admin_user_password is defined
  no_log: true

# The working directories are shared with the admin group. setgid keeps new
# files in that group; members' sessions get umask 002 from pam_umask
# (USERGROUPS_ENAB), so those files are group-writable too.
- name: Bitcurator | create base directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(admin_user) }}"
    group: "{{ item.group | default(admin_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ admin_home }}" }
    - { path: "{{ admin_home }}/Desktop", mode: "{{ bitcurator_shared_dir_mode }}" }
    - { path: "{{ apps_dir }}", mode: "{{ bitcurator_shared_dir_mode }}" }
    - { path: "{{ download_dir }}", owner: "root", group: "root" }
    - { path: "{{ scripts_dir }}", mode: "{{ bitcurator_shared_dir_mode }}" }

- name: Bitcurator | ensure xfconf directory exists
  ansible.builtin.file:
    path: "{{ admin_home }}/.config/xfce4/xfconf/xfce-perchannel-xml"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
