# tasks/repos.yml
---
- name: Remove legacy universe/multiverse apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
    state: absent

- name: Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

# Signed-By must match the stock ubuntu.sources entry for the same archive,
# otherwise apt refuses to load the conflicting sources.
- name: Ensure universe and multiverse repos are enabled
  ansible.builtin.deb822_repository:
    name: ubuntu-universe-multiverse
    types: [deb]
    uris: http://archive.ubuntu.com/ubuntu
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [universe, multiverse]
    signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg
    state: present
