---
- name: Verify
  hosts: all
  become: true
  vars:
    step_ca_path: /etc/step-ca
  tasks:
    - name: Stat key CA artefacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ step_ca_path }}/config/ca.json"
        - "{{ step_ca_path }}/certs/ssh_user_ca_key.pub"
        - "{{ step_ca_path }}/certs/ssh_host_ca_key.pub"
        - "{{ step_ca_path }}/templates/ssh/pulsys.tpl"
      register: ca_artefacts

    - name: Assert all CA artefacts exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing {{ item.item }}"
      loop: "{{ ca_artefacts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: List the STEPPATH directory
      ansible.builtin.find:
        paths: "{{ step_ca_path }}"
        file_type: file
      register: ca_files

    - name: Read ca.json
      ansible.builtin.slurp:
        src: "{{ step_ca_path }}/config/ca.json"
      register: ca_json_raw

    # An encryptedKey is served by /provisioners and would let whoever knows
    # its password mint certificates; init's JWK provisioner must be gone.
    - name: Assert no provisioner carries an encrypted private key
      ansible.builtin.assert:
        that:
          - (ca_json_raw.content | b64decode | from_json).authority.provisioners | selectattr('encryptedKey', 'defined') | list | length == 0
          - "'init-provisioner-password.txt' not in (ca_files.files | map(attribute='path') | map('basename') | list)"

    - name: Confirm the service is active
      ansible.builtin.systemd_service:
        name: step-ca
      register: stepca_unit

    - name: Assert step-ca is running
      ansible.builtin.assert:
        that:
          - stepca_unit.status.ActiveState == 'active'
