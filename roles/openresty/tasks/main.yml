---
# roles/openresty
- name: Openresty | install package on FreeBSD
  ansible.builtin.pkgng:
    name: "{{ openresty_package }}"
    state: present

- name: Openresty | ensure log directory exists
  ansible.builtin.file:
    path: "{{ openresty_log_dir }}"
    state: directory
    owner: "{{ openresty_user }}"
    group: "{{ openresty_group }}"
    mode: "0755"

- name: Openresty | ensure newsyslog.conf.d directory exists
  ansible.builtin.file:
    path: /usr/local/etc/newsyslog.conf.d
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: Openresty | configure newsyslog rotation for nginx logs
  ansible.builtin.copy:
    dest: /usr/local/etc/newsyslog.conf.d/nginx.conf
    owner: root
    group: wheel
    mode: "0644"
    content: |
      # logfilename [owner:group] mode count size when flags [/pid_file] [sig_num]
      # sig 30 = SIGUSR1, tells nginx to reopen its log files
      {{ openresty_log_dir }}/*.log {{ openresty_user }}:{{ openresty_group }} 644 {{ openresty_newsyslog_count }}
      {{- ' ' }}{{ openresty_newsyslog_size_kb }} {{ openresty_newsyslog_when }} GJ {{ openresty_pid_path }} 30

- name: Openresty | ensure conf.d directory exists
  ansible.builtin.file:
    path: "{{ openresty_etc_dir }}/conf.d"
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: Openresty | ensure globalprotect_ips.conf exists
  ansible.builtin.copy:
    dest: "{{ openresty_etc_dir }}/conf.d/globalprotect_ips.conf"
    content: "# placeholder; populated by globalprotect-updater\n"
    force: false
    owner: root
    group: wheel
    mode: "0644"
  when: openresty_real_ip_enable | default(false)

- name: Openresty | ensure ACME webroot exists
  ansible.builtin.file:
    path: "{{ openresty_acme_webroot }}"
    state: directory
    owner: "{{ openresty_user }}"
    group: "{{ openresty_group }}"
    mode: "0755"

- name: Openresty | install acme-challenge include
  ansible.builtin.template:
    src: acme-challenge.conf.j2
    dest: "{{ openresty_etc_dir }}/conf.d/acme-challenge.conf"
    owner: root
    group: wheel
    mode: "0644"
  notify: reload openresty

- name: Openresty | install restrict include
  ansible.builtin.template:
    src: restrict.conf.j2
    dest: "{{ openresty_etc_dir }}/conf.d/restrict.conf"
    owner: root
    group: wheel
    mode: "0644"
  notify: reload openresty

- name: Openresty | configure altcha sidecar
  ansible.builtin.include_tasks: altcha.yml
  when: openresty_altcha_enable | bool

- name: Openresty | render main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ openresty_etc_dir }}/nginx.conf"
    owner: root
    group: wheel
    mode: "0644"
  notify: reload openresty

- name: Openresty | enable nginx service in rc.conf
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^nginx_enable='
    line: 'nginx_enable="YES"'
    create: true
    mode: "0644"

- name: Openresty | start nginx
  ansible.builtin.service:
    name: "{{ openresty_service }}"
    state: started
    enabled: true
