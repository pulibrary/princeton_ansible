---
postgres_database_encoding: "UTF8"
postgres_database_locale: "{{ postgres_locale }}"
postgres_database_lc_collate: "{{ postgres_database_locale }}"
postgres_database_lc_ctype: "{{ postgres_database_locale }}"
postgres_database_template: "template0"

postgresql_system_databases:
  - postgres
  - template0
  - template1

postgres_host: null
# PostgreSQL-related settings
postgres_max_connections: 400
application_dbuser_role_attr_flags: ''
# https://wiki.postgresql.org/wiki/Tuning_Your_PostgreSQL_Server
# 1/4 memory to Shared Buffers
buffer_memory: '{{ ([(ansible_memtotal_mb*0.25)|int|abs, 128]|max) | default(128) }}MB'
# A little less than 3/4 of memory to effective_cache_size
cache_size: '{{ ([(ansible_memtotal_mb*0.6)|int|abs, 4000]|max) | default(4000) }}MB'
# https://www.enterprisedb.com/postgres-tutorials/how-tune-postgresql-memory
# 25% of ram dedicated to work if all connections(400) maxed, or 4 MB each.
work_mem: '{{ ([((ansible_memtotal_mb*0.25/400)|int|abs), 4]|max) }}MB'
# 5% of ram dedicated to maintenance work
maintenance_work_mem: '{{ ([(ansible_memtotal_mb*0.05)|int|abs, 64]|max)}}MB'
min_wal: '{{ one_gig | default("80MB") }}'
max_wal: '{{ two_gig | default("1GB") }}'
# APT settings
postgres_apt_key_id: ACCC4CF8
postgres_apt_key_url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
postgres_apt_repository: "deb [signed-by={{ postgres_keyring_path }}] http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"
# Path for the PostgreSQL GPG keyring (Modern Ubuntu/Debian standard)
postgres_keyring_path: "/usr/share/keyrings/postgresql-archive-keyring.gpg"
# Pin-Priority of PGDG repository
postgres_apt_pin_priority: 500
postgres_version: 15
apt_cache_timeout: 86400
application_dbuser_name: "pguser"
application_dbuser_password: "changethis"
application_db_name: "dbname"
# Warm Standby Variables
postgresql_cluster_member: false
postgresql_leader: true
postgresql_replication_leader: false
postgresql_replication_password: "{{ vault_postgresql_replication_password }}"
postgresql_cluster_hosts:
postgresql_cluster: false
# Logical replication (used for upgrading between postgresql versions)
postgresql_logical_replication: false

postgres_database_owner: "postgres"
postgres_cluster_name: "main"

db_clusteradmin_password: "changethis"
postgres_admin_password: "change"
sudoers_dir: "/etc/sudoers.d"
postgres_locale_parts:
  - "en_US"  # Locale
  - "UTF-8"  # Encoding
postgres_locale: "{{ postgres_locale_parts | join('.') }}"
postgres_ctype_parts:
  - "en_US"  # Locale
  - "UTF-8"  # Encoding
postgres_ctype: "{{ postgres_ctype_parts | join('.') }}"

postgres_env:
  LANG: "{{ postgres_locale }}"
  LC_ALL: "{{ postgres_locale }}"
  LC_CTYPE: "{{ postgres_ctype }}"

# Extensions
postgres_ext_install_contrib: true
postgres_ext_install_dev_headers: true
postgres_ext_install_postgis: true
postgres_database_extensions: []

postgres_ext_postgis_version: "3"
postgres_ext_postgis_deps:
  - postgresql-{{ postgres_version }}-pgrouting-scripts
  - postgresql-{{ postgres_version }}-postgis-{{ postgres_ext_postgis_version }}
  - postgresql-{{ postgres_version }}-postgis-{{ postgres_ext_postgis_version }}-scripts

# HBA Connections
postgres_hba_entries: []
pg_hba_postgresql_user: "all"
pg_hba_postgresql_database: "all"
# test if we can use "{{ application_dbuser_name }}" and "{{ application_db_name }}"
# and the user can still create a database
pg_hba_method: "md5"
pg_hba_source: "host"

# TCP settings
# 0 is the default, which means "pull from the system"
# Documentation: https://www.postgresql.org/docs/current/runtime-config-connection.html#RUNTIME-CONFIG-TCP-SETTINGS
# The number is in seconds.
postgres_tcp_keepalives_idle: 0
postgres_tcp_keepalives_interval: 0
postgres_tcp_keepalives_count: 0

# bypass molecule test
postgres_leader: localhost

# cloud backup
# gcsfuse mounts a GCS bucket so PostgreSQL dumps land in object storage.
# We only back up production, so this stays off everywhere else.
postgres_gcs_backup_enabled: false
postgres_gcs_backup_environment: "production"
postgres_gcs_bucket_name: "pul-postgres-backup"
postgres_gcs_mountpoint: "/var/backups/postgresql/cloud_backup"
postgres_gcs_key_path: "/etc/postgres-backup-account-key.json"
postgres_gcs_key_src: "files/postgres-backup-production-account-key.json"
postgres_gcs_service_name: "postgres-gcs-backup.service"
postgres_gcs_user: "postgres"
postgres_gcs_group: "postgres"
postgres_gcsfuse_directory: "/var/log/gcsfuse"
# Where gcsfuse stages writes before uploading. Before v3.0 it stages an entire
# file here, so this needs room for the largest dump and defaults to /tmp if
# left unset.
postgres_gcsfuse_temp_directory: "/var/backups/postgresql/gcsfuse-tmp"
postgres_backup_prefix: "postgresql{{ postgres_version }}"
postgres_backup_file_suffix: ".dump"
postgresql_gcsfuse_logrotate_rules: []

# Scheduled dumps
# Rotated daily/weekly/monthly dumps of every database, modeled on
# https://wiki.postgresql.org/wiki/Automated_Backup_on_Linux
postgres_backup_schedule_enabled: false
postgres_backup_root: >-
  {{ postgres_gcs_mountpoint }}/{{ postgres_backup_prefix }}/{{ postgres_gcs_backup_environment }}
postgres_backup_staging_dir: "/var/backups/postgresql/staging"
postgres_backup_script_path: "/usr/local/bin/pg_backup_rotated.sh"
postgres_backup_service_name: "postgres-backup.service"
postgres_backup_timer_name: "postgres-backup.timer"
postgres_backup_bin_dir: "/usr/lib/postgresql/{{ postgres_version }}/bin"
postgres_backup_user: "postgres"
postgres_backup_host: ""
# Dumps run overnight; the delay keeps a fleet from starting in lockstep.
postgres_backup_on_calendar: "*-*-* 01:30:00"
postgres_backup_randomized_delay: "900"
postgres_backup_timeout: "6h"
postgres_backup_nice: 10
# The idle I/O class yields to all other disk activity, which can stall a dump
# on a busy server indefinitely. Lowest-priority best-effort still defers to
# PostgreSQL without starving.
postgres_backup_io_class: "best-effort"
postgres_backup_io_priority: 7
postgres_backup_compression_level: 6
# Staging the dump and then uploading it can each hold a full copy on local
# disk, so free space is checked against this multiple of the largest database.
# gcsfuse 3.0 and later stream writes straight to the bucket and need no second
# local copy, so 1 is right for those hosts.
postgres_backup_space_factor: 2
# Hard floor: a dump is aborted rather than allowed to fill the filesystem that
# also holds PostgreSQL's data directory. An incomplete backup beats an outage.
postgres_backup_min_free_mb: 10240
postgres_backup_space_guard_interval: 10
# A dump can outlive a PostgreSQL restart (maintenance, a config reload, an
# Ansible run), which drops its connection mid-table. Retrying makes that a
# pause instead of a failed backup.
postgres_backup_retries: 2
postgres_backup_retry_delay: 60
postgres_backup_startup_wait: 300
# Custom-format dumps restore selectively with pg_restore; plain SQL is
# bulkier and off by default.
postgres_backup_enable_custom: true
postgres_backup_enable_plain: false
postgres_backup_enable_globals: true
postgres_backup_schema_only_databases: []
postgres_backup_exclude_databases: []
# Retention. 7 = Sunday for the weekly copy.
postgres_backup_days_to_keep: 7
postgres_backup_weeks_to_keep: 5
postgres_backup_months_to_keep: 3
postgres_backup_day_of_week_to_keep: 7
# Force a run during the play even when backups already exist.
postgres_backup_run_now: false
