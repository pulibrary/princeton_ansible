---
- name: Ubuntu | Make sure the CA certificates are available
  ansible.builtin.apt:
    pkg: ca-certificates
    state: present

- name: Ubuntu | Download PostgreSQL GPG key (ASCII)
  ansible.builtin.get_url:
    url: "{{ postgres_apt_key_url }}"
    dest: "/tmp/postgresql.key"
    mode: '0644'

- name: Ubuntu | De-armor PostgreSQL GPG key to binary keyring
  ansible.builtin.shell: "gpg --dearmor < /tmp/postgresql.key > {{ postgres_keyring_path }}"
  args:
    creates: "{{ postgres_keyring_path }}"
  become: true

- name: Ubuntu | Ensure keyring permissions
  ansible.builtin.file:
    path: "{{ postgres_keyring_path }}"
    mode: '0644'
    owner: root
    group: root
    state: file

- name: Ubuntu | Remove legacy/conflicting repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/apt_postgresql_org_pub_repos_apt.list
    - /etc/apt/sources.list.d/pul_postgresql.list
    - /etc/apt/sources.list.d/postgresql.list
  become: true

- name: Ubuntu | Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ubuntu | Add PostgreSQL APT repository
  ansible.builtin.deb822_repository:
    name: postgresql
    types: [deb]
    uris: "{{ postgresql_apt_repo_uri }}"
    suites: ["{{ ansible_facts['distribution_release'] }}-pgdg"]
    components: [main]
    signed_by: "{{ postgres_keyring_path }}"
    state: present
  register: postgresql_apt_repo

- name: Ubuntu | Update apt cache after adding PostgreSQL repository
  ansible.builtin.apt:
    update_cache: true
  when: postgresql_apt_repo is changed

- name: PostgreSQL | ensure locale package is installed
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: PostgreSQL | enable postgres locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#?{{ postgres_locale }} UTF-8"
    line: "{{ postgres_locale }} UTF-8"
  when: ansible_facts['os_family'] == "Debian"
  register: postgres_locale_enabled

- name: PostgreSQL | generate postgres locale
  ansible.builtin.command: locale-gen
  environment: "{{ postgres_env }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - postgres_locale_enabled.changed

- name: Ubuntu | install postgresql server packages
  ansible.builtin.apt:
    name: '{{ item }}'
    state: present
  environment: "{{ postgres_env }}"
  loop:
    - "{{ postgres_packages }}"

- name: PostgreSQL | Prefer PGDG PostgreSQL packages
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/postgresql-pgdg
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: postgresql-client-* postgresql-* libpq5 libpq-dev
      Pin: origin apt.postgresql.org
      Pin-Priority: 1001

- name: PostgreSQL | update apt cache after PGDG pinning
  ansible.builtin.apt:
    update_cache: true
  tags: molecule-idempotence-notest

- name: Ubuntu | install postgresql client packages
  ansible.builtin.apt:
    name: '{{ item }}'
    state: present
  loop:
    - "{{ postgres_client_packages }}"
  changed_when: false

- name: Ubuntu | add extensions
  ansible.builtin.import_tasks: extensions.yml

- name: Ubuntu | install configuration file
  ansible.builtin.template:
    src: 'postgresql.conf.j2'
    dest: '/etc/postgresql/{{ postgres_version }}/main/postgresql.conf'
    group: postgres
    owner: postgres
    mode: "0644"
  register: configure_postgres
  notify: restart postgresql

- name: Ubuntu | install pg_stats file
  ansible.builtin.template:
    src: 'statistics_conf.j2'
    dest: '/etc/postgresql/{{ postgres_version }}/main/conf.d/statistics.conf'
    group: postgres
    owner: postgres
    mode: "0644"
  register: configure_postgres
  notify: restart postgresql
