---
- name: Entraid_join | Install Ubuntu prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - software-properties-common
    state: present
    update_cache: true

- name: Entraid_join | Install Himmelblau apt signing key
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://packages.himmelblau-idm.org/himmelblau.asc \
      | gpg --dearmor -o /etc/apt/trusted.gpg.d/himmelblau.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/trusted.gpg.d/himmelblau.gpg

- name: Entraid_join | Remove legacy Himmelblau apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/himmelblau.list
    state: absent

- name: Entraid_join | Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

# The package install below refreshes the apt cache.
- name: Entraid_join | Configure Himmelblau apt repository
  ansible.builtin.deb822_repository:
    name: himmelblau
    types: [deb]
    uris: "https://packages.himmelblau-idm.org/{{ entraid_join_himmelblau_channel }}/deb/{{ entraid_join_ubuntu_repo_release }}/"
    suites: ["./"]
    architectures: [amd64]
    state: present

- name: Entraid_join | Install Himmelblau packages on Ubuntu
  ansible.builtin.apt:
    name: "{{ entraid_join_ubuntu_packages }}"
    state: present
    update_cache: true
