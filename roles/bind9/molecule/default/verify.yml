---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    bind9_expected_packages:
      - bind9
      - bind9-utils
  tasks:
    - name: Check bind9 package status
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      check_mode: true
      register: bind9_pkg_status
      loop: "{{ bind9_expected_packages }}"

    - name: Test for bind9 packages
      ansible.builtin.assert:
        that:
          - not bind9_pkg_status.changed

    - name: Read named startup options
      ansible.builtin.slurp:
        src: /etc/default/named
      register: bind9_named_defaults

    - name: Test that named starts in IPv4-only mode
      ansible.builtin.assert:
        that:
          - '''OPTIONS="-u bind -4"'' in bind9_startup_options'
        fail_msg: "named is not pinned to IPv4 in /etc/default/named"
      vars:
        bind9_startup_options: "{{ bind9_named_defaults.content | b64decode }}"

    - name: Read named options
      ansible.builtin.slurp:
        src: /etc/bind/named.conf.options
      register: bind9_named_options

    - name: Test that named neither listens nor forwards over IPv6
      ansible.builtin.assert:
        that:
          - "'listen-on-v6 { none; };' in bind9_options"
          - "'forward only;' in bind9_options"
        fail_msg: "named.conf.options allows IPv6 or is missing forwarders"
      vars:
        bind9_options: "{{ bind9_named_options.content | b64decode }}"

    - name: Test that Consul forwarding is disabled by default
      ansible.builtin.assert:
        that:
          - '''include "/etc/bind/consul.conf";'' not in bind9_options'
          - "'dnssec-validation auto;' in bind9_options"
        fail_msg: "Consul forwarding is configured when it should be disabled"
      vars:
        bind9_options: "{{ bind9_named_options.content | b64decode }}"

    - name: Read service state
      ansible.builtin.service_facts:

    - name: Test that bind9 is running
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services.get('named.service', {}).get('state') ==
            'running') or
            (ansible_facts.services.get('bind9.service', {}).get('state') ==
            'running')
        fail_msg: "bind9 is not running"

    - name: Test that the named configuration parses
      ansible.builtin.command: named-checkconf
      changed_when: false
