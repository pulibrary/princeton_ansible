---
- name: Converge
  hosts: all
  vars:
    running_on_server: false
    bind9_manage_service: true
  become: true
  pre_tasks:
    - name: Update cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
  tasks:
    - name: "Include bind9"
      ansible.builtin.include_role:
        name: bind9
