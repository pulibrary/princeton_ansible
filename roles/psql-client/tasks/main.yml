---
- name: Configure PGDG and install PostgreSQL client packages on Debian/Ubuntu
  ansible.builtin.include_tasks: install_debian_client.yml
  when:
    - postgres_client_install_enabled | bool
    - ansible_os_family == "Debian"

- name: set fqdn for use in pg_hba
  ansible.builtin.set_fact:
    "pg_hba_fqdn={{ ansible_facts['fqdn'] }}"

- name: Ensure access to postgres server
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    line: "host    all             all             {{ pg_hba_fqdn }}       md5"
  delegate_to: "{{ postgres_host }}"
  notify: Reload remote postgres

- name: Ensure postgres user account for app exists
  run_once: true
  delegate_to: "{{ postgres_host }}"
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ application_dbuser_name }}"
    # login_host: "{{ postgres_host }}"
    # login_port: "{{ postgres_port }}"
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ vault_postgres_admin_password }}"
    password: "{{ application_dbuser_password }}"
    encrypted: true
    role_attr_flags: "{{ application_dbuser_role_attr_flags }}"
    state: "present"

- name: Gather databases already present on the postgres server
  run_once: true
  delegate_to: "{{ postgres_host }}"
  become: true
  become_user: postgres
  check_mode: false
  community.postgresql.postgresql_info:
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ vault_postgres_admin_password }}"
    filter: databases
  register: postgres_server_info

- name: Record whether the app database already exists
  ansible.builtin.set_fact:
    application_db_exists: "{{ application_db_name in (postgres_server_info.databases | default({})) }}"

- name: Ensure postgres database for app exists
  run_once: true
  delegate_to: "{{ postgres_host }}"
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ application_db_name }}"
    # login_host: "{{ postgres_host }}"
    # login_port: "{{ postgres_port }}"
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ vault_postgres_admin_password }}"
    encoding: "{{ omit if application_db_exists | bool else postgres_database_encoding }}"
    lc_collate: "{{ omit if application_db_exists | bool else postgres_database_lc_collate }}"
    lc_ctype: "{{ omit if application_db_exists | bool else postgres_database_lc_ctype }}"
    template: "{{ omit if application_db_exists | bool else postgres_database_template }}"
    owner: "{{ application_dbuser_name }}"
    state: "present"
  # changed_when: false
