---
# defaults file for roles/lib_sftp

# Group that owns the SFTP drop directories. On hosts that get their identities
# from Active Directory this group arrives from the directory (gid 20204) and is
# already the transfer accounts' primary group, so the role finds it present.
lib_sftp_owner_group: pusvc-g

# Local accounts to add to the drop directory group. Leave empty whenever the
# transfer accounts come from a directory: Active Directory supplies their group
# membership, and usermod cannot modify an account absent from /etc/passwd.
lib_sftp_group_members: []

# Manage an sshd drop-in for the transfer accounts. Set to false if sshd is
# configured elsewhere on the host.
lib_sftp_manage_sshd: true
lib_sftp_sshd_dropin_path: /etc/ssh/sshd_config.d/70-sftp-transfer-accounts.conf

# Public keys for the transfer accounts. A key is preferable to a password
# wherever the remote partner can be configured for one: sshd checks it itself,
# so the login does not depend on the directory answering, there is no password
# to rotate or leak, and multi-factor policies do not apply to it.
#
#   lib_sftp_transfer_keys:
#     - account: "{{ almasftp_user }}"
#       comment: alma-production
#       key: "ssh-ed25519 AAAA..."
#
# Several entries may name the same account. All of that account's keys are
# written to one file, which is how a key gets rotated without an outage: add
# the new one, wait for the partner to switch, then remove the old one.
lib_sftp_transfer_keys: []

# Keys live here rather than in each account's home directory. These are
# directory accounts whose home is created on first login, so a key kept in the
# home could not be read on the very first connection. Root-owned, which is also
# what sshd requires under StrictModes for a file outside the user's home.
lib_sftp_authorized_keys_dir: /etc/ssh/authorized_keys.d

# Log what each SFTP session actually does: which directories it listed, which
# files it opened, and how many bytes it wrote. Without this the log shows a
# session opening and nothing more, so "the partner connected but no files
# arrived" cannot be told apart from "the partner wrote them somewhere else".
#
# internal-sftp rather than a path to sftp-server, because the binary lives in a
# different place on Debian and RHEL and the built-in server avoids having to
# know which. Subsystem is first-wins and the drop-in directory is included at
# the top of sshd_config, so this takes precedence over the host's own line.
lib_sftp_sftp_logging: true
lib_sftp_sftp_log_level: INFO

# Accounts that authenticate with a password because their remote partner cannot
# present a key. Empty here on purpose: a password is the fallback rather than
# the norm, so a host only gets one where its group_vars ask for it. Rendered
# into a `Match User` block so the rest of the host is unaffected.
lib_sftp_password_auth_users: []

# Accounts whose key has been requested from the partner but not yet supplied.
# Listing one here says "known and expected" rather than "forgotten": the run
# continues, the account's drop directories are still created and owned
# correctly, and a notice records that it cannot log in until the key arrives.
#
# This exists because the alternative is worse. Without it the only ways to get
# a run to finish are to comment the account out of the role, which stops it
# being checked at all, or to give it a password it is not supposed to have.
lib_sftp_accounts_awaiting_keys: []

# Accounts to add to sshd's AllowUsers. Where any AllowUsers exists, an account
# in none of them is refused however else it is permitted, so the transfer
# accounts have to be listed. pulsys and the deploy user are included so this
# role never locks out administrative access on a host where nothing else
# writes the directive.
lib_sftp_allow_users:
  - pulsys
  - "{{ deploy_user | default('deploy') }}"
  - "{{ almasftp_user }}"
  - "{{ aspaceftp_user }}"
