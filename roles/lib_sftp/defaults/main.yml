---
# defaults file for roles/lib_sftp

# Group that owns the SFTP drop directories. On Active Directory joined hosts
# the directory supplies this group, so the role finds it already present.
# Elsewhere (for example the sandbox) the role creates it locally.
lib_sftp_owner_group: pusvc-g

# Local accounts to add to the drop directory group. Leave empty whenever the
# transfer accounts come from a directory: Active Directory supplies their group
# membership, and Entra ID accounts cannot be added to a local group with
# usermod at all.
lib_sftp_group_members: []
