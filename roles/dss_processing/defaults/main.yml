---
# defaults file for roles/dss_processing
dss_processing_s3_access_key_id: "{{ vault_dss_processing_s3_access_key_id | default('change_me') }}"
dss_processing_s3_secret_access_key: "{{ vault_dss_processing_s3_secret_access_key | default('change_me') }}"
dss_processing_s3_passwd_file: /etc/passwd-s3fs
dss_processing_s3_url: "https://s3.us-east-2.amazonaws.com"
dss_processing_s3_endpoint: us-east-2
# Mount every bucket read-only, e.g. when a sandbox points at the
# production buckets
dss_processing_s3_read_only: false

# S3 buckets to mount with s3fs. Each entry:
#   bucket:  S3 bucket name
#   path:    mount point
#   options: extra mount options (optional)
dss_processing_s3_mounts:
  - bucket: dss-server-data3
    path: /data3_AWS_S3
  - bucket: dss-server-kaiko
    path: /data/Kaiko
