---
- name: Mailcatcher | Remove old version of mailcatcher
  ansible.builtin.file:
    path: "{{ mailcatcher_install_location }}"
    state: absent

- name: Mailcatcher | Install requested gem version
  ansible.builtin.command:
    argv:
      - /usr/local/bin/gem
      - install
      - mailcatcher
      - --version
      - "{{ mailcatcher_version }}"
      - --no-document
      - --bindir
      - "{{ mailcatcher_install_location | dirname }}"
    creates: "{{ mailcatcher_install_location }}"
