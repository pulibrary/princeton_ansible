---
- name: Catalog cluster | verify the postgres client is installed
  ansible.builtin.command: psql --version
  changed_when: false

- name: Catalog cluster | verify cargo is installed
  ansible.builtin.command: /usr/local/cargo/bin/cargo --version
  environment:
    CARGO_HOME: /usr/local/cargo
    RUSTUP_HOME: /usr/local/rustup
  changed_when: false
