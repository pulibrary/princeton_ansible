---
- name: Converge
  hosts: instance
  vars:
    running_on_server: false
  become: true
  pre_tasks:
    - name: Update cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
  tasks:
    - name: "Include catalog_cluster role"
      ansible.builtin.include_role:
        name: catalog_cluster
