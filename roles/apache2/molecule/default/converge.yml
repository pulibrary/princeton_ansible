---
- name: Converge
  hosts: all
  vars:
    running_on_server: false
    # Exercise the JSON access log, which is what the log shippers read.
    apache_json_access_log: true
  pre_tasks:
    - name: update cache
      apt:
        update_cache: true
  tasks:
    - name: "Include roles/apache2"
      include_role:
        name: "apache2"
