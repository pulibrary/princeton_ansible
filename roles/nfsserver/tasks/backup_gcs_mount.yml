---
# GCS backup mount for the exported NFS trees, using gcsfuse.
#
# Adapted from roles/solr9cloud/tasks/backup_gcs_mount.yml. The mount logic is
# the same, including the stale-mount recovery, because the failure it handles
# is the same: a FUSE endpoint can die and leave an entry in the kernel mount
# table that every subsequent write fails against.
#
# Three things differ from the Solr version, all because of who owns the data:
#
#   * The mount runs as root rather than as the Solr service account. The trees
#     under the source path are owned by several accounts (deploy, conan and
#     others), so only root can read all of them.
#   * There is therefore no /etc/fuse.conf change and no ACL on the key: those
#     exist in the Solr role so that a non-root gcsfuse process can expose the
#     mount to root. Here the same process owns both ends.
#   * Solr writes its own backups into the mount through its backup API. Nothing
#     writes to an NFS export on our behalf, so this mount is only the
#     destination; backup_sync.yml is what actually copies the data.

- name: Nfsserver | Install gcsfuse dependencies
  ansible.builtin.apt:
    name:
      - gnupg
      - lsb-release
      - curl
    state: present
    update_cache: true
  when: running_on_server

- name: Nfsserver | Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: running_on_server

- name: Nfsserver | Fetch the Google Cloud apt key
  ansible.builtin.get_url:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    dest: /etc/apt/keyrings/cloud.google.asc
    owner: root
    group: root
    mode: "0644"
  when: running_on_server

- name: Nfsserver | Add gcsfuse apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/cloud.google.asc]
      https://packages.cloud.google.com/apt
      gcsfuse-{{ ansible_distribution_release }} main
    state: present
    filename: gcsfuse
    update_cache: false
  when: running_on_server

- name: Nfsserver | Install gcsfuse
  ansible.builtin.apt:
    name: gcsfuse
    state: present
    update_cache: true
  when: running_on_server

- name: Nfsserver | Copy GCS service account key
  ansible.builtin.copy:
    src: "{{ nfsserver_backup_key_src }}"
    dest: "{{ nfsserver_backup_key_dest }}"
    mode: "0600"
    owner: root
    group: root
  register: nfsserver_gcs_key
  when: running_on_server

- name: Nfsserver | Ensure gcsfuse log directory exists
  ansible.builtin.file:
    path: "{{ nfsserver_gcsfuse_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: running_on_server

# findmnt checks the kernel mount table without accessing the mounted
# filesystem. This still works when the FUSE endpoint is disconnected.
- name: Nfsserver | Check GCS backup mount table
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --mountpoint
      - "{{ nfsserver_backup_mountpoint }}"
  register: nfsserver_gcs_mount_table
  changed_when: false
  failed_when: false
  when: running_on_server

# A mount can exist in the kernel mount table while its FUSE process is dead.
- name: Nfsserver | Check GCS backup mount accessibility
  ansible.builtin.command:
    argv:
      - /usr/bin/stat
      - --dereference
      - --format=%F
      - "{{ nfsserver_backup_mountpoint }}"
  register: nfsserver_gcs_mount_stat
  changed_when: false
  failed_when: false
  when:
    - running_on_server
    - nfsserver_gcs_mount_table.rc == 0

- name: Nfsserver | Determine whether GCS mount is stale
  ansible.builtin.set_fact:
    nfsserver_gcs_mount_is_stale: >-
      {{
        nfsserver_gcs_mount_table.rc == 0
        and (nfsserver_gcs_mount_stat.rc | default(1)) != 0
      }}
  when: running_on_server

- name: Nfsserver | Recover disconnected GCS backup mount
  when:
    - running_on_server
    - nfsserver_gcs_mount_is_stale | bool
  block:
    - name: Nfsserver | Stop GCS backup mount service
      ansible.builtin.systemd:
        name: "{{ nfsserver_backup_mount_service }}"
        state: stopped
      failed_when: false

    - name: Nfsserver | Lazily detach disconnected FUSE mount
      ansible.builtin.command:
        argv:
          - /bin/fusermount
          - -uz
          - "{{ nfsserver_backup_mountpoint }}"
      register: nfsserver_gcs_fusermount
      changed_when: nfsserver_gcs_fusermount.rc == 0
      failed_when: false

    - name: Nfsserver | Check mount table after FUSE detach
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --mountpoint
          - "{{ nfsserver_backup_mountpoint }}"
      register: nfsserver_gcs_mount_after_fusermount
      changed_when: false
      failed_when: false

    - name: Nfsserver | Lazily unmount remaining stale mount
      ansible.builtin.command:
        argv:
          - /bin/umount
          - --lazy
          - "{{ nfsserver_backup_mountpoint }}"
      register: nfsserver_gcs_lazy_unmount
      changed_when: nfsserver_gcs_lazy_unmount.rc == 0
      failed_when: false
      when: nfsserver_gcs_mount_after_fusermount.rc == 0

    - name: Nfsserver | Verify stale mount was removed
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --mountpoint
          - "{{ nfsserver_backup_mountpoint }}"
      register: nfsserver_gcs_mount_after_recovery
      changed_when: false
      failed_when: false
      retries: 3
      delay: 1
      until: nfsserver_gcs_mount_after_recovery.rc != 0

    - name: Nfsserver | Fail if stale mount remains
      ansible.builtin.assert:
        that:
          - nfsserver_gcs_mount_after_recovery.rc != 0
        fail_msg: >-
          Unable to remove the disconnected GCS FUSE mount at
          {{ nfsserver_backup_mountpoint }}.

- name: Nfsserver | Ensure GCS backup mountpoint exists
  ansible.builtin.file:
    path: "{{ nfsserver_backup_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - running_on_server
    - >-
      nfsserver_gcs_mount_table.rc != 0
      or nfsserver_gcs_mount_is_stale | bool

- name: Nfsserver | Create GCS backup mount systemd service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=gcsfuse mount for NFS backup
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      Environment="GOOGLE_APPLICATION_CREDENTIALS={{ key_path }}"
      ExecStart=/usr/bin/gcsfuse \
        --foreground \
        --file-mode=0644 \
        --dir-mode=0755 \
        --implicit-dirs \
        --metadata-cache-ttl-secs=60 \
        --max-retry-sleep=30s \
        --log-file={{ nfsserver_gcsfuse_directory }}/gcsfuse.log \
        --log-severity=info \
        --key-file={{ nfsserver_backup_key_dest }} \
        {{ nfsserver_backup_bucket }} \
        {{ nfsserver_backup_mountpoint }}
      ExecStop=-/bin/fusermount -uz {{ nfsserver_backup_mountpoint }}
      Restart=on-failure
      RestartSec=10
      TimeoutStopSec=30

      [Install]
      WantedBy=multi-user.target
    dest: "/etc/systemd/system/{{ nfsserver_backup_mount_service }}"
    mode: "0644"
    owner: root
    group: root
  register: nfsserver_gcs_service_unit
  when: running_on_server
  vars:
    key_path: "{{ nfsserver_backup_key_dest }}"

- name: Nfsserver | Enable and start GCS backup mount service
  ansible.builtin.systemd:
    name: "{{ nfsserver_backup_mount_service }}"
    enabled: true
    masked: false
    state: >-
      {{
        'restarted'
        if (
          nfsserver_gcs_service_unit.changed
          or nfsserver_gcs_key.changed
        )
        else 'started'
      }}
    daemon_reload: true
  when: running_on_server

- name: Nfsserver | Wait for GCS mount table entry
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE,TARGET
      - --mountpoint
      - "{{ nfsserver_backup_mountpoint }}"
  register: nfsserver_mount_check
  changed_when: false
  retries: 6
  delay: 5
  until: nfsserver_mount_check.rc == 0
  when: running_on_server

- name: Nfsserver | Verify GCS mount is accessible
  ansible.builtin.command:
    argv:
      - /usr/bin/stat
      - --dereference
      - --format=%F
      - "{{ nfsserver_backup_mountpoint }}"
  register: nfsserver_mount_access_check
  changed_when: false
  retries: 6
  delay: 5
  until: nfsserver_mount_access_check.rc == 0
  when: running_on_server

- name: Nfsserver | Display GCS mount status
  ansible.builtin.debug:
    msg:
      - "GCS mount is active and accessible"
      - "{{ nfsserver_mount_check.stdout }}"
  when: running_on_server

- name: Nfsserver | Configure gcsfuse log rotation
  ansible.builtin.template:
    src: "../../common/templates/logrotate_rules.j2"
    dest: "/etc/logrotate.d/{{ item.name | basename }}"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ nfsserver_gcsfuse_logrotate_rules }}"
  when:
    - running_on_server
    - nfsserver_gcsfuse_logrotate_rules is defined
    - nfsserver_gcsfuse_logrotate_rules | length > 0
