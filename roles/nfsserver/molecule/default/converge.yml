---
- name: Converge
  hosts: all
  vars:
    running_on_server: false
    nfsserver_is_local: true
    bibdata_fileshare_mount: "/var/nfs/bibdata"
    cdh_fileshare_mount: "/var/nfs/cdh"
    open_marc_records_mount: "/var/nfs/open_marc_records"
    pas_fileshare_mount: "/var/nfs/pas"
    tigerdata_fileshare_mount: "/var/nfs/tigerdata"
  become: true
  pre_tasks:
    - name: Update cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
  tasks:
    - name: Include nfsserver
      ansible.builtin.include_role:
        name: nfsserver

    # The backup tasks are all guarded on running_on_server, so the include
    # above skips them. Include the sync half on its own with that flag set, so
    # the script and its units are actually exercised.
    #
    # Only the sync half: the mount half installs gcsfuse from Google's apt
    # repository and needs a service account key, neither of which belongs in a
    # test. verify.yml stands in for the mount with a bind mount, which is
    # enough to prove the guards that stop a backup writing to the local disk.
    - name: Include the NFS backup sync tasks
      ansible.builtin.include_role:
        name: nfsserver
        tasks_from: backup_sync.yml
      vars:
        running_on_server: true
        nfsserver_backup_enabled: true
        # Far future, so Persistent=true cannot fire a catch-up run in a fresh
        # container and make the test non-deterministic.
        nfsserver_backup_sync_calendar: "2099-01-01 00:00:00"
        # verify.yml drives the backup by hand, against a stand-in mount.
        # Letting the role start it here would run it with no mount at all,
        # leaving a failed unit behind and telling us nothing the refusal test
        # does not already prove.
        nfsserver_backup_run_now: false
