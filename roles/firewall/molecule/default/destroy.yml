---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove containers
      community.docker.docker_container:
        name: "{{ item.name }}"
        state: absent
        force_kill: true
      loop: "{{ molecule_yml.platforms }}"

    - name: Remove dynamic inventory
      ansible.builtin.file:
        path: >-
          {{ molecule_ephemeral_directory }}/inventory/molecule_inventory.yml
        state: absent
