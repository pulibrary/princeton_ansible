---
- name: Firewall | Persist ICMP redirect hardening
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-disable-icmp-redirects.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Disable accepting and sending ICMP redirects (IPv4)
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0

      # Disable accepting redirects (IPv6)
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0

      # Enable strict reverse-path filtering
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
  notify: Reload sysctl
  tags:
    - icmp_redirects
    - sysctl

- name: Firewall | Apply ICMP redirect sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - name: net.ipv4.conf.all.accept_redirects
      value: "0"
    - name: net.ipv4.conf.default.accept_redirects
      value: "0"
    - name: net.ipv4.conf.all.send_redirects
      value: "0"
    - name: net.ipv4.conf.default.send_redirects
      value: "0"
    - name: net.ipv6.conf.all.accept_redirects
      value: "0"
    - name: net.ipv6.conf.default.accept_redirects
      value: "0"
    - name: net.ipv4.conf.all.rp_filter
      value: "1"
    - name: net.ipv4.conf.default.rp_filter
      value: "1"
  tags:
    - icmp_redirects
    - sysctl

- name: Firewall | Read ICMP redirect sysctl values
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - net.ipv4.conf.all.accept_redirects
      - net.ipv4.conf.default.accept_redirects
      - net.ipv4.conf.all.send_redirects
      - net.ipv4.conf.default.send_redirects
      - net.ipv6.conf.all.accept_redirects
      - net.ipv6.conf.default.accept_redirects
  register: firewall_sysctl_check
  changed_when: false
  tags:
    - icmp_redirects
    - verify

- name: Firewall | Assert ICMP redirects are disabled
  ansible.builtin.assert:
    that:
      - firewall_sysctl_check.stdout_lines | length == 6
      - firewall_sysctl_check.stdout_lines | unique == ['0']
    fail_msg: One or more ICMP redirect sysctl values are not zero
    success_msg: All ICMP redirect sysctl values are zero
  tags:
    - icmp_redirects
    - verify

- name: Firewall | Check IPv4 ICMP redirect DROP rule
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - INPUT
      - -p
      - icmp
      - --icmp-type
      - redirect
      - -j
      - DROP
  register: firewall_iptables_redirect_rule
  changed_when: false
  failed_when: firewall_iptables_redirect_rule.rc not in [0, 1]
  tags:
    - firewall
    - icmp_redirects
- name: Firewall | Insert IPv4 ICMP redirect DROP rule
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - INPUT
      - -p
      - icmp
      - --icmp-type
      - redirect
      - -j
      - DROP
  when: firewall_iptables_redirect_rule.rc == 1
  changed_when: true
  tags:
    - firewall
    - icmp_redirects

- name: Firewall | Check IPv6 ICMP redirect DROP rule
  ansible.builtin.command:
    argv:
      - ip6tables
      - -C
      - INPUT
      - -p
      - ipv6-icmp
      - --icmpv6-type
      - redirect
      - -j
      - DROP
  register: firewall_ip6tables_redirect_rule
  changed_when: false
  failed_when: firewall_ip6tables_redirect_rule.rc not in [0, 1]
  tags:
    - firewall
    - icmp_redirects

- name: Firewall | Insert IPv6 ICMP redirect DROP rule
  ansible.builtin.command:
    argv:
      - ip6tables
      - -I
      - INPUT
      - -p
      - ipv6-icmp
      - --icmpv6-type
      - redirect
      - -j
      - DROP
  when: firewall_ip6tables_redirect_rule.rc == 1
  changed_when: true
  tags:
    - firewall
    - icmp_redirects
