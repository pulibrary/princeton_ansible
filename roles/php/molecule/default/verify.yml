---
- name: Verify PHP installation and configuration
  hosts: all
  become: true
  vars:
    php_version: "8.3"
    php_webserver: "apache2"
  tasks:
    - name: Php | Verify required Ubuntu dependencies are installed
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - dirmngr
        state: present
      changed_when: false
  
    - name: Php | Check official sury.org repository source file
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/sury-php.sources
      register: php_sury_php_sources

    - name: Php | Verify official sury.org repository is added
      ansible.builtin.assert:
        that:
          - php_sury_php_sources.stat.exists

    - name: Php | Verify PHP packages are installed
      ansible.builtin.apt:
        name:
          [
            "php{{ php_version }}",
            "php{{ php_version }}-dev",
            "php{{ php_version }}-curl",
            "php{{ php_version }}-gd",
            "php{{ php_version }}-zip",
          ]
        state: present
      changed_when: false
