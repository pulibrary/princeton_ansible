---
- name: Php | debug web server
  ansible.builtin.debug:
    msg: PHP Web Server {{ php_webserver }}

- name: Php | install required Ubuntu dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - dirmngr

- name: Php | Remove legacy sury.org apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages_sury_org_php.list
    state: absent

- name: Php | Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Php | Add official sury.org repository
  ansible.builtin.deb822_repository:
    name: sury-php
    types: [deb]
    uris: https://packages.sury.org/php/
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    state: present

- name: Add the Sury.org GPG key
  ansible.builtin.apt_key:
    url: https://packages.sury.org/php/apt.gpg
    state: present
  become: true

- name: Php | Clean apt cache
  ansible.builtin.command: apt-get clean
  changed_when: false

- name: Php | Update apt cache after adding repository
  ansible.builtin.command: apt-get update
  register: cache_update
  retries: 3
  delay: 5
  until: cache_update.rc == 0
  changed_when: false
  failed_when: false

- name: Php | Display cache update errors
  ansible.builtin.debug:
    msg: |
      Return code: {{ cache_update.rc }}
      STDOUT: {{ cache_update.stdout }}
      STDERR: {{ cache_update.stderr }}
  when: cache_update.rc != 0

- name: Php | Fail if cache update failed
  ansible.builtin.fail:
    msg: "apt-get update failed. See debug output above."
  when: cache_update.rc != 0

- name: Php | install php
  ansible.builtin.apt:
    name: ["php{{ php_version }}", "php{{ php_version }}-dev", "php{{ php_version }}-curl", "php{{ php_version }}-gd", "php{{ php_version }}-zip"]
    state: present
  tags: ['skip_ansible_lint']
  notify: restart {{ php_webserver }}

- name: Php | Install datadog trace php repository
  ansible.builtin.apt:
    deb: "https://github.com/DataDog/dd-trace-php/releases/download/{{ ddtrace_repo_version }}/datadog-php-tracer_{{ ddtrace_repo_version }}_amd64.deb"
    state: present
  when: datadog_enabled

- name: Php | Configure Apache2
  ansible.builtin.include_tasks: configure-apache2.yml
  when: php_webserver == 'apache2'

- name: Php | Configure Nginx
  ansible.builtin.include_tasks: configure-nginx.yml
  when: php_webserver == 'nginx'
