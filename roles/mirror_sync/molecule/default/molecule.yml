---
scenario:
  name: default
driver:
  name: docker
  command_timeout: 60
lint: |
  set -e
  yamllint .
  ansible-lint
platforms:
  - name: instance
    image: "ghcr.io/pulibrary/pul_containers:jammy_multi"
    command: "sleep infinity"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    connection_options:
      ansible_user: root
      ansible_connection: docker
provisioner:
  name: ansible
  # Molecule no longer puts the repository's roles directory on the role
  # search path, so playbooks cannot find roles by name without this.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  log: true
  playbooks:
    prepare: prepare.yml
  config_options:
    defaults:
      remote_tmp: /tmp/ansible
verifier:
  name: ansible
