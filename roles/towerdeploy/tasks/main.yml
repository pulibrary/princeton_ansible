---
# tasks file for towerdeploy

- name: towerdeploy | install ruby gems
  community.general.gem:
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    state: present
    user_install: false
    include_doc: false
  loop:
    - name: capistrano
      version: "{{ cap_version }}"
    - name: activesupport
    - name: airbrussh
    - name: bcrypt_pbkdf
    - name: capistrano-composer
    - name: capistrano-passenger
    - name: capistrano-rails
    - name: capistrano-rails-console
    - name: capistrano-yarn
    - name: concurrent-ruby
    - name: ed25519
    - name: flipper
    - name: honeybadger
    - name: i18n
    - name: net-scp
    - name: net-ssh
    - name: rake
    - name: sshkit
    - name: whenever

- name: towerdeploy | install ssh key for deploying to app servers
  ansible.builtin.copy:
    src: "id_ed25519_{{ runtime_env | default('staging') }}"
    dest: "/home/{{ deploy_user }}/.ssh/id_ed25519"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true
  when: running_on_server

- name: towerdeploy | install python3-debian for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: towerdeploy | add HashiCorp apt repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: https://apt.releases.hashicorp.com/gpg
  register: towerdeploy_hashicorp_repo

- name: towerdeploy | update apt cache after adding HashiCorp repository
  ansible.builtin.apt:
    update_cache: true
  when: towerdeploy_hashicorp_repo is changed

- name: towerdeploy | install Nomad
  ansible.builtin.apt:
    name: "nomad={{ nomad_version }}-1"
    allow_change_held_packages: true

- name: towerdeploy | hold Nomad package
  ansible.builtin.dpkg_selections:
    name: nomad
    selection: hold
