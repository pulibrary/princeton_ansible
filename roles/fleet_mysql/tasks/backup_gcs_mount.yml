---
# Configure GCS backup mount for MySQL using gcsfuse

- name: Fleet MySQL | Install gcsfuse dependencies
  ansible.builtin.apt:
    name:
      - gnupg
      - lsb-release
      - curl
      - acl
    state: present
    update_cache: true
  when: running_on_server

- name: Fleet MySQL | Add gcsfuse apt key
  ansible.builtin.apt_key:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    state: present
  when: running_on_server

- name: Fleet MySQL | Add gcsfuse apt repository
  ansible.builtin.apt_repository:
    repo: "deb https://packages.cloud.google.com/apt gcsfuse-{{ ansible_distribution_release }} main"
    state: present
    filename: gcsfuse
    update_cache: false
  when: running_on_server

- name: Fleet MySQL | Install gcsfuse
  ansible.builtin.apt:
    name: gcsfuse
    state: present
    update_cache: true
  when: running_on_server

- name: Fleet MySQL | Copy GCS service account key
  ansible.builtin.copy:
    src: "{{ mysql_gcs_key_src }}"
    dest: "{{ mysql_gcs_key_path }}"
    mode: "0600"
    owner: root
    group: root
  register: mysql_gcs_key
  when: running_on_server

- name: Fleet MySQL | Grant MySQL user read access to service account key
  ansible.posix.acl:
    path: "{{ mysql_gcs_key_path }}"
    entity: "{{ mysql_gcs_user }}"
    etype: user
    permissions: r
    state: present
  when: running_on_server

- name: Fleet MySQL | Ensure FUSE allows allow_other
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^\s*#?\s*user_allow_other\s*$'
    line: user_allow_other
    state: present
    create: true
    mode: "0644"
  register: mysql_gcs_fuse_conf
  when: running_on_server

- name: Fleet MySQL | Ensure gcsfuse log directory exists
  ansible.builtin.file:
    path: "{{ mysql_gcsfuse_directory }}"
    state: directory
    owner: "{{ mysql_gcs_user }}"
    group: "{{ mysql_gcs_group }}"
    mode: "0755"
  when: running_on_server

# Before v3.0 gcsfuse stages a whole file on local disk and uploads it on
# close, so publishing a large dump needs as much free space as the dump
# itself. The default location is /tmp; pointing it somewhere deliberate keeps
# that space usage predictable and visible next to the backups it belongs to.
- name: Fleet MySQL | Ensure gcsfuse write staging directory exists
  ansible.builtin.file:
    path: "{{ mysql_gcsfuse_temp_directory }}"
    state: directory
    owner: "{{ mysql_gcs_user }}"
    group: "{{ mysql_gcs_group }}"
    mode: "0750"
  when: running_on_server

- name: Fleet MySQL | Resolve MySQL service user UID
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -u
      - "{{ mysql_gcs_user }}"
  register: mysql_gcs_uid
  changed_when: false
  when: running_on_server

- name: Fleet MySQL | Resolve MySQL service user GID
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -g
      - "{{ mysql_gcs_user }}"
  register: mysql_gcs_gid
  changed_when: false
  when: running_on_server

# findmnt checks the kernel mount table without accessing the mounted
# filesystem. This still works when the FUSE endpoint is disconnected.
- name: Fleet MySQL | Check GCS backup mount table
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --mountpoint
      - "{{ mysql_gcs_mountpoint }}"
  register: mysql_gcs_mount_table
  changed_when: false
  failed_when: false
  when: running_on_server

# A mount can exist in the kernel mount table while its FUSE process is dead.
- name: Fleet MySQL | Check GCS backup mount accessibility
  ansible.builtin.command:
    argv:
      - /usr/bin/stat
      - --dereference
      - --format=%F
      - "{{ mysql_gcs_mountpoint }}"
  register: mysql_gcs_mount_stat
  changed_when: false
  failed_when: false
  when:
    - running_on_server
    - mysql_gcs_mount_table.rc == 0

- name: Fleet MySQL | Determine whether GCS mount is stale
  ansible.builtin.set_fact:
    mysql_gcs_mount_is_stale: >-
      {{
        mysql_gcs_mount_table.rc == 0
        and (mysql_gcs_mount_stat.rc | default(1)) != 0
      }}
  when: running_on_server

- name: Fleet MySQL | Recover disconnected GCS backup mount
  when:
    - running_on_server
    - mysql_gcs_mount_is_stale | bool
  block:
    - name: Fleet MySQL | Stop GCS backup mount service
      ansible.builtin.systemd:
        name: "{{ mysql_gcs_service_name }}"
        state: stopped
      failed_when: false

    - name: Fleet MySQL | Lazily detach disconnected FUSE mount
      ansible.builtin.command:
        argv:
          - /bin/fusermount
          - -uz
          - "{{ mysql_gcs_mountpoint }}"
      register: mysql_gcs_fusermount
      changed_when: mysql_gcs_fusermount.rc == 0
      failed_when: false

    - name: Fleet MySQL | Check mount table after FUSE detach
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --mountpoint
          - "{{ mysql_gcs_mountpoint }}"
      register: mysql_gcs_mount_after_fusermount
      changed_when: false
      failed_when: false

    - name: Fleet MySQL | Lazily unmount remaining stale mount
      ansible.builtin.command:
        argv:
          - /bin/umount
          - --lazy
          - "{{ mysql_gcs_mountpoint }}"
      register: mysql_gcs_lazy_unmount
      changed_when: mysql_gcs_lazy_unmount.rc == 0
      failed_when: false
      when: mysql_gcs_mount_after_fusermount.rc == 0

    - name: Fleet MySQL | Verify stale mount was removed
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --mountpoint
          - "{{ mysql_gcs_mountpoint }}"
      register: mysql_gcs_mount_after_recovery
      changed_when: false
      failed_when: false
      retries: 3
      delay: 1
      until: mysql_gcs_mount_after_recovery.rc != 0

    - name: Fleet MySQL | Fail if stale mount remains
      ansible.builtin.assert:
        that:
          - mysql_gcs_mount_after_recovery.rc != 0
        fail_msg: >-
          Unable to remove the disconnected GCS FUSE mount at
          {{ mysql_gcs_mountpoint }}.

- name: Fleet MySQL | Ensure GCS backup mountpoint parent exists
  ansible.builtin.file:
    path: "{{ mysql_gcs_mountpoint | dirname }}"
    state: directory
    owner: "{{ mysql_gcs_user }}"
    group: "{{ mysql_gcs_group }}"
    mode: "0755"
  when: running_on_server

- name: Fleet MySQL | Ensure GCS backup mountpoint exists
  ansible.builtin.file:
    path: "{{ mysql_gcs_mountpoint }}"
    state: directory
    owner: "{{ mysql_gcs_user }}"
    group: "{{ mysql_gcs_group }}"
    mode: "0755"
  when:
    - running_on_server
    - >-
      mysql_gcs_mount_table.rc != 0
      or mysql_gcs_mount_is_stale | bool

- name: Fleet MySQL | Create mysql-gcs-backup systemd service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=gcsfuse mount for MySQL Backup
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ mysql_gcs_user }}
      Group={{ mysql_gcs_group }}
      Environment="GOOGLE_APPLICATION_CREDENTIALS={{ mysql_gcs_key_path }}"
      ExecStart=/usr/bin/gcsfuse \
        --foreground \
        --uid={{ mysql_gcs_uid.stdout }} \
        --gid={{ mysql_gcs_gid.stdout }} \
        --file-mode=0640 \
        --dir-mode=0750 \
        --implicit-dirs \
        --metadata-cache-ttl-secs=60 \
        --max-retry-sleep=30s \
        --temp-dir={{ mysql_gcsfuse_temp_directory }} \
        --log-file={{ mysql_gcsfuse_directory }}/gcsfuse.log \
        --log-format=json \
        --log-severity=info \
        --key-file={{ mysql_gcs_key_path }} \
        -o allow_other \
        {{ mysql_gcs_bucket_name }} \
        {{ mysql_gcs_mountpoint }}
      ExecStop=-/bin/fusermount -uz {{ mysql_gcs_mountpoint }}
      Restart=on-failure
      RestartSec=10
      TimeoutStopSec=30

      [Install]
      WantedBy=multi-user.target
    dest: "/etc/systemd/system/{{ mysql_gcs_service_name }}"
    mode: "0644"
    owner: root
    group: root
  register: mysql_gcs_service_unit
  when: running_on_server

- name: Fleet MySQL | Enable and start GCS backup mount service
  ansible.builtin.systemd:
    name: "{{ mysql_gcs_service_name }}"
    enabled: true
    masked: false
    state: >-
      {{
        'restarted'
        if (
          mysql_gcs_service_unit.changed
          or mysql_gcs_key.changed
          or mysql_gcs_fuse_conf.changed
        )
        else 'started'
      }}
    daemon_reload: true
  when: running_on_server

- name: Fleet MySQL | Wait for GCS mount table entry
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE,TARGET
      - --mountpoint
      - "{{ mysql_gcs_mountpoint }}"
  register: mysql_mount_check
  changed_when: false
  retries: 6
  delay: 5
  until: mysql_mount_check.rc == 0
  when: running_on_server

- name: Fleet MySQL | Verify GCS mount is accessible
  ansible.builtin.command:
    argv:
      - /usr/bin/stat
      - --dereference
      - --format=%F
      - "{{ mysql_gcs_mountpoint }}"
  register: mysql_mount_access_check
  changed_when: false
  retries: 6
  delay: 5
  until: mysql_mount_access_check.rc == 0
  when: running_on_server

- name: Fleet MySQL | Display GCS mount status
  ansible.builtin.debug:
    msg:
      - "GCS mount is active and accessible"
      - "{{ mysql_mount_check.stdout }}"
  when: running_on_server

- name: Fleet MySQL | Ensure Checkmk local directory exists
  ansible.builtin.file:
    path: /usr/lib/check_mk_agent/local
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: running_on_server

- name: Fleet MySQL | Install MySQL backup local check
  ansible.builtin.template:
    src: check_mysql_backup.sh.j2
    dest: /usr/lib/check_mk_agent/local/check_mysql_backup.sh
    owner: root
    group: root
    mode: "0755"
  when: running_on_server

- name: Fleet MySQL | Verify MySQL backup local check
  ansible.builtin.command:
    argv:
      - /usr/lib/check_mk_agent/local/check_mysql_backup.sh
  register: mysql_backup_check_output
  changed_when: false
  failed_when: false
  when:
    - running_on_server
    - checkmk_verify_local | default(false) | bool

- name: Fleet MySQL | Show local check output
  ansible.builtin.debug:
    var: mysql_backup_check_output.stdout_lines
  when:
    - running_on_server
    - checkmk_verify_local | default(false) | bool

- name: Fleet MySQL | Configure gcsfuse log rotation
  ansible.builtin.template:
    src: "../../common/templates/logrotate_rules.j2"
    dest: "/etc/logrotate.d/{{ item.name | basename }}"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ mysql_gcsfuse_logrotate_rules }}"
  when:
    - running_on_server
    - mysql_gcsfuse_logrotate_rules is defined
    - mysql_gcsfuse_logrotate_rules | length > 0
