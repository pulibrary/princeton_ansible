---
galaxy_info:
  role_name: xrdp
  company: Princeton University Library
  description: XRDP remote desktop with an XFCE session
  author: pulibrary

  license: MIT

  min_ansible_version: 2.2

  platforms:
    - name: Ubuntu
      versions:
        - jammy
# The firewall role denies incoming traffic by default, so a remote desktop host
# is unreachable unless the RDP port is opened. Depending on the firewall role
# and asking it for the rule keeps host firewall policy in one place, instead of
# having this role reach for ufw directly.
dependencies:
  - role: firewall
    firewall_allow_rdp: true
