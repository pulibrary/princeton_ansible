---
# defaults file for roles/xrdp
xrdp_port: 3389

# On by default: the firewall role denies incoming traffic, so a remote desktop
# host that does not open this port cannot be reached at all.
xrdp_manage_ufw: true
# Networks allowed to reach the RDP port. Campus wired plus both VPN ranges,
# matching the networks trusted for SSH. An empty list opens the port to any
# source, which is almost never what you want for a graphical login.
xrdp_ufw_allow_from:
  - 10.249.64.0/18 # Princeton Wired Private
  - 10.249.0.0/18 # Princeton Wired Private-2
  - 128.112.0.0/16 # Princeton Wired
  - 172.20.80.0/22 # PU Subnet - LibNetPvt
  - 172.20.95.0/24 # Princeton VPN Subnet 1
  - 172.20.192.0/19 # Princeton VPN Subnet 2

xrdp_desktop: xfce

xrdp_packages_common:
  - dbus-x11
  - dbus-user-session
  - libpam-systemd
  - xorgxrdp
  - xrdp
# Xubuntu / XFCE
xrdp_packages_xfce:
  - xfce4
  - xfce4-goodies
  - xfce4-screensaver
  - xfce4-session
  - xfce4-terminal
  - xfconf
