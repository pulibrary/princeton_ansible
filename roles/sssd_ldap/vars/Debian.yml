---
# vars/Debian.yml
sssd_ldap_packages:
  - sssd
  - sssd-ldap
  - sssd-tools
  - libnss-sss
  - libpam-sss
  - ldap-utils
sssd_ldap_service: sssd
sssd_ldap_default_cacert: /etc/ssl/certs/ca-certificates.crt
# PAM profiles enabled with pam-auth-update. Installing libpam-sss usually
# enables sss already; asking for it again is harmless and makes the dependency
# explicit.
sssd_ldap_pam_profiles:
  - sss
  - mkhomedir
