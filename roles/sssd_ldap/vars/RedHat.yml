---
# vars/RedHat.yml
sssd_ldap_packages:
  - sssd
  - sssd-ldap
  - sssd-tools
  - openldap-clients
  - oddjob
  - oddjob-mkhomedir
sssd_ldap_service: sssd
sssd_ldap_default_cacert: /etc/pki/tls/certs/ca-bundle.crt
# RedHat drives PAM with authselect rather than pam-auth-update.
sssd_ldap_authselect_profile: sssd
