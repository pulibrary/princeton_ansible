upstream fleet-k8s {
    least_conn;
    zone fleet-k8s 64k;

    server k8s-prod1.lib.princeton.edu:80 max_fails=3 fail_timeout=10s;
    server k8s-prod2.lib.princeton.edu:80 max_fails=3 fail_timeout=10s;
    server k8s-prod3.lib.princeton.edu:80 max_fails=3 fail_timeout=10s;
    keepalive 0;
}

map $http_upgrade $fleet_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name fleet.lib.princeton.edu;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fleet.lib.princeton.edu;

    ssl_certificate            /etc/letsencrypt/live/fleet.lib/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/fleet.lib/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    # Fleet accepts software installer packages up to 3 GB.
    client_max_body_size 3000m;
    client_body_timeout  1h;

    location / {
        proxy_pass http://fleet-k8s;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Fleet records each device's address from the request headers, and it
        # reads True-Client-IP before X-Real-IP or X-Forwarded-For.
        #
        # There are two proxies in front of Fleet: this one and the cluster's
        # own ingress controller. That controller rewrites both X-Real-IP and
        # X-Forwarded-For with the address it sees, which is this load
        # balancer, so anything sent in those headers is discarded and every
        # device ends up recorded with the load balancer's address.
        # True-Client-IP is not a header the ingress controller touches, so it
        # arrives at Fleet intact.
        #
        # Overwriting rather than forwarding matters: a device could otherwise
        # claim any address by sending this header itself.
        proxy_set_header True-Client-IP    $remote_addr;

        # Live query results reach the web interface over a websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;

        # Uploading a multi-gigabyte installer would otherwise be spooled to
        # disk here before any of it reaches Fleet.
        proxy_request_buffering off;

        proxy_connect_timeout 75s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }
}
