# {{ ansible_managed | comment }}
proxy_cache_path /var/cache/nginx/figgy-rabbitmq-production/ keys_zone=figgyrabbitproductioncache:10m;

upstream figgyrabbitproduction {
    ip_hash;
    zone figgyrabbitproduction 64k;
    server service.consul service=rabbitmq-production-management resolve max_fails=0;
    sticky learn
          create=$upstream_cookie_figgyrabbitproductioncookie
          lookup=$cookie_figgyrabbitproductioncookie
          zone=figgyrabbitproduction_sessions:1m;
    resolver nomad-host-prod1.lib.princeton.edu:8600 nomad-host-prod2.lib.princeton.edu:8600 nomad-host-prod3.lib.princeton.edu:8600 valid=5s;
    resolver_timeout 2s;
    keepalive 0;
}

server {
    listen 80;
    server_name figgy-rabbitmq-production.lib.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name figgy-rabbitmq-production.lib.princeton.edu;

    ssl_certificate            /etc/letsencrypt/live/figgy-rabbitmq-production.lib/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/figgy-rabbitmq-production.lib/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://figgyrabbitproduction;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache figgyrabbitproductioncache;
        proxy_read_timeout 310s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin "${scheme}://${proxy_host}";
        # allow princeton network
        include /etc/nginx/conf.d/templates/restrict.conf;
        # block all IPs outside the princeton network
        deny all;
    }
}
