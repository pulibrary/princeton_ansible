# {{ ansible_managed | comment }}
proxy_cache_path /var/cache/nginx/madad/ keys_zone=madadcache:10m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream madad_prod {
    least_time header 'inflight';
    zone madad_prod 64k;
    server cdh-madad1.lib.princeton.edu;
    server cdh-madad2.lib.princeton.edu;
    sticky learn
          create=$upstream_cookie_madad_prodcookie
          lookup=$cookie_madad_prodcookie
          zone=madadclient_sessions:1m;
    keepalive 0;
}

server {
    listen 80;
    server_name madad.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name madad.princeton.edu;

    client_max_body_size 50M;

    ssl_certificate            /etc/letsencrypt/live/madad/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/madad/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://madad_prod;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache madad_prodcache;
        proxy_set_header Host madad.princeton.edu;
	# upgrade connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout      2h;
        proxy_send_timeout         2h;
        proxy_read_timeout         2h;
        proxy_intercept_errors on;
        health_check interval=10 fails=3 passes=2;
    }
    include /etc/nginx/conf.d/templates/cdh-errors.conf;
}

}
