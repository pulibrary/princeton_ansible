    ssl_session_timeout 10m;

    # Do not include includeSubDomains because this vhost should not
    # impose HSTS policy on all of lib.princeton.edu.
    #
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Logging / monitoring
    access_log /var/log/nginx/gitlab_access.log gitlab_security;
    error_log  /var/log/nginx/gitlab_error.log warn;

    # Use 429 for rate limiting rather than the default 503.
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        # Only authentication URLs receive a non-empty rate-limit key.
        # Normal GitLab web, API, clone, push, CI, and artifact traffic
        #
        # Rate limiting applies only to authentication-related URLs.
        # The map above returns an empty key for all other requests, and NGINX
        # does not account requests whose limit_req key evaluates to an empty
        # value. This leaves normal GitLab web, API, clone, push, CI, and
        # artifact traffic outside this rate limit.
        # NGINX limit_req:
        # https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
        # NGINX map:
        # https://nginx.org/en/docs/http/ngx_http_map_module.html
        limit_req zone=gitlab_auth burst=20 nodelay;
        #
        limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
            deny all;
        }

        proxy_pass https://gitlab;

        # Required for WebSocket support and persistent upstream
        # connections.
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $gitlab_connection_upgrade;

        # Verify the GitLab backend's TLS certificate.
        #
        # The backend certificate has been verified as:
        #   CN=gitlab-prod-vm.lib.princeton.edu
        proxy_ssl_server_name on;
        proxy_ssl_name gitlab-prod-vm.lib.princeton.edu;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;

        #
        # Allow long-running Git operations.
        #
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
