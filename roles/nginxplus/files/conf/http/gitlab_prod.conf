# Ansible managed

#
# WebSocket / HTTP upgrade handling
#
map $http_upgrade $gitlab_connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limit authentication-related endpoints only.
# Requests with an empty key are not rate limited.
map $uri $gitlab_auth_limit_key {
    default             "";
    ~^/users/sign_in$   $binary_remote_addr;
    ~^/users/password   $binary_remote_addr;
}

limit_req_zone $gitlab_auth_limit_key
               zone=gitlab_auth:10m
               rate=30r/m;

# Log $uri rather than $request_uri because $request_uri includes
# query-string arguments. GitLab APIs can accept authentication tokens
# in query parameters, so omitting arguments reduces the risk of
# credentials being written to access logs.
#
# NGINX:
# https://nginx.org/en/docs/http/ngx_http_core_module.html
#
# GitLab:
# https://docs.gitlab.com/api/rest/authentication/

log_format gitlab_security escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

upstream gitlab {
    zone gitlab 64k;

    server gitlab-prod-vm.lib.princeton.edu:443 resolve;

    sticky learn
          create=$upstream_cookie_gitlabcookie
          lookup=$cookie_gitlabcookie
          zone=gitlabclient_sessions:1m;
}

server {
    listen 80;
    server_name gitlab.lib.princeton.edu;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name gitlab.lib.princeton.edu;

    # We do not expose the NGINX version.
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/gitlab.lib/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitlab.lib/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

