# Ansible managed
proxy_cache_path /var/cache/nginx/kaneo-sandbox/ keys_zone=kaneo-sandboxcache:10m;

map $http_upgrade $kaneo_sandbox_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kaneo-sandbox {
    zone kaneo-sandbox 64k;
    server service.consul service=kaneo-sandbox resolve;
    resolver nomad-host-sandbox1.lib.princeton.edu:8600 nomad-host-sandbox2.lib.princeton.edu:8600 nomad-host-sandbox3.lib.princeton.edu:8600 valid=5s;
    resolver_timeout 2s;
    keepalive 0;
}

server {
    listen 80;
    server_name kaneo-sandbox.lib.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kaneo-sandbox.lib.princeton.edu;

    ssl_certificate            /etc/letsencrypt/live/kaneo-sandbox.lib/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/kaneo-sandbox.lib/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://kaneo-sandbox;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Live task updates need a websocket upgrade through the proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kaneo_sandbox_connection_upgrade;
        proxy_cache kaneo-sandboxcache;
        proxy_buffering off;
        proxy_connect_timeout      2h;
        proxy_send_timeout         2h;
        proxy_read_timeout         2h;
        # handle errors using errors.conf
        proxy_intercept_errors on;
        # configure health checks
        health_check uri=/api/health interval=10 fails=3 passes=2;
    }

    include /etc/nginx/conf.d/templates/errors.conf;

}
