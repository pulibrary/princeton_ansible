# {{ ansible_managed | comment }}
proxy_cache_path /var/cache/nginx/dpul-staging/ keys_zone=dpul-stagingcache:10m;

upstream dpul-staging {
    zone dpul-staging 64k;
    # lowchallenge challenges after 20 requests from xx.xx.<>.<>.<>
    # server service.consul service=lowchallenge.traefik-wall-staging resolve max_fails=0;
    # highchallenge challenges everyone. Comment above and uncomment
    # this when you're being swarmed by bots.
    server service.consul service=highchallenge.traefik-wall-staging resolve max_fails=0;
    # If Traefik crashes, fall down to the box directly.
    server dpul-staging3.princeton.edu resolve max_fails=0 backup;
    server dpul-staging4.princeton.edu resolve max_fails=0 backup;

    sticky learn
          create=$upstream_cookie_dpulstagingcookie
          lookup=$cookie_dpulstagingcookie
          zone=dpulstagingclient_sessions:1m;
    resolver nomad-host-prod1.lib.princeton.edu nomad-host-prod2.lib.princeton.edu nomad-host-prod3.lib.princeton.edu valid=5s;
    resolver_timeout 2s;
    keepalive 0;
}

server {
    listen 80;
    server_name dpul-staging.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dpul-staging.princeton.edu;

    ssl_certificate            /etc/letsencrypt/live/dpul-staging/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/dpul-staging/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    # Migrate SAE and its feature/browse pages to Digital Collections
    location ~ ^/sae/feature/dissidents-and-activists-in-sri-lanka-1960s-to-1990s/?$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/sae_sri_lanka_dissidents;
    }

    location ~ ^/sae/feature/hindu-nationalist-ephemera-collection-of-arvind-rajagopal-1960s-to-2000s/?$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/hindu-nationalist-ephemera;
    }

    location ~ ^/sae/browse/dissidents-and-activists-in-sri-lanka-1960s-to-1990s/?$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/sae_sri_lanka_dissidents;
    }

    location ~ ^/sae/browse/aurat-march-ephemera/?$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/aurat-march;
    }

    location ~ ^/sae/browse/hindu-nationalist-ephemera-collection-of-arvind-rajagopal-1960s-to-2000s/?$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/hindu-nationalist-ephemera;
    }

    location ~ ^/sae/browse/kadak-collective-creatives-against-caa-2019-2020/?$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/kadak-collective;
    }

    location ~ ^/sae/catalog/(.+)$ {
        return 301 https://dpul-collections-staging.lib.princeton.edu/item/$1;
    }

    location ~ ^/sae(/|$) {
        return 301 https://dpul-collections-staging.lib.princeton.edu/collections/sae;
    }

    location / {
        proxy_pass http://dpul-staging;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache dpul-stagingcache;
        proxy_intercept_errors on;
        health_check uri=/health.json interval=10 fails=3 passes=2;
    }

    # yes it is okay to be visible outside VPN

    include /etc/nginx/conf.d/templates/errors-without-404.conf;

}
