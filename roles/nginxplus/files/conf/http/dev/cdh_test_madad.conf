# Ansible managed
proxy_cache_path /var/cache/nginx/test_madad/ keys_zone=test_madadcache:10m;

upstream test_madad {
    zone test_madad 64k;
    server cdh-test-madad1.lib.princeton.edu;
    server cdh-test-madad2.lib.princeton.edu;
    sticky learn
          create=$upstream_cookie_test_madadcookie
          lookup=$cookie_test_madadcookie
          zone=test_madadclient_sessions:1m;
    keepalive 0;
}

server {
    listen 80;
    server_name test-madad.cdh.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name test-madad.cdh.princeton.edu;

    client_max_body_size 50M;

    ssl_certificate            /etc/letsencrypt/live/test-madad.cdh/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/test-madad.cdh/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://test_madad;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host test-madad.cdh.princeton.edu;
        proxy_cache test_madadcache;
        proxy_connect_timeout      2h;
        proxy_send_timeout         2h;
        proxy_read_timeout         2h;
        proxy_intercept_errors on;
        health_check interval=10 fails=3 passes=2;
    }
    include /etc/nginx/conf.d/templates/cdh-errors.conf;
}
