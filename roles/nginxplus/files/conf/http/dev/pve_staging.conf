upstream pve-staging {
    least_time header inflight;
    zone pve-staging 64k;

   # server lib-pvehpdc-stg01.princeton.edu:8006 resolve;
   # server lib-pvehpdc-stg02.princeton.edu:8006 resolve;
    server lib-pvehpdc-stg03.princeton.edu:8006 resolve;
   # server lib-pvensdc-stg01.princeton.edu:8006 resolve;
   # server lib-pvensdc-stg02.princeton.edu:8006 resolve;
    server lib-pvensdc-stg03.princeton.edu:8006 resolve;

    sticky cookie pve_staging_node
        expires=1h
        path=/
        httponly
        secure
        samesite=lax;
    keepalive 0;
}

# Redirect HTTP (port 80) → HTTPS on port 8006
server {
    listen 80;
    server_name pve-staging.lib.princeton.edu;
    return 301 https://$server_name:8006$request_uri;
}

# Redirect HTTPS (port 443) → HTTPS on port 8006
server {
    listen 443 ssl;
    server_name pve-staging.lib.princeton.edu;

    # Use the same certificate files as your existing block
    ssl_certificate     /etc/letsencrypt/live/pve-staging.lib/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pve-staging.lib/privkey.pem;

    # Optional: keep SSL settings consistent
    ssl_session_cache shared:lib_pve-staging_SSL_redirect:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://$server_name:8006$request_uri;
}

server {
    listen 8006 ssl;
    server_name pve-staging.lib.princeton.edu;

    client_max_body_size 0;

    access_log /var/log/nginx/pve-staging_access.log;
    error_log  /var/log/nginx/pve-staging_error.log;

    ssl_certificate     /etc/letsencrypt/live/pve-staging.lib/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pve-staging.lib/privkey.pem;

    ssl_session_cache shared:lib_pve_staging_SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://pve-staging;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_ssl_verify off;

        proxy_connect_timeout 450s;
        proxy_send_timeout 450s;
        proxy_read_timeout 450s;

        health_check uri=/api2/json/version
                     interval=10s
                     fails=3
                     passes=2
                     match=pve_staging_health;
    }
}

match pve_staging_health {
    status 401;
}
