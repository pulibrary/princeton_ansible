# Ansible managed
proxy_cache_path /var/cache/nginx/catalog-cluster-staging/ keys_zone=catalog-cluster-stagingcache:10m;

map $limit $external_traffic {
    0 "";
    1 $binary_remote_addr;
}

# zone: 10mb can hold 160K IP addresses in memory
limit_req_zone $external_traffic zone=catalog-cluster-staging-ratelimit:10m rate=10r/s;

upstream catalog-cluster-staging {
    zone catalog-cluster-staging 64k;
    server catalog-cluster-staging1.princeton.edu resolve;
    server catalog-cluster-staging2.princeton.edu resolve;
    sticky learn
          create=$upstream_cookie_catalog-cluster-stagingcookie
          lookup=$cookie_catalog-cluster-stagingcookie
          zone=catalog-cluster-stagingclient_sessions:1m;
    keepalive 0;
}

server {
    listen 80;
    server_name catalog-cluster-staging.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name catalog-cluster-staging.princeton.edu;

    ssl_certificate            /etc/letsencrypt/live/catalog-cluster-staging/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/catalog-cluster-staging/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://catalog-cluster-staging;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache catalog-cluster-stagingcache;
        limit_req zone=catalog-cluster-staging-ratelimit burst=20 nodelay;
        # handle errors using errors.conf
        proxy_intercept_errors on;
        health_check uri=/health.json interval=10 fails=3 passes=2;
    }

    include /etc/nginx/conf.d/templates/errors-without-404.conf;

}