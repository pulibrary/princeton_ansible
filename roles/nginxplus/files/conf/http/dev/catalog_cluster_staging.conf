# Ansible managed
proxy_cache_path /var/cache/nginx/catalog_cluster_staging/ keys_zone=catalog_cluster_stagingcache:10m;

upstream catalog_cluster_staging {
    zone catalog_cluster_staging 64k;
    server service.consul service=catalog-cluster-staging-web resolve;
    sticky learn
          create=$upstream_cookie_catalog-cluster-stagingcookie
          lookup=$cookie_catalog-cluster-stagingcookie
          zone=catalog-cluster-stagingclient_sessions:1m;
    resolver nomad-host-prod1.lib.princeton.edu:8600 nomad-host-prod2.lib.princeton.edu:8600 nomad-host-prod3.lib.princeton.edu:8600 valid=5s;
    resolver_timeout 2s;
    keepalive 0;
}

server {
    listen 80;
    server_name catalog-cluster-staging.princeton.edu;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name catalog-cluster-staging.princeton.edu;

    ssl_certificate            /etc/letsencrypt/live/catalog-cluster-staging/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/catalog-cluster-staging/privkey.pem;
    ssl_session_cache          shared:SSL:1m;
    ssl_prefer_server_ciphers  on;

    location / {
        proxy_pass http://catalog_cluster_staging;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache catalog_cluster_stagingcache;
        proxy_intercept_errors on;
        # health_check interval=10 fails=3 passes=2;
    }

    include /etc/nginx/conf.d/templates/errors.conf;

}