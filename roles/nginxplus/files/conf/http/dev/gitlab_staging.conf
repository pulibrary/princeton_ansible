# Ansible managed

#
# WebSocket / HTTP upgrade handling
#
map $http_upgrade $gitlab_staging_connection_upgrade {
    default upgrade;
    ''      close;
}

#
# Rate-limit authentication-related endpoints only.
# Requests with an empty key are not rate limited.
#
map $uri $gitlab_staging_auth_limit_key {
    default             "";
    ~^/users/sign_in$   $binary_remote_addr;
    ~^/users/password   $binary_remote_addr;
}

limit_req_zone $gitlab_staging_auth_limit_key
               zone=gitlab_staging_auth:10m
               rate=30r/m;

#
# Log $uri rather than $request_uri because $request_uri includes
# query-string arguments. GitLab APIs can accept authentication tokens
# in query parameters, so omitting arguments reduces the risk of
# credentials being written to access logs.
#
# NGINX:
# https://nginx.org/en/docs/http/ngx_http_core_module.html
#
# GitLab:
# https://docs.gitlab.com/api/rest/authentication/
#
log_format gitlab_staging_security escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

upstream gitlab-staging {
    zone gitlab-staging 64k;

    server gitlab-staging-vm.lib.princeton.edu:443 resolve;

    sticky learn
          create=$upstream_cookie_gitlabstagingcookie
          lookup=$cookie_gitlabstagingcookie
          zone=gitlabstagingclient_sessions:1m;
}

server {
    listen 80;
    server_name gitlab-staging.lib.princeton.edu;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name gitlab-staging.lib.princeton.edu;

    #
    # Do not expose the NGINX version.
    #
    server_tokens off;

    #
    # Public-facing TLS
    #
    ssl_certificate     /etc/letsencrypt/live/gitlab-staging.lib/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitlab-staging.lib/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    ssl_prefer_server_ciphers on;

    #
    # Keep this at 1m because the shared SSL zone is also used
    # by other virtual hosts.
    #
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;

    #
    # Force HTTPS for future browser connections.
    #
    add_header Strict-Transport-Security "max-age=31536000" always;

    #
    # Logging / monitoring
    #
    access_log /var/log/nginx/gitlab_staging_access.log gitlab_staging_security;
    error_log  /var/log/nginx/gitlab_staging_error.log warn;

    #
    # Use 429 for rate limiting rather than the default 503.
    #
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        # app_protect_enable off;
        # app_protect_security_log_enable on;

        #
        # Rate limiting applies only to authentication-related URLs.
        # The map above returns an empty key for all other requests, and
        # NGINX does not account requests whose limit_req key evaluates
        # to an empty value. Normal GitLab web, API, clone, push, CI,
        # and artifact traffic is therefore outside this rate limit.
        #
        # https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
        # https://nginx.org/en/docs/http/ngx_http_map_module.html
        #
        limit_req zone=gitlab_staging_auth burst=20 nodelay;

        #
        # Permit methods GitLab legitimately uses while rejecting
        # methods such as TRACE, CONNECT, and WebDAV methods.
        #
        limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
            deny all;
        }

        proxy_pass https://gitlab-staging;

        #
        # Required for WebSocket support and persistent upstream
        # connections.
        #
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $gitlab_staging_connection_upgrade;

        #
        # Verify the GitLab backend TLS certificate.
        #
        proxy_ssl_server_name on;
        proxy_ssl_name gitlab-staging-vm.lib.princeton.edu;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;

        #
        # Allow long-running Git operations.
        #
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
