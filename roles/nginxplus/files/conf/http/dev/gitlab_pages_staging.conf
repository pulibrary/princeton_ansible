# Ansible managed
#
# GitLab Pages (staging). See roles/gitlab/PAGES.md.
#

log_format gitlab_pages_staging_security escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"host":"$host",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

#
# The bundled GitLab NGINX serves the Pages vhost on its own port
# (gitlab_pages_nginx_listen_port) and only accepts the load balancers.
#
upstream gitlab-pages-staging {
    zone gitlab-pages-staging 64k;

    server gitlab-staging-vm.lib.princeton.edu:8443 resolve;

    keepalive 0;
}

server {
    listen 80;
    server_name pages-staging.lib.princeton.edu;
    server_tokens off;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name pages-staging.lib.princeton.edu;

    #
    # Do not expose the NGINX version.
    #
    server_tokens off;

    #
    # Public-facing TLS
    #
    ssl_certificate     /etc/letsencrypt/live/pages-staging.lib/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pages-staging.lib/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    ssl_prefer_server_ciphers on;

    #
    # Keep this at 1m because the shared SSL zone is also used
    # by other virtual hosts.
    #
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/gitlab_pages_staging_access.log gitlab_pages_staging_security;
    error_log  /var/log/nginx/gitlab_pages_staging_error.log warn;

    location / {
        #
        # Pages serves static sites; the access-control callback
        # (/projects/auth) is a GET as well.
        #
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass https://gitlab-pages-staging;

        proxy_http_version 1.1;

        #
        # Pages routes on the Host header and builds redirects from it.
        #
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        #
        # Verify the GitLab backend TLS certificate (the VM certificate,
        # same as the main GitLab upstream).
        #
        proxy_ssl_server_name on;
        proxy_ssl_name gitlab-staging-vm.lib.princeton.edu;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
    }
}
