---
# defaults file for roles/gitlab
gitlab_pu_ldap_bind_dn: "bind_name"
gitlab_pu_ldap_password: "ldap_password"
gitlab_loadbalancer_domain_name: "example.edu"
gitlab_loadbalancer_real_ip_trusted: "{{ gitlab_trusted_proxies }}"
gitlab_trusted_proxies: "'192.168.0.0', '10.0.0.0', '172.16.0.0'"
gitlab_google_key_id: "google_key"
gitlab_google_access_key: "google_secret"
gitlab_google_bucket: "google-bucket"
gitlab_entra_identifier_id: "59aa71e1-3e75-40f5-9c00-8e6f330b7f10"
gitlab_entra_issuer_id: "59aa71e1-3e75-40f5-9c00-8e6f330b7f10"
gitlab_entra_secret_id: "456dh~Hy9SXYAtsOwdg4yi92GzGfrKSNZg6KKcZw"

# GitLab Pages (see PAGES.md). Off unless an environment turns it on.
gitlab_pages_enabled: false
# Public Pages hostname served by the load balancers. It must not be
# gitlab_loadbalancer_domain_name or a subdomain of it.
gitlab_pages_domain_name: ""
# Single-domain sites: https://<pages host>/<namespace>/<project>
# Generally available in GitLab 17.4.
gitlab_pages_namespace_in_path: true
gitlab_pages_min_version: "17.4.0"
gitlab_pages_access_control: true
# Pages daemon stays on loopback; only the bundled NGINX talks to it.
gitlab_pages_listen_proxy: "localhost:8090"
# Bundled NGINX vhost for Pages that the load balancers proxy to over TLS.
gitlab_pages_nginx_listen_addresses:
  - "{{ ansible_facts['default_ipv4']['address'] | default('127.0.0.1') }}"
gitlab_pages_nginx_listen_port: 8443
# Only these addresses may reach the Pages vhost (the load balancers).
gitlab_pages_allowed_proxies: []
