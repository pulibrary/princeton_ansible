---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify the deploy user can run jmeter
      ansible.builtin.command:
        cmd: jmeter --version
        chdir: /home/deploy/loadtests
      become: true
      become_user: deploy
      register: loadtest_verify_jmeter
      changed_when: false

    - name: Verify the deploy user can run k6
      ansible.builtin.command:
        cmd: k6 version
      become: true
      become_user: deploy
      register: loadtest_verify_k6
      changed_when: false

    - name: Verify the deploy user can run the sample k6 script
      ansible.builtin.command:
        cmd: k6 inspect /home/deploy/loadtests/k6/smoke.js
      become: true
      become_user: deploy
      changed_when: false

    - name: Assert expected versions
      ansible.builtin.assert:
        that:
          - "'5.6.3' in loadtest_verify_jmeter.stdout"
          - "'v2.3.0' in loadtest_verify_k6.stdout"
