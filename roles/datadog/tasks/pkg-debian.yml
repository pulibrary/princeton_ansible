---
- name: Datadog | Install apt dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - apt-transport-https
    - gpg
  when: not ansible_check_mode

# - name: Install ubuntu apt-key server
