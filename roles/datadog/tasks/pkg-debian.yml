---
- name: Datadog | Install apt dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - apt-transport-https
    - gpg
  when: not ansible_check_mode

# - name: Install ubuntu apt-key server
#   ansible.builtin.apt_key:
#     id: 33EE313BAD9589B7
#     keyserver: "{{ datadog_apt_backup_keyserver if use_apt_backup_keyserver else datadog_apt_keyserver }}"
#     state: present
#     # keyserver.ubuntu.com is a pool of server, we should retry if one of them is down
#   register: result
#   until: not result.failed is defined or not result.failed
#   retries: "{{ datadog_apt_key_retries }}"
#   when: datadog_apt_key_url_new is not defined

- name: Install Datadog apt-key
  ansible.builtin.apt_key:
    id: 33EE313BAD9589B7
    url: "{{ datadog_apt_key_url_new }}"
    state: present
  when: datadog_apt_key_url_new is defined

# apt_repository wrote every Datadog line (http and https) to this file.
- name: Remove legacy Datadog apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/apt_datadoghq_com.list
    state: absent
  when: not ansible_check_mode

- name: Add an expired key by id from a keyserver
  ansible.builtin.apt_key:
    keyserver: keyserver.ubuntu.com
    id: "{{ recv_key | default(omit) }}"
  when: recv_key is defined

- name: update release info
  ansible.builtin.command: apt-get --allow-releaseinfo-change update
  changed_when: false

- name: Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode

- name: Ensure Datadog repository is up-to-date
  ansible.builtin.deb822_repository:
    name: datadog
    types: [deb]
    uris: "{{ datadog_apt_repo_uri }}"
    suites: ["{{ datadog_apt_repo_suite }}"]
    components: "{{ datadog_apt_repo_components }}"
    state: "{% if datadog_agent5 %}absent{% else %}present{% endif %}"
  register: datadog_apt_repo_result
  when: not ansible_check_mode

- name: (agent5) Ensure Datadog repository is up-to-date
  ansible.builtin.deb822_repository:
    name: datadog-agent5
    types: [deb]
    uris: "{{ datadog_agent5_apt_repo_uri }}"
    suites: ["{{ datadog_agent5_apt_repo_suite }}"]
    components: "{{ datadog_agent5_apt_repo_components }}"
    state: "{% if datadog_agent5 %}present{% else %}absent{% endif %}"
  register: datadog_agent5_apt_repo_result
  when: not ansible_check_mode

- name: Update apt cache after changing Datadog repositories
  ansible.builtin.apt:
    update_cache: true
  when: datadog_apt_repo_result is changed or datadog_agent5_apt_repo_result is changed

- name: Datadog | Gather installed package versions
  ansible.builtin.package_facts:
    manager: apt

# Compare upstream versions only: "1:7.84.6-1" -> "7.84.6"
- name: Datadog | Record installed and pinned agent versions
  ansible.builtin.set_fact:
    datadog_agent_installed_version: >-
      {{ (ansible_facts.packages['datadog-agent']
          | default([{'version': ''}]))[0].version
         | regex_replace('^[0-9]+:', '') | regex_replace('-[^-]*$', '') }}
    datadog_agent_pinned_version: >-
      {{ datadog_agent_version
         | regex_replace('^[0-9]+:', '') | regex_replace('-[^-]*$', '') }}

# Skipped when a newer agent is already installed, so we never downgrade.
- name: Ensure pinned version of Datadog agent is installed
  ansible.builtin.apt:
    name: "datadog-agent={{ datadog_agent_version }}"
    state: present
    allow_downgrade: "{{ datadog_agent_allow_downgrade }}"
    update_cache: true
    cache_valid_time: "{{ datadog_apt_cache_valid_time }}"
  when:
    - datadog_agent_version | length != 0
    - not ansible_check_mode
    - datadog_agent_allow_downgrade
      or datadog_agent_installed_version | length == 0
      or datadog_agent_installed_version
         is version(datadog_agent_pinned_version, '<')
  notify: restart datadog-agent

- name: Ensure Datadog agent is installed
  ansible.builtin.apt:
    name: datadog-agent
    state: latest  # noqa 403
    update_cache: true
    cache_valid_time: "{{ datadog_apt_cache_valid_time }}"
  when: (datadog_agent_version | length == 0) and (not ansible_check_mode)
  notify: restart datadog-agent

- name: Datadog | Gather installed package versions after install
  ansible.builtin.package_facts:
    manager: apt
  when: not ansible_check_mode

- name: Datadog | Fail if the installed agent is older than the minimum version
  ansible.builtin.assert:
    that:
      - "'datadog-agent' in ansible_facts.packages"
      - ansible_facts.packages['datadog-agent'][0].version
        | regex_replace('^[0-9]+:', '') | regex_replace('-[^-]*$', '')
        is version(datadog_agent_minimum_version, '>=')
    fail_msg: >-
      datadog-agent is older than {{ datadog_agent_minimum_version }}.
      Older agents accept certificate chains containing the compromised
      eMudhra intermediate CA keys.
    quiet: true
  when: not ansible_check_mode
