#   register: result
#   until: not result.failed is defined or not result.failed
#   retries: "{{ datadog_apt_key_retries }}"
#   when: datadog_apt_key_url_new is not defined

- name: Install Datadog apt-key
  ansible.builtin.apt_key:
    id: 33EE313BAD9589B7
    url: "{{ datadog_apt_key_url_new }}"
    state: present
  when: datadog_apt_key_url_new is defined

# apt_repository wrote every Datadog line (http and https) to this file.
- name: Remove legacy Datadog apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/apt_datadoghq_com.list
    state: absent
  when: not ansible_check_mode

- name: Add an expired key by id from a keyserver
  ansible.builtin.apt_key:
    keyserver: keyserver.ubuntu.com
    id: "{{ recv_key | default(omit) }}"
  when: recv_key is defined

- name: update release info
  ansible.builtin.command: apt-get --allow-releaseinfo-change update
  changed_when: false

- name: Ensure Datadog repository is up-to-date
  ansible.builtin.deb822_repository:
    name: datadog
    types: [deb]
    uris: "{{ datadog_apt_repo_uri }}"
    suites: ["{{ datadog_apt_repo_suite }}"]
    components: "{{ datadog_apt_repo_components }}"
    state: "{% if datadog_agent5 %}absent{% else %}present{% endif %}"
    install_python_debian: true
  register: datadog_apt_repo_result
  when: not ansible_check_mode

- name: (agent5) Ensure Datadog repository is up-to-date
  ansible.builtin.deb822_repository:
    name: datadog-agent5
    types: [deb]
    uris: "{{ datadog_agent5_apt_repo_uri }}"
    suites: ["{{ datadog_agent5_apt_repo_suite }}"]
    components: "{{ datadog_agent5_apt_repo_components }}"
    state: "{% if datadog_agent5 %}present{% else %}absent{% endif %}"
    install_python_debian: true
  register: datadog_agent5_apt_repo_result
  when: not ansible_check_mode

- name: Update apt cache after changing Datadog repositories
  ansible.builtin.apt:
    update_cache: true
  when: datadog_apt_repo_result is changed or datadog_agent5_apt_repo_result is changed

- name: Ensure pinned version of Datadog agent is installed
  ansible.builtin.apt:
    name: "datadog-agent={{ datadog_agent_version }}"
    state: present
    force: "{{ datadog_agent_allow_downgrade }}"
    update_cache: true
    cache_valid_time: "{{ datadog_apt_cache_valid_time }}"
  when: (datadog_agent_version | length != 0) and (not ansible_check_mode)

- name: Ensure Datadog agent is installed
  ansible.builtin.apt:
    name: datadog-agent
    state: latest  # noqa 403
    update_cache: true
    cache_valid_time: "{{ datadog_apt_cache_valid_time }}"
  when: (datadog_agent_version | length == 0) and (not ansible_check_mode)
