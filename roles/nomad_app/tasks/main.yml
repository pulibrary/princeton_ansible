---
- name: Nomad App | configure postgres
  ansible.builtin.include_tasks: database_setup.yml
  loop: "{{ database_connections }}"
  no_log: true
  when:
    - running_on_server
- name: Nomad App | configure host volumes
  ansible.builtin.include_tasks: volume_setup.yml
  loop: "{{ nomad_volumes }}"
  when:
    - running_on_server
- name: 'Nomad App | set nomad variables'
  when:
    - nomad_vars is defined
    - running_on_server
  loop: "{{ nomad_vars | dict2items }}"
  no_log: true
  ansible.builtin.shell:
    cmd: >
      /usr/local/bin/nomad var put -force 
      nomad/jobs/{{ item.key }}
      {{ item.value.keys() | zip(item.value.values()) | map("join", "=") | join(" ") }}
  environment:
    NOMAD_TOKEN: '{{ pul_nomad_management_token }}'
    run_once: true
- name: 'Nomad App | Deploy'
  when:
    - running_on_server
    - nomad_hcl is defined
  block:
    - name: 'Nomad App | Deploy | Get SHA for {{ nomad_branch }}'
      delegate_to: "localhost"
      become: false
      ansible.builtin.shell:
        cmd: >-
          git ls-remote https://github.com/pulibrary/{{ nomad_repository }}.git
          refs/heads/{{ nomad_branch | quote }} refs/tags/{{ nomad_branch | quote }}
          | awk 'NR==1 { print $1 }'
      register: nomad_branch_ref
      changed_when: false

    - name: 'Nomad App | Deploy | Plan'
      delegate_to: "localhost"
      become: false
      # There's a -json-output in Nomad 2.0.5+, but nix doesn't have it yet.
      ansible.builtin.command:
        cmd: "nomad job plan -var branch_or_sha={{ nomad_branch_ref.stdout[:7] }} {{ nomad_hcl }}"
      environment:
        NOMAD_ADDR: "https://nomad.lib.princeton.edu"
        NOMAD_TOKEN: "{{ pul_nomad_management_token }}"
      register: nomad_plan
      changed_when: false
      failed_when: nomad_plan.rc not in [0, 1]
      check_mode: false

    # Delegate to the nomad binary so it blocks until it deploys. The ansible general role
    # doesn't.
    - name: 'Nomad App | Deploy | Execute'
      delegate_to: "localhost"
      become: false
      # Parse and pass the check-index from plan, juuusttt in case.
      ansible.builtin.command:
        cmd: >-
          nomad job run
          -check-index {{ nomad_plan.stdout | regex_search('Job Modify Index: (\d+)', '\1') | first }}
          -var branch_or_sha={{ nomad_branch_ref.stdout[:7] }}
          {{ nomad_hcl }}
      environment:
        NOMAD_ADDR: "https://nomad.lib.princeton.edu"
        NOMAD_TOKEN: "{{ pul_nomad_management_token }}"
      # Make sure there's a change in Job for the plan diff, if there's not then
      # what's up there is what we have, so no point.
      when: nomad_plan.stdout is search('^[+-][^ ]* Job:', multiline=True)
