---
- name: Nginx | Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
      - ubuntu-keyring
    state: present
    update_cache: true
    cache_valid_time: 600

- name: Nginx | Import nginx.org signing key
  ansible.builtin.apt_key:
    state: present
    url: https://nginx.org/keys/nginx_signing.key

- name: Nginx | Remove legacy nginx.org apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nginx.list
    state: absent

- name: Nginx | Add nginx.org repository
  ansible.builtin.deb822_repository:
    name: nginx
    types: [deb]
    uris: http://nginx.org/packages/ubuntu/
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [nginx]
    state: present
    install_python_debian: true

- name: Nginx | Update apt cache after adding repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  register: nginx_repo_cache_update
  retries: 3
  delay: 5
  until: nginx_repo_cache_update is succeeded

- name: Nginx | Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_package_name }}"
    state: present
