---
- name: Nginx | Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
      - ubuntu-keyring
    state: present
    update_cache: true
    cache_valid_time: 600

- name: Nginx | Import nginx.org signing key
  ansible.builtin.apt_key:
    state: present
    url: https://nginx.org/keys/nginx_signing.key

- name: Nginx | Remove legacy nginx.org apt source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nginx.list
    state: absent

- name: Nginx | Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Nginx | Add nginx.org repository
  ansible.builtin.deb822_repository:
    name: nginx
    types: [deb]
    uris: http://nginx.org/packages/ubuntu/
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [nginx]
    state: present

# The local mirror pin (Pin-Priority 600) would otherwise win over nginx.org,
# installing Ubuntu's nginx, which runs as www-data and has no nginx user.
- name: Nginx | Prefer nginx.org packages
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99nginx
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: *
      Pin: origin nginx.org
      Pin-Priority: 900

- name: Nginx | Update apt cache after adding repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  register: nginx_repo_cache_update
  retries: 3
  delay: 5
  until: nginx_repo_cache_update is succeeded

- name: Nginx | Populate package facts
  ansible.builtin.package_facts:
    manager: auto

# Hosts that already have Ubuntu's nginx need an upgrade to switch to nginx.org
- name: Nginx | Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_package_name }}"
    state: "{{ 'latest' if 'ubuntu' in ((ansible_facts.packages[nginx_package_name] | default([{}]))[0].version | default('')) else 'present' }}"
