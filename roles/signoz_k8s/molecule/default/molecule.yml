---
scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
platforms:
  - name: instance
    image: "ghcr.io/pulibrary/vm-builds/ubuntu-22.04"
    command: "" # image above already has the /sbin/init
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  # Molecule no longer puts the repository's roles directory on the role
  # search path, so playbooks cannot find roles by name without this.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    create: create.yml
    destroy: destroy.yml
  log: true
  inventory:
    group_vars:
      all:
        # The role talks to ClickHouse, Kubernetes and SigNoz; the tests
        # point it at the stand-ins installed by prepare.yml instead.
        signoz_namespace: platform
        signoz_ingress_host: signoz.example.org
        signoz_microk8s_bin: /usr/local/bin/fake-microk8s
        signoz_clickhouse_client_argv:
          - /usr/local/bin/fake-clickhouse-client
        signoz_alert_rules_enabled: true
        signoz_api_url: http://127.0.0.1:18080
        signoz_api_key: molecule-test-key
        signoz_alert_channels:
          - ops-email
        signoz_checkmk_ingestion_enabled: true
        signoz_checkmk_monitor_host: instance
        signoz_checkmk_clickhouse_disk_enabled: true
        signoz_clickhouse_local_storage_node: instance
        signoz_clickhouse_local_mount_path: /
verifier:
  name: ansible
