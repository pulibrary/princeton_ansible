---
# Alert rules use the v2alpha1 rule schema, the only one SigNoz accepts from
# v0.150 on. The full rule list (GET /api/v2/rules) is gone: rules are listed
# as summaries from /api/v3/rules and read one by one from /api/v2/rules/{id}.
- name: SigNoz | Assert alert rule settings
  ansible.builtin.assert:
    that:
      - signoz_api_key | length > 0
      - signoz_alert_channels | length > 0
    fail_msg: >-
      signoz_alert_rules_enabled needs signoz_api_key (from the vault) and
      signoz_alert_channels naming existing SigNoz notification channels.

- name: SigNoz | List notification channels
  ansible.builtin.uri:
    url: "{{ signoz_api_url }}/api/v1/channels"
    headers:
      SigNoz-Api-Key: "{{ signoz_api_key }}"
    validate_certs: "{{ signoz_api_validate_certs }}"
    timeout: 30
    return_content: true
  register: signoz_channels_response
  check_mode: false
  no_log: true

- name: SigNoz | Assert alert channels already exist
  ansible.builtin.assert:
    that:
      - signoz_missing_channels | length == 0
    fail_msg: "SigNoz notification channels not found: {{ signoz_missing_channels | join(', ') }}"
  vars:
    signoz_missing_channels: >-
      {{ signoz_alert_channels | difference(signoz_channels_response.json.data | map(attribute='name') | list) }}

- name: SigNoz | List alert rules
  ansible.builtin.uri:
    url: "{{ signoz_api_url }}/api/v3/rules?limit=200"
    headers:
      SigNoz-Api-Key: "{{ signoz_api_key }}"
    validate_certs: "{{ signoz_api_validate_certs }}"
    timeout: 30
    return_content: true
  register: signoz_rules_response
  check_mode: false
  no_log: true

# 200 is the API's page limit. Paging is not implemented because a missed
# page would make an existing rule look missing and get it created twice.
- name: SigNoz | Refuse to work from a partial rule list
  ansible.builtin.assert:
    that:
      - signoz_rule_summaries | length == signoz_rules_response.json.data.total | int
    fail_msg: >-
      SigNoz has {{ signoz_rules_response.json.data.total }} alert rules, more
      than one page of the list API. Add paging to alerts.yml before managing
      rules here.
  vars:
    signoz_rule_summaries: "{{ signoz_rules_response.json.data.rules | default([], true) }}"

- name: SigNoz | Read the rules this role manages
  ansible.builtin.uri:
    url: "{{ signoz_api_url }}/api/v2/rules/{{ item.id }}"
    headers:
      SigNoz-Api-Key: "{{ signoz_api_key }}"
    validate_certs: "{{ signoz_api_validate_certs }}"
    timeout: 30
    return_content: true
  register: signoz_rule_details
  check_mode: false
  no_log: true
  loop: >-
    {{ signoz_rules_response.json.data.rules | default([], true)
       | selectattr('alert', 'in', signoz_alert_rules | map(attribute='alert') | list) | list }}
  loop_control:
    label: "{{ item.alert }}"

- name: SigNoz | Collect existing managed rules
  ansible.builtin.set_fact:
    signoz_existing_rules: "{{ signoz_rule_details.results | map(attribute='json') | map(attribute='data') | list }}"

- name: SigNoz | Reset desired alert rules
  ansible.builtin.set_fact:
    signoz_alert_rule_payloads: []

- name: SigNoz | Build desired alert rules
  ansible.builtin.set_fact:
    signoz_alert_rule_payloads: "{{ signoz_alert_rule_payloads | default([]) + [signoz_alert_rule_payload] }}"
  vars:
    signoz_alert_rule_payload:
      schemaVersion: v2alpha1
      alert: "{{ item.alert }}"
      alertType: METRIC_BASED_ALERT
      ruleType: promql_rule
      description: "{{ item.description }}"
      disabled: false
      labels: "{{ item.labels | default({}) }}"
      annotations:
        summary: "{{ item.alert }}"
        description: "{{ item.description }}"
      condition:
        compositeQuery:
          queryType: promql
          panelType: graph
          queries:
            - type: promql
              spec:
                name: A
                query: "{{ item.condition.query }}"
                disabled: false
        selectedQueryName: A
        alertOnAbsent: "{{ item.condition.alertOnAbsent }}"
        absentFor: "{{ signoz_alert_absent_minutes | int if item.condition.alertOnAbsent else 0 }}"
        thresholds:
          kind: basic
          spec:
            - name: "{{ item.severity }}"
              target: "{{ item.condition.target | float }}"
              targetUnit: ""
              op: "{{ item.condition.op }}"
              matchType: "{{ item.condition.matchType }}"
              channels: "{{ signoz_alert_channels | sort }}"
      evaluation:
        kind: rolling
        spec:
          evalWindow: "{{ item.evalWindow }}"
          frequency: "{{ item.frequency }}"
      notificationSettings:
        renotify:
          enabled: true
          interval: "{{ signoz_alert_renotify_interval }}"
          alertStates: "{{ ['firing'] + (['nodata'] if item.condition.alertOnAbsent else []) }}"
        usePolicy: false
  loop: "{{ signoz_alert_rules }}"
  loop_control:
    label: "{{ item.alert }}"

- name: SigNoz | Plan alert rule changes
  ansible.builtin.include_tasks: alerts_plan.yml

- name: SigNoz | Create missing alert rules
  ansible.builtin.uri:
    url: "{{ signoz_api_url }}/api/v2/rules"
    method: POST
    headers:
      SigNoz-Api-Key: "{{ signoz_api_key }}"
    body_format: json
    body: "{{ item }}"
    validate_certs: "{{ signoz_api_validate_certs }}"
    timeout: 30
    status_code: [200, 201]
  changed_when: true
  loop: "{{ signoz_alert_rules_to_create }}"
  loop_control:
    label: "{{ item.alert }}"

- name: SigNoz | Update drifted alert rules
  ansible.builtin.uri:
    url: "{{ signoz_api_url }}/api/v2/rules/{{ item.id }}"
    method: PUT
    headers:
      SigNoz-Api-Key: "{{ signoz_api_key }}"
    body_format: json
    body: "{{ item.rule }}"
    validate_certs: "{{ signoz_api_validate_certs }}"
    timeout: 30
    status_code: [200, 204]
  changed_when: true
  loop: "{{ signoz_alert_rules_to_update }}"
  loop_control:
    label: "{{ item.rule.alert }}"
