---
# Staging app servers also trust the towerdeploy-staging1 deploy key.
# This overrides the list in group_vars/all/vars.yml, so keep the two in sync.
deploy_user_local_keys:
  - name: heaven
    key: "{{ lookup('file', '../keys/heaven.pub') }}"
  - name: TowerDeployKey
    key: "{{ lookup('file', '../keys/TowerDeployKey.pub') }}"
  - name: CodeDeployKey
    key: "{{ lookup('file', '../keys/CodeDeployKey.pub') }}"
  - name: TowerStagingDeployKey
    key: "{{ lookup('file', '../keys/TowerStagingDeployKey.pub') }}"
