---
analytics_secret_key_base: '{{vault_analytics_staging_secret_key}}'
db_name: 'analytics_staging'
db_user: 'analytics_staging'
db_password: '{{ vault_analytics_staging_db_password }}'
db_host: 'lib-postgres-staging1.princeton.edu'
db_admin_user: "postgres"
database_connections:
  - db_host: '{{ db_host }}'
    db_name: '{{ db_name }}'
    db_user: '{{ db_user }}'
    db_owner: '{{ db_user }}'
    db_password: '{{ db_password }}'
    db_admin_user: "{{ db_admin_user }}"
nomad_vars:
  # Job name
  analytics-staging:
    SECRET_KEY_BASE: '{{ analytics_secret_key_base }}'
    DB_NAME: '{{ db_name }}'
    DB_USER: '{{ db_user }}'
    DB_PASSWORD: '{{ db_password }}'
    POSTGRES_HOST: '{{ db_host }}'
    OAUTH2_COOKIE_SECRET: '{{ vault_analytics_staging_oauth2_cookie_secret }}'
    OAUTH2_REDIS_PASSWORD: '{{ vault_analytics_staging_oauth2_redis_password }}'
umami_job: 'analytics-staging'
umami_tokens_var: 'nomad/jobs/analytics-staging/web/nginx'
umami_admin_username: 'admin'
umami_admin_password: '{{ vault_analytics_staging_umami_admin_password }}'
umami_team_name: 'Princeton University Library'
umami_token_accounts:
  - username: 'entra-admin'
    id: '31199029-ef0c-419b-a227-9452fb1d301d'
    role: 'admin'
    team_role: 'team-manager'
    password: '{{ vault_analytics_staging_umami_entra_admin_password }}'
    token_key: 'UMAMI_ADMIN_TOKEN'
  - username: 'entra-viewer'
    id: '51be2ee1-ce77-47ab-a8f2-a03dbfd334e4'
    role: 'view-only'
    team_role: 'team-view-only'
    password: '{{ vault_analytics_staging_umami_entra_viewer_password }}'
    token_key: 'UMAMI_VIEWER_TOKEN'
