---
adc_domain: "adc-dev.lib.princeton.edu"
nginx_http_upload_src: conf/http/dev/*.conf
nginx_stream_upload_src: conf/stream/dev/*.conf
nginx_template_upload_src: conf/http/dev/templates/*.conf

# Long-term support release. Only security patches land here, and it is the
# first release where connection reuse to backends is on unless we opt out
# with "keepalive 0;" in each upstream.
nginx_plus_release: R37.0

# The long-term support release can emit error logs as JSON, so the log
# shipper below parses them as structured data rather than scraping text.
nginx_error_log_json: true

# Modules to install
nginx_modules:
  waf: false
  geoip: true
  njs: true
  perl: true
  image_filter: true
  rtmp: true
  otel: true
  xslt: true

# dos: true

# App Protect logs
app_protect_dir: "/var/log/app_protect/*.log"

sites: []

# Grafana Beyla
beyla_enabled: true
beyla_service_name: nginxplus-lb
beyla_environment: staging

beyla_otlp_endpoint: http://127.0.0.1:4318
beyla_otlp_protocol: http/protobuf

beyla_open_ports:
  - 80
  - 443

# Propagate W3C trace context through normal HTTP headers without enabling
# Beyla's IP-option/TC propagation mechanism.
beyla_bpf_context_propagation: headers

# Beyla requires elevated eBPF and process-inspection privileges.
beyla_privileged: true

# SigNoz / OpenTelemetry Collector for NGINX Plus load balancers
nginxplus_otel_enabled: true

otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: nginxplus-lb
  service.version: staging
  environment: staging
  deployment.environment: staging

otel_receivers:
  # Receives native NGINX OpenTelemetry traces and Beyla telemetry.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  nginx:
    endpoint: http://127.0.0.1:18080/nginx_status
    collection_interval: 30s

  filelog/nginxplus-access:
    include:
      - /var/log/nginx/access.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_nginxplus_access_json
        parse_from: body

      - type: time_parser
        parse_from: attributes.timestamp
        layout_type: gotime
        layout: "2006-01-02T15:04:05Z07:00"
        on_error: send

      # Extract the first digit of the HTTP status code and map the resulting
      # status class to a real OpenTelemetry severity.
      - type: regex_parser
        id: parse_nginxplus_access_status
        parse_from: attributes.status
        regex: '^(?P<status_class>[1-5])\d\d$'
        severity:
          parse_from: attributes.status_class
          mapping:
            info:
              - "1"
              - "2"
              - "3"
            warn: "4"
            error: "5"
        on_error: send

      - type: trace_parser
        id: parse_nginxplus_trace_context
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
        on_error: send

      - type: add
        field: attributes.log_type
        value: nginxplus_access

      - type: add
        field: attributes.service_name
        value: nginxplus-lb

  filelog/nginxplus-error:
    include:
      - /var/log/nginx/error.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # Early startup failures are still written as plain text, and during the
      # upgrade the file holds a mix of both, so unparseable lines are kept
      # rather than dropped.
      - type: json_parser
        id: parse_nginxplus_error_json
        parse_from: body
        on_error: send_quiet

      - type: time_parser
        parse_from: attributes.timestamp
        layout_type: gotime
        layout: "2006-01-02T15:04:05.000-07:00"
        on_error: send_quiet

      # notice, crit, alert and emerg have no default meaning, and anything
      # left unmapped is discarded later by the info-and-above filter.
      - type: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info:
            - info
            - notice
          warn: warn
          error: error
          fatal:
            - crit
            - alert
            - emerg
        on_error: send_quiet

      # Surface the human-readable text instead of the raw JSON document.
      - type: move
        from: attributes.msg
        to: body
        on_error: send_quiet

      - type: add
        field: attributes.log_type
        value: nginxplus_error

      - type: add
        field: attributes.service_name
        value: nginxplus-lb

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  filter/info_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_INFO

  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/nginxplus-access
      - filelog/nginxplus-error
    processors:
      - resource
      - filter/info_and_above
      - batch
    exporters:
      - loadbalancing

  metrics:
    receivers:
      # Required to receive Beyla RED metrics over OTLP/HTTP.
      - otlp
      - nginx
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
