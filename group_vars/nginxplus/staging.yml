---
adc_domain: "adc-dev.lib.princeton.edu"
nginx_http_upload_src: conf/http/dev/*.conf
nginx_template_upload_src: conf/http/dev/templates/*.conf

# Modules to install
nginx_modules:
  waf: false
  geoip: true
  njs: true
  perl: true
  image_filter: true
  rtmp: true
  otel: true
  xslt: true

# dos: true

# App Protect logs
app_protect_dir: "/var/log/app_protect/*.log"

sites: []

# Grafana Beyla
#
beyla_enabled: true
beyla_service_name: nginxplus-lb
beyla_environment: staging

beyla_otlp_endpoint: http://127.0.0.1:4318
beyla_otlp_protocol: http/protobuf

beyla_open_ports:
  - 80
  - 443

# Propagate W3C trace context through normal HTTP headers without enabling
# Beyla's IP-option/TC propagation mechanism.
beyla_bpf_context_propagation: headers

# Beyla requires elevated eBPF and process-inspection privileges.
beyla_privileged: true

# SigNoz / OpenTelemetry Collector for NGINX Plus load balancers
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: nginxplus-lb
  service.version: staging
  environment: staging
  deployment.environment: staging

otel_receivers:
  # Receives:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  nginx:
    endpoint: http://127.0.0.1:18080/nginx_status
    collection_interval: 30s

  filelog/nginxplus-access:
    include:
      - /var/log/nginx/access.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_nginxplus_access_json
        parse_from: body

      - type: time_parser
        parse_from: attributes.timestamp
        layout_type: gotime
        layout: "2006-01-02T15:04:05Z07:00"
        on_error: send

      - type: severity_parser
        parse_from: attributes.status
        mapping:
          info:
            - '^2\d\d$'
            - '^3\d\d$'
          warn:
            - '^4\d\d$'
          error:
            - '^5\d\d$'
        on_error: send

      - type: copy
        from: attributes.trace_id
        to: attributes.otel_trace_id
        if: 'attributes.trace_id != nil and attributes.trace_id != ""'

      - type: copy
        from: attributes.span_id
        to: attributes.otel_span_id
        if: 'attributes.span_id != nil and attributes.span_id != ""'

      - type: add
        field: attributes.log_type
        value: nginxplus_access

      - type: add
        field: attributes.service_name
        value: nginxplus-lb

  filelog/nginxplus-error:
    include:
      - /var/log/nginx/error.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: regex_parser
        id: parse_nginxplus_error
        regex: '^(?P<time_local>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?:\*(?P<connection>\d+) )?(?P<message>[\s\S]*)$'
        parse_from: body
        on_error: send

      - type: time_parser
        parse_from: attributes.time_local
        layout_type: strptime
        layout: "%Y/%m/%d %H:%M:%S"
        on_error: send

      - type: severity_parser
        parse_from: attributes.level
        on_error: send

      - type: add
        field: attributes.log_type
        value: nginxplus_error

      - type: add
        field: attributes.service_name
        value: nginxplus-lb

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  filter/info_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_INFO

  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/nginxplus-access
      - filelog/nginxplus-error
    processors:
      - resource
      - filter/info_and_above
      - batch
    exporters:
      - loadbalancing

  metrics:
    receivers:
      # Required for Beyla RED metrics.
      - otlp
      - nginx
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
