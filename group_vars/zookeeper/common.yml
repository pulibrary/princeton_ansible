---
# Additional host firewall rules for ZooKeeper servers.
#
# The LibNetPvt allow-all rule that used to live here is now applied to every
# host through firewall_trusted_cidrs in roles/firewall/defaults/main.yml.
firewall_additional_rules:
  - port: 21047
    protocol: tcp
    source: 10.6.48.214
    comment: Rapid7 Scan Assistant

# Catch a broken Collector configuration before restarting it, so a typo in the
# log parsing rules cannot take log shipping down.
otel_validate_config: true
otel_validate_cmd: >-
  {{ otel_binary_path }} validate
  --config {{ otel_config_path }}
