---
# List of ZooKeeper nodes
zk_nodes:
  - host: "lib-zk4.princeton.edu"
    id: 1
  - host: "lib-zk5.princeton.edu"
    id: 2
  - host: "lib-zk6.princeton.edu"
    id: 3
datadog_api_key: "{{ vault_datadog_key }}"
datadog_config:
  tags: "zookeeper, environment:production, role:zookeeper"
  apm_enabled: "false"
  log_enabled: true
  process_config:
    enabled: "false"
datadog_checks:
  zk:
    init_config:
    instances:
      - host: localhost
        port: 2181
    logs:
      # logback's JsonEncoder emits one JSON object per event, stack traces
      # included, so no multi_line rule is needed.
      - type: file
        path: "/var/log/zookeeper/zookeeper.json"
        source: zookeeper
        service: zookeeper

# signoz
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: zookeeper
  service.version: production
  environment: production
  deployment.environment: production

otel_receivers:
  filelog/zookeeper-json:
    include:
      - "/var/log/zookeeper/zookeeper.json"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # ZooKeeper 3.8+ logs through logback, whose JsonEncoder writes a complete
      # JSON object per event, stack traces included, so each line stands alone.
      - type: json_parser
        id: parse_zookeeper_json
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: epoch
          layout: ms
        severity:
          parse_from: attributes.level
          mapping:
            trace: TRACE
            debug: DEBUG
            info: INFO
            warn: WARN
            error: ERROR
        on_error: send

      # myid rides along in the logback MDC and is the quickest way to tell the
      # three ensemble members apart.
      - type: move
        id: move_zookeeper_myid
        if: 'attributes.mdc != nil and attributes.mdc.myid != nil'
        from: attributes.mdc.myid
        to: attributes.zookeeper_myid
        on_error: send

      - type: remove
        id: remove_zookeeper_mdc
        if: 'attributes.mdc != nil'
        field: attributes.mdc
        on_error: send

      - type: move
        id: move_zookeeper_message_to_body
        from: attributes.message
        to: body
        on_error: send

      # Encoder bookkeeping that adds no value once the record is in SigNoz.
      - type: remove
        id: remove_zookeeper_context
        field: attributes.context
        on_error: send

      - type: remove
        id: remove_zookeeper_sequence_number
        field: attributes.sequenceNumber
        on_error: send

      - type: remove
        id: remove_zookeeper_nanoseconds
        field: attributes.nanoseconds
        on_error: send

      # Now that these drive the record timestamp and severity, the raw copies
      # would just be duplicate columns in SigNoz.
      - type: remove
        id: remove_zookeeper_raw_timestamp
        field: attributes.timestamp
        on_error: send

      - type: remove
        id: remove_zookeeper_raw_level
        field: attributes.level
        on_error: send

      - type: add
        id: add_zookeeper_log_type
        field: attributes.log_type
        value: zookeeper_json

      - type: add
        id: add_zookeeper_service_name
        field: attributes.service_name
        value: zookeeper

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  filter/info_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_INFO

  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-prod1.lib.princeton.edu:32317
          - k8s-prod2.lib.princeton.edu:32317
          - k8s-prod3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/zookeeper-json
    processors:
      - resource
      - filter/info_and_above
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug
