---
# Map each Entra-backed SSH certificate principal to a separate, unprivileged
# local Unix account on the BitCurator sandbox.
ssh_ca_allowed_users:
  - pulsys
  - alice
  - bob

ssh_ca_users:
  - name: alice
    principals:
      - alice@princeton.edu
    create_local_user: true
    groups: []
  - name: bob
    principals:
      - bob@princeton.edu
    create_local_user: true
    groups: []
