pul_nomad_role: "client"

# Figgy's network shares, exposed to its jobs as the figgy-repository and
# figgy-mnt host volumes.
figgy_mounts_dir: /container_mounts/figgy
figgy_fallback_dir:
  staging: figgy_staging
  production: figgy_production
figgy_fallback_stream_dir:
  staging: figgy_staging_stream_derivatives
  production: figgy_stream_derivatives
nomad_shared_host_volumes:
  - name: figgy-repository
    path: "{{ figgy_mounts_dir }}/repository"
    read_only: false
  - name: figgy-mnt
    path: "{{ figgy_mounts_dir }}/mnt"
    read_only: false
nomad_client_mounts:
  - path: "{{ figgy_mounts_dir }}/repository/files"
    src: "tigerdata-nfs.princeton.edu:/figgy/{{ nomad_node_pool }}/files"
    fstype: nfs
    opts: 'nfsvers=3,mountport=2049,port=2049,nolock,proto=tcp'
  - path: "{{ figgy_mounts_dir }}/repository/derivatives"
    src: "tigerdata-nfs.princeton.edu:/figgy/{{ nomad_node_pool }}/derivatives"
    fstype: nfs
    opts: 'nfsvers=3,mountport=2049,port=2049,nolock,proto=tcp'
  - path: "{{ figgy_mounts_dir }}/repository/stream_derivatives"
    src: "tigerdata-nfs.princeton.edu:/figgy/{{ nomad_node_pool }}/stream_derivatives"
    fstype: nfs
    opts: 'nfsvers=3,mountport=2049,port=2049,nolock,proto=tcp'
  - path: "{{ figgy_mounts_dir }}/mnt/hydra_sources/archives"
    src: "tigerdata-nfs.princeton.edu:/pul/archives"
    fstype: nfs
    opts: 'nfsvers=3,mountport=2049,port=2049,nolock,proto=tcp'
  - path: "{{ figgy_mounts_dir }}/mnt/hydra_sources/archives_bd"
    src: "tigerdata-nfs.princeton.edu:/pul/archives_bd"
    fstype: nfs
    opts: 'nfsvers=3,mountport=2049,port=2049,nolock,proto=tcp'
  - path: "{{ figgy_mounts_dir }}/mnt/hydra_sources/bitcur-archives"
    src: "tigerdata-nfs.princeton.edu:/pul/bitcur-archives"
    fstype: nfs
    opts: 'nfsvers=3,mountport=2049,port=2049,nolock,proto=tcp'
  - path: "{{ figgy_mounts_dir }}/repository/fallback_files"
    src: "//diglibdata1.princeton.edu/hydra/binaries/{{ figgy_fallback_dir[nomad_node_pool] }}"
    fstype: cifs
    opts: 'uid=1001,gid=33'
    credentials: "{{ playbook_dir }}/../roles/figgy/files/plum_mount.smb.credentials"
  - path: "{{ figgy_mounts_dir }}/repository/fallback_stream_derivatives"
    src: "//diglibdata1.princeton.edu/hydra/binaries/{{ figgy_fallback_stream_dir[nomad_node_pool] }}"
    fstype: cifs
    opts: 'uid=1001,gid=33'
    credentials: "{{ playbook_dir }}/../roles/figgy/files/plum_mount.smb.credentials"
  - path: "{{ figgy_mounts_dir }}/mnt/diglibdata/hydra_binaries"
    src: "//diglibdata1.princeton.edu/hydra/binaries"
    fstype: cifs
    opts: 'uid=1001,gid=33'
    credentials: "{{ playbook_dir }}/../roles/figgy/files/plum_mount.smb.credentials"
  - path: "{{ figgy_mounts_dir }}/mnt/diglibdata/pudl"
