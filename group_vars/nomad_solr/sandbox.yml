---
# The solr image runs as uid 8983, and Docker on the clients uses
# userns-remap, so the volume has to be owned by the remapped uid.
nomad_solr_container_uid: 8983
nomad_volumes:
  - name: 'solr-sandbox'
    count: 3
    node_pool: 'sandbox'
    uid: "{{ nomad_docker_userns_offset + nomad_solr_container_uid }}"
    gid: "{{ nomad_docker_userns_offset + nomad_solr_container_uid }}"
