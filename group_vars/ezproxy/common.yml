---
ezproxy_admin_password: "{{ vault_ezproxy_admin_password }}"
shib_admin_user:
  - jm110@princeton.edu
  - kr2@princeton.edu
  - sc9047@princeton.edu
  - vk4273@princeton.edu
# ezproxy logrotate
ezproxy_directory: "/var/local/ezproxy/log"

ezproxy_log_retention_days: 7

# Rotation of the security trip log is defined in the role's defaults, next to
# the path it rotates, so the two cannot drift apart.

# Catch a broken Collector configuration before restarting it, so a typo in the
# log parsing rules cannot take log shipping down.
otel_validate_config: true
otel_validate_cmd: >-
  {{ otel_binary_path }} validate
  --config {{ otel_config_path }}
