---
install_ruby_from_source: true

# these can go to common when we merge testing
desired_ruby_version: "3.4.4"
ruby_version_override: "ruby-3.4.4"

domain_name: "ezproxy-test"
domain_place_name: "ezproxy-test"
generic_app_user: ezproxy
oclc_wskey: "{{ vault_oclc_wskey }}"
ezproxy_public_host: ezproxy-test.princeton.edu

# The below value corresponds to the application's numbering convention of the SSL certificate that is
# being passed to the campus IDP for Shibbleth/SAML integration.
# See pul-it-handbook: https://github.com/pulibrary/pul-it-handbook/blob/main/services/ezproxy.md
cert_value: "3"

sudo_options: "ALL=(ALL) NOPASSWD: /usr/sbin/service ezproxy *"

microsoft_entra_idp_uuid: "{{ vault_microsoft_entra_testing_idp_uuid }}"
microsoft_entra_app_uuid: "{{ vault_microsoft_entra_testing_app_uuid }}"

# SigNoz / OpenTelemetry collector for EZproxy
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: ezproxy
  service.version: staging
  environment: staging
  deployment.environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # EZproxy HTTP access logs.
  #
  # EZproxy is configured to write these as JSON, one object per request, so
  # the fields are read by name instead of being pulled out with a regex. See
  # the LogFormat directive in roles/ezproxy/templates/config.txt.j2.
  filelog/ezproxy_access:
    include:
      - /var/local/ezproxy/log/ezp*.json
    exclude:
      - /var/local/ezproxy/log/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # EZproxy does not escape quotes in the values it logs, so a request with
      # a quote in its user agent or URL still produces a line that is not
      # valid JSON. on_error: send keeps those lines, with their raw text as
      # the body, rather than dropping them.
      - type: json_parser
        id: parse_ezproxy_access
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%S%z'
        on_error: send

      # Give the record a severity so failed requests can be found in SigNoz
      # without knowing EZproxy's status codes. Anything at or above 400
      # includes EZproxy's own 5xx/9xx codes for rejected and intruder traffic.
      - type: severity_parser
        id: parse_ezproxy_access_severity
        if: 'attributes.http_status != nil'
        parse_from: attributes.http_status
        overwrite_text: true
        mapping:
          error:
            - min: 500
              max: 999
          warn:
            - min: 400
              max: 499
          info:
            - min: 100
              max: 399
        on_error: send

      # The parsed fields are the useful part, so the body becomes a short
      # summary instead of a second copy of the whole JSON object.
      - type: add
        id: set_ezproxy_access_body
        if: 'attributes.url != nil'
        field: body
        value: 'EXPR(attributes.http_method + " " + attributes.url)'

      - type: remove
        id: remove_ezproxy_access_timestamp
        if: 'attributes.timestamp != nil'
        field: attributes.timestamp

      - type: add
        field: attributes.log_type
        value: ezproxy_access

      - type: add
        field: attributes.service_name
        value: ezproxy_access

  # EZproxy starting point URL logs, also written as JSON. These record which
  # resource a session set out to reach, so they answer "what did people use"
  # rather than "what did their browser fetch".
  filelog/ezproxy_spu:
    include:
      - /var/local/ezproxy/log/spu*.json
    exclude:
      - /var/local/ezproxy/log/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_ezproxy_spu
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%S%z'
        on_error: send

      - type: severity_parser
        id: parse_ezproxy_spu_severity
        if: 'attributes.http_status != nil'
        parse_from: attributes.http_status
        overwrite_text: true
        mapping:
          error:
            - min: 500
              max: 999
          warn:
            - min: 400
              max: 499
          info:
            - min: 100
              max: 399
        on_error: send

      # The parsed fields are the useful part, so the body becomes a short
      # summary instead of a second copy of the whole JSON object.
      - type: add
        id: set_ezproxy_spu_body
        if: 'attributes.url != nil'
        field: body
        value: 'EXPR(attributes.http_method + " " + attributes.url)'

      - type: remove
        id: remove_ezproxy_spu_timestamp
        if: 'attributes.timestamp != nil'
        field: attributes.timestamp

      - type: add
        field: attributes.log_type
        value: ezproxy_spu

      - type: add
        field: attributes.service_name
        value: ezproxy_spu

  # EZproxy audit logs.
  #
  # These stay plain text: EZproxy has no directive to change the audit log
  # format, so unlike the access and SPU logs they still have to be matched
  # with a regex.
  #
  # Examples:
  #
  # 2026-08-18 23:45:10 Login.Success 74.104.115.202 user@princeton.edu SESSION |Shibboleth|
  # 2026-08-18 23:47:51 Logout user@princeton.edu SESSION Expired
  # 2026-08-18 23:51:02 Info.usr 119.249.100.47 Access Denied Unauthorized Country
  #
  filelog/ezproxy_audit:
    include:
      - /var/local/ezproxy/audit/*.txt
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: regex_parser
        id: parse_ezproxy_audit
        parse_from: body
        regex: '^(?P<time_local>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+(?P<audit_event>\S+)\s+(?:(?P<client_ip>(?:\d{1,3}\.){3}\d{1,3}|[0-9A-Fa-f:]+)\s+)?(?:(?P<authenticated_user>\S+@\S+)\s+)?(?:(?P<session_id>[A-Za-z0-9]{20,})\s+)?(?P<audit_detail>.*)$'
        on_error: send

      - type: time_parser
        id: parse_ezproxy_audit_time
        parse_from: attributes.time_local
        layout_type: strptime
        layout: '%Y-%m-%d %H:%M:%S'
        on_error: send

      - type: add
        field: attributes.log_type
        value: ezproxy_audit

      - type: add
        field: attributes.service_name
        value: ezproxy_audit

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/ezproxy_access
      - filelog/ezproxy_spu
      - filelog/ezproxy_audit
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug
