---
install_ruby_from_source: true

# these can go to common when we merge testing
desired_ruby_version: "3.4.4"
ruby_version_override: "ruby-3.4.4"

domain_name: "ezproxy-test"
domain_place_name: "ezproxy-test"
generic_app_user: ezproxy
oclc_wskey: "{{ vault_oclc_wskey }}"
ezproxy_public_host: ezproxy-test.princeton.edu

# The below value corresponds to the application's numbering convention of the SSL certificate that is
# being passed to the campus IDP for Shibbleth/SAML integration.
# See pul-it-handbook: https://github.com/pulibrary/pul-it-handbook/blob/main/services/ezproxy.md
cert_value: "3"

sudo_options: "ALL=(ALL) NOPASSWD: /usr/sbin/service ezproxy *"

microsoft_entra_idp_uuid: "{{ vault_microsoft_entra_testing_idp_uuid }}"
microsoft_entra_app_uuid: "{{ vault_microsoft_entra_testing_app_uuid }}"

# SigNoz / OpenTelemetry collector for EZproxy
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: ezproxy
  service.version: staging
  environment: staging
  deployment.environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # EZproxy HTTP access logs.
  #
  # EZproxy is configured to write these as JSON, one object per request, so
  # the fields are read by name instead of being pulled out with a regex. See
  # the LogFormat directive in roles/ezproxy/templates/config.txt.j2.
  filelog/ezproxy_access:
    include:
      - /var/local/ezproxy/log/ezp*.json
    exclude:
      - /var/local/ezproxy/log/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # EZproxy does not escape quotes in the values it logs, so a request with
      # a quote in its user agent or URL still produces a line that is not
      # valid JSON. on_error: send keeps those lines, with their raw text as
      # the body, rather than dropping them.
      - type: json_parser
        id: parse_ezproxy_access
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%S%z'
        on_error: send

      # Give the record a severity so failed requests can be found in SigNoz
      # without knowing EZproxy's status codes. Anything at or above 400
      # includes EZproxy's own 5xx/9xx codes for rejected and intruder traffic.
      - type: severity_parser
        id: parse_ezproxy_access_severity
        if: 'attributes.http_status != nil'
        parse_from: attributes.http_status
        overwrite_text: true
        mapping:
          error:
            - min: 500
              max: 999
          warn:
            - min: 400
              max: 499
          info:
            - min: 100
              max: 399
        on_error: send

      # The parsed fields are the useful part, so the body becomes a short
      # summary instead of a second copy of the whole JSON object.
      - type: add
        id: set_ezproxy_access_body
        if: 'attributes.url != nil'
        field: body
        value: 'EXPR(attributes.http_method + " " + attributes.url)'

      - type: remove
        id: remove_ezproxy_access_timestamp
        if: 'attributes.timestamp != nil'
        field: attributes.timestamp

      - type: add
        field: attributes.log_type
        value: ezproxy_access

      - type: add
        field: attributes.service_name
        value: ezproxy_access

  # EZproxy starting point URL logs, also written as JSON. These record which
  # resource a session set out to reach, so they answer "what did people use"
  # rather than "what did their browser fetch".
  filelog/ezproxy_spu:
    include:
      - /var/local/ezproxy/log/spu*.json
    exclude:
      - /var/local/ezproxy/log/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_ezproxy_spu
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%S%z'
        on_error: send

      - type: severity_parser
        id: parse_ezproxy_spu_severity
        if: 'attributes.http_status != nil'
        parse_from: attributes.http_status
        overwrite_text: true
        mapping:
          error:
            - min: 500
              max: 999
          warn:
            - min: 400
              max: 499
          info:
            - min: 100
              max: 399
        on_error: send

      # The parsed fields are the useful part, so the body becomes a short
      # summary instead of a second copy of the whole JSON object.
      - type: add
        id: set_ezproxy_spu_body
        if: 'attributes.url != nil'
        field: body
        value: 'EXPR(attributes.http_method + " " + attributes.url)'

      - type: remove
        id: remove_ezproxy_spu_timestamp
        if: 'attributes.timestamp != nil'
        field: attributes.timestamp

      - type: add
        field: attributes.log_type
        value: ezproxy_spu

      - type: add
        field: attributes.service_name
        value: ezproxy_spu

  # EZproxy audit logs.
  #
  # EZproxy has no directive to change the audit log format, so unlike the
  # access and SPU logs these cannot be written as JSON at the source. They are
  # a tab separated table with a header row instead, which is still structured,
  # so they are split on tabs rather than picked apart with a regex.
  #
  # The header row names the columns, and every line has all six even when a
  # value is empty:
  #
  #   Date/Time  Event  IP  Username  Session  Other
  #
  # Examples, with tabs shown as ->:
  #
  #   2026-09-04 00:01:10->Login.Success->124.33.99.130->u@princeton.edu->SESSION->|Shibboleth|
  #   2026-09-04 00:01:08->Logout->->u@princeton.edu->SESSION->Expired
  #   2026-09-04 00:01:33->Info.usr->111.225.214.206->->->Access Denied Unauthorized Country
  filelog/ezproxy_audit:
    include:
      - /var/local/ezproxy/audit/*.txt
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # Each daily file repeats the column header, which is not a log entry.
      - type: filter
        id: drop_ezproxy_audit_header
        expr: 'body matches "^Date/Time	"'

      # ignore_quotes keeps a stray double quote in a value from swallowing the
      # rest of the line, since these columns are not quoted at all.
      - type: csv_parser
        id: parse_ezproxy_audit
        parse_from: body
        header: 'timestamp,audit_event,client_ip,authenticated_user,session_id,audit_detail'
        header_delimiter: ","
        delimiter: "	"
        ignore_quotes: true
        # Audit timestamps carry no UTC offset, so they are read in the host's
        # local time. The Collector reads these files from disk on the same host
        # that wrote them, so that is the same clock either way.
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: '%Y-%m-%d %H:%M:%S'
        on_error: send

      # Give each event a severity so denied logins, lockouts and limit hits can
      # be found in SigNoz without knowing EZproxy's event names. Failed logins
      # and intruder lockouts are errors; blocked countries, usage limits and
      # session address or country changes are warnings worth a look.
      - type: severity_parser
        id: parse_ezproxy_audit_severity
        parse_from: attributes.audit_event
        overwrite_text: true
        mapping:
          error:
            - Login.Denied
            - Login.Failure
            - Login.Failure.Password
            - Login.Intruder.IP
            - Login.Intruder.User
          warn:
            - Info.usr
            - UsageLimit
            - BlockCountryChange
            - Session.IPChange
            - Session.ReconnectBlocked
          info:
            - Login.Success
            - Login.Success.Password
            - Login.Success.Groups
            - Login.Success.Relogin
            - Logout
            - System
        on_error: send

      # Not every event fills every column: a logout has no address, and a
      # blocked request has no user or session. Drop the blanks so they do not
      # show up as empty fields.
      - type: remove
        id: remove_ezproxy_audit_empty_client_ip
        if: 'attributes.client_ip == ""'
        field: attributes.client_ip

      - type: remove
        id: remove_ezproxy_audit_empty_user
        if: 'attributes.authenticated_user == ""'
        field: attributes.authenticated_user

      - type: remove
        id: remove_ezproxy_audit_empty_session
        if: 'attributes.session_id == ""'
        field: attributes.session_id

      # The columns are the useful part, so the body becomes a short summary
      # instead of a second copy of the whole line.
      - type: add
        id: set_ezproxy_audit_body
        field: body
        value: 'EXPR(attributes.audit_event + " " + attributes.audit_detail)'

      - type: remove
        id: remove_ezproxy_audit_timestamp
        field: attributes.timestamp

      - type: add
        field: attributes.log_type
        value: ezproxy_audit

      - type: add
        field: attributes.service_name
        value: ezproxy_audit

  # Tripped EZproxy security rules.
  #
  # EZproxy stores these in a SQLite database and only shows them on its admin
  # page. A cron script (see roles/ezproxy) copies each new trip here as JSON so
  # they arrive in SigNoz, where an alert can fire on them. The rule that was
  # tripped, who tripped it, the limit and the observed value all come through
  # as fields.
  filelog/ezproxy_security:
    include:
      - /var/local/ezproxy/log/security_trips.json
    exclude:
      - /var/local/ezproxy/log/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_ezproxy_security_trip
        parse_from: body
        timestamp:
          parse_from: attributes.triggered_at
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%SZ'
        on_error: send

      # EZproxy security rules either block the account or just record the
      # breach, so a block is an error and a log entry is a warning. Anything
      # else is passed through unclassified rather than dropped.
      - type: severity_parser
        id: parse_ezproxy_security_severity
        parse_from: attributes.action
        overwrite_text: true
        mapping:
          error:
            - block
          warn:
            - log
        on_error: send

      - type: add
        id: set_ezproxy_security_body
        field: body
        value: 'EXPR(attributes.rule_name + " " + attributes.action + " " + attributes.username)'

      - type: remove
        id: remove_ezproxy_security_triggered_at
        if: 'attributes.triggered_at != nil'
        field: attributes.triggered_at

      - type: add
        field: attributes.log_type
        value: ezproxy_security_trip

      - type: add
        field: attributes.service_name
        value: ezproxy_security

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/ezproxy_access
      - filelog/ezproxy_spu
      - filelog/ezproxy_audit
      - filelog/ezproxy_security
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug
