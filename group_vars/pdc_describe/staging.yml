postgres_version: 15
passenger_server_name: "{{ inventory_hostname }}"
passenger_app_env: "staging"
passenger_extra_config: "client_max_body_size 0;"

pdc_describe_db_name: 'pdc_describe_staging'

pdc_describe_db_user: '{{vault_pdc_describe_staging_db_user}}'
pdc_describe_db_password: '{{vault_pdc_describe_staging_db_password}}'

rails_app_env: "staging"

pdc_describe_host_name: 'pdc-describe-staging.princeton.edu'
pdc_describe_honeybadger_key: '{{vault_pdc_describe_honeybadger_key}}'

pdc_describe_staging_aws_pre_curate_bucket: 'pdc-describe-staging-precuration'
pdc_describe_staging_aws_post_curate_bucket: 'pdc-describe-staging-postcuration'
pdc_describe_staging_aws_preservation_bucket: 'pdc-describe-staging-preservation'
pdc_describe_production_aws_dspace_bucket: 'prds-dataspace'
pdc_describe_staging_aws_embargo_bucket: 'pdc-describe-staging-embargo'

install_mailcatcher: true

app_pdc_describe__secret_key: '{{ vault_pdc_describe_staging_secret_key }}'
app_pdc_describe_datacite_user: '{{ vault_pdc_describe_staging_datacite_user }}'
app_pdc_describe_datacite_password: '{{ vault_pdc_describe_staging_datacite_password }}'
app_datacite_host: 'api.test.datacite.org'
app_datacite_prefix: '10.80021'
app_pdc_describe_aws_pre_curate_bucket: '{{ pdc_describe_staging_aws_pre_curate_bucket }}'
app_pdc_describe_aws_post_curate_bucket: '{{ pdc_describe_staging_aws_post_curate_bucket }}'
app_pdc_describe_aws_preservation_bucket: '{{ pdc_describe_staging_aws_preservation_bucket }}'
app_pdc_describe_aws_dspace_bucket: '{{ pdc_describe_production_aws_dspace_bucket }}'
app_pdc_describe_aws_embargo_bucket: '{{ pdc_describe_staging_aws_embargo_bucket }}'
app_pdc_describe_ezid_user: 'apitest'
app_pdc_describe_ezid_password: 'apitest'
app_pdc_describe_ezid_shoulder: 'ark:/99999/fk4'
app_pdc_redis_host: 'pdc-describe-redis-staging1.lib.princeton.edu'

entra_client_id: "{{ vault_entra_client_id_staging }}"
entra_client_secret: "{{ vault_entra_client_secret_staging }}"
entra_tenant_id: "{{ vault_entra_tenant_id }}"

# signoz
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: pdc-describe
  service.version: staging
  environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  filelog/nginx-access:
    include: ["/var/log/nginx/access.log"]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<remote_addr>[^\s]+) \((?P<remote_user>[^)]*)\) - - \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
        parse_from: body
      - type: time_parser
        parse_from: attributes.time_local
        layout_type: strptime
        layout: '%d/%b/%Y:%H:%M:%S %z'
      - type: add
        field: attributes.log_type
        value: "nginx-access"
      - type: add
        field: attributes.service_name
        value: "{{ rails_app_name }}"

  filelog/nginx-error:
    include: ["/var/log/nginx/error.log"]
    start_at: end
    operators:
      - type: add
        field: attributes.log_type
        value: "nginx-error"
      - type: add
        field: attributes.service_name
        value: "{{ rails_app_name }}"

  filelog/rails-logs:
    include: ["/opt/{{ rails_app_directory }}/shared/log/*.json"]
    start_at: end
    operators:
      # Rails writes one SemanticLogger JSON object per line (including the
      # Sidekiq worker); parse it so level, timestamp and job fields are queryable.
      - type: json_parser
        parse_from: body
        parse_to: attributes
        on_error: send_quiet
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
        severity:
          parse_from: attributes.level
      - type: move
        if: 'attributes.message != nil'
        from: attributes.message
        to: body
      - type: add
        field: attributes.log_type
        value: "app-log"
      - type: add
        field: attributes.service_name
        value: "{{ rails_app_name }}"
      - type: add
        field: attributes.rails_env
        value: "{{ rails_app_env }}"

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

  # Flatten the parsed Rails JSON (exception.name, named_tags.class, ...) so
  # SigNoz can filter on it. The stack trace is set aside first so each frame
  # does not become its own attribute key.
  transform/rails-json:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - attributes["log_type"] == "app-log"
        statements:
          - set(cache["stack_trace"], attributes["exception"]["stack_trace"]) where attributes["exception"] != nil
          - delete_key(attributes["exception"], "stack_trace") where attributes["exception"] != nil
          - delete_key(attributes["exception"]["cause"], "stack_trace") where attributes["exception"]["cause"] != nil
          - flatten(attributes)
          - set(attributes["exception.stack_trace"], cache["stack_trace"]) where cache["stack_trace"] != nil

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/nginx-access
      - filelog/nginx-error
      - filelog/rails-logs
    processors:
      - resource
      - transform/rails-json
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
