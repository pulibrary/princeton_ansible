---
# Agent role
# what is 'agent_prep_legacy' for?
# we only set it in production
# checkmk_agent_prep_legacy: 'false'
checkmk_agent_server: "pulmonitor-prod1.lib.princeton.edu"
checkmk_agent_site: production
checkmk_agent_secret: "{{ vault_automation_secret_production }}"
checkmk_agent_automation_role: automation
checkmk_agent_labels: []  # Empty list for labels
checkmk_agent_attributes: {}  # Empty dict for attributes
checkmk_agent_services: true  # Let CheckMK discover services
checkmk_agent_protocol: http
checkmk_agent_host_specific: false
checkmk_agent_folder_specific: false
checkmk_agent_server_protocol: http

# checkmk_folders:
#   - path: /linux/sandboxes
#     title: Sandboxes

checkmk_observability_hosts:
  pulmonitor-prod1.lib.princeton.edu:
    site_name: production
    environment: production
    otlp_backends:
      - "k8s-prod1.lib.princeton.edu:32317"
      - "k8s-prod2.lib.princeton.edu:32317"
      - "k8s-prod3.lib.princeton.edu:32317"

  pulmonitor-prod2.lib.princeton.edu:
    site_name: staging
    environment: staging
    otlp_backends:
      - "k8s-staging1.lib.princeton.edu:32317"
      - "k8s-staging2.lib.princeton.edu:32317"
      - "k8s-staging3.lib.princeton.edu:32317"

checkmk_site_name: >-
  {{
    checkmk_observability_hosts[inventory_hostname]['site_name']
  }}

checkmk_environment: >-
  {{
    checkmk_observability_hosts[inventory_hostname]['environment']
  }}

otel_signoz_backends: >-
  {{
    checkmk_observability_hosts[inventory_hostname]['otlp_backends']
  }}

otel_service_name: otelcol-contrib
otel_service_user: root
otel_service_group: root

otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: checkmk
  service.namespace: pul-library
  service.version: "{{ checkmk_version | default('2.5.0p9') }}"
  deployment.environment: "{{ checkmk_environment }}"
  environment: "{{ checkmk_environment }}"
  checkmk.site.name: "{{ checkmk_site_name }}"
  checkmk.site.role: >-
    {{
      'central'
      if checkmk_site_name == 'production'
      else 'remote'
    }}

otel_receivers:
  otlp/beyla:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

      http:
        endpoint: 127.0.0.1:4318

  # Checkmk logs which use Python-style numeric severity levels.
  #
  # Observed examples:
  #   [15] debug-ish / verbose
  #   [20] info
  #   [40] error
  #
  # Only WARN (30) and above will reach SigNoz because this receiver
  # passes through filter/warn_and_above in the logs pipeline.
  filelog/checkmk:
    include:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/*.log"

    exclude:
      # CMC uses a different numeric logging/verbosity scale and is
      # handled by its own receiver and pipeline below.
      - "/omd/sites/{{ checkmk_site_name }}/var/log/cmc.log"

      # Ignore rotated logs.
      - "/omd/sites/{{ checkmk_site_name }}/var/log/*.gz"
      - "/omd/sites/{{ checkmk_site_name }}/var/log/*.[0-9]"

    start_at: end
    include_file_name: true
    include_file_path: true

    operators:
      - type: regex_parser
        regex: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:,\d{3})? \[(?P<severity>[0-9]+)\]'
        severity:
          parse_from: attributes.severity
          preset: none
          mapping:
            debug:
              - 10
              - 15
            info: 20
            warn: 30
            error: 40
            fatal: 50
          overwrite_text: true

      - type: add
        field: attributes["log.source"]
        value: checkmk

      - type: add
        field: attributes["checkmk.site.name"]
        value: "{{ checkmk_site_name }}"

  # CMC does not use the same numeric severity scale as the other
  # Checkmk logs. For example, observed "[4]" records can contain
  # actual errors. Keep CMC logs unfiltered rather than risk dropping
  # operationally useful errors.
  # https://docs.checkmk.com/latest/en/notifications.html
  filelog/checkmk-cmc:
    include:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/cmc.log"

    exclude:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/cmc.log.*"

    start_at: end
    include_file_name: true
    include_file_path: true

    operators:
      - type: add
        field: attributes["log.source"]
        value: checkmk-cmc

      - type: add
        field: attributes["checkmk.site.name"]
        value: "{{ checkmk_site_name }}"

  # Apache error log only.
  #
  # access_log is intentionally not collected because HTTP access
  # records do not have WARN/ERROR severity semantics.
  filelog/checkmk-apache-error:
    include:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/apache/error_log"

    exclude:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/apache/*.gz"
      - "/omd/sites/{{ checkmk_site_name }}/var/log/apache/*.[0-9]"

    start_at: end
    include_file_name: true
    include_file_path: true

    operators:
      - type: regex_parser
        regex: '^\[[^\]]+\] \[[^:\]]+:(?P<severity>[^\]]+)\]'
        severity:
          parse_from: attributes.severity
          preset: none
          mapping:
            debug:
              - debug
              - trace1
              - trace2
              - trace3
              - trace4
              - trace5
              - trace6
              - trace7
              - trace8
            info:
              - info
              - notice
            warn: warn
            error: error
            fatal:
              - crit
              - alert
              - emerg
          overwrite_text: true

      - type: add
        field: attributes["log.source"]
        value: checkmk-apache

      - type: add
        field: attributes["checkmk.site.name"]
        value: "{{ checkmk_site_name }}"

  # System logs at warning severity and above.
  #
  # This replaces direct file tailing of:
  #   /var/log/syslog
  #   /var/log/auth.log
  #
  # journald performs the priority filtering before sending records
  # into the Collector pipeline.
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/journaldreceiver/README.md
  journald/system:
    start_at: end
    priority: warning

    operators:
      - type: add
        field: attributes["log.source"]
        value: system

  hostmetrics:
    collection_interval: 30s

    scrapers:
      cpu: {}

      load: {}

      memory: {}

      disk: {}

      filesystem:
        exclude_fs_types:
          match_type: strict
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - sysfs
            - tmpfs
            - tracefs

      network: {}

      paging: {}

      processes: {}

otel_processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Drop any parsed log record below WARN.
  #
  # This applies to the normal Checkmk logs, Apache error logs,
  # and journald/system. CMC logs intentionally use a separate
  # pipeline without this processor.
  filter/warn_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_WARN

  batch:
    timeout: 10s
    send_batch_size: 8192
    send_batch_max_size: 16384

otel_exporters:
  loadbalancing:
    routing_key: service

    protocol:
      otlp:
        timeout: 10s

        tls:
          insecure: true

        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000

        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    resolver:
      static:
        hostnames: "{{ otel_signoz_backends }}"

otel_extensions: {}

otel_service_pipelines:
  # WARN and above only.
  logs:
    receivers:
      - filelog/checkmk
      - filelog/checkmk-apache-error
      - journald/system

    processors:
      - memory_limiter
      - resource
      - filter/warn_and_above
      - batch

    exporters:
      - loadbalancing

  # CMC uses a different logging level scheme, so do not apply
  # the generic WARN severity filter.
  logs/cmc:
    receivers:
      - filelog/checkmk-cmc

    processors:
      - memory_limiter
      - resource
      - batch

    exporters:
      - loadbalancing

  metrics:
    receivers:
      - hostmetrics
      - otlp/beyla

    processors:
      - memory_limiter
      - resource
      - batch

    exporters:
      - loadbalancing

  traces:
    receivers:
      - otlp/beyla

    processors:
      - memory_limiter
      - resource
      - batch

    exporters:
      - loadbalancing

beyla_enabled: true
beyla_service_name: checkmk
beyla_environment: "{{ checkmk_environment }}"
beyla_otlp_endpoint: http://127.0.0.1:4318
beyla_otlp_protocol: http/protobuf
beyla_bpf_context_propagation: all
beyla_log_level: info
beyla_privileged: true
beyla_open_ports:
  - 5000
