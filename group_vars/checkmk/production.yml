---
# Agent role
# what is 'agent_prep_legacy' for?
# we only set it in production
# checkmk_agent_prep_legacy: 'false'
checkmk_agent_server: "pulmonitor-prod1.lib.princeton.edu"
checkmk_agent_site: production
checkmk_agent_secret: "{{ vault_automation_secret_production }}"
checkmk_agent_automation_role: automation
checkmk_agent_labels: []  # Empty list for labels
checkmk_agent_attributes: {}  # Empty dict for attributes
checkmk_agent_services: true  # Let CheckMK discover services
checkmk_agent_protocol: http
checkmk_agent_host_specific: false
checkmk_agent_folder_specific: false
checkmk_agent_server_protocol: http

# checkmk_folders:
#   - path: /linux/sandboxes
#     title: Sandboxes

checkmk_observability_hosts:
  pulmonitor-prod1.lib.princeton.edu:
    site_name: production
    environment: production
    otlp_backends:
      - "k8s-prod1.lib.princeton.edu:32317"
      - "k8s-prod2.lib.princeton.edu:32317"
      - "k8s-prod3.lib.princeton.edu:32317"

  pulmonitor-prod2.lib.princeton.edu:
    site_name: staging
    environment: staging
    otlp_backends:
      - "k8s-staging1.lib.princeton.edu:32317"
      - "k8s-staging2.lib.princeton.edu:32317"
      - "k8s-staging3.lib.princeton.edu:32317"

checkmk_site_name: >-
  {{
    checkmk_observability_hosts[inventory_hostname]['site_name']
  }}

checkmk_environment: >-
  {{
    checkmk_observability_hosts[inventory_hostname]['environment']
  }}

otel_signoz_backends: >-
  {{
    checkmk_observability_hosts[inventory_hostname]['otlp_backends']
  }}

otel_service_name: otelcol-contrib
otel_service_user: root
otel_service_group: root

# Validate the rendered Collector configuration before restarting it.
# The installed Collector must support http_check and body validations.
otel_validate_config: true
otel_validate_cmd: >-
  {{ otel_binary_path }} validate
  --config {{ otel_config_path }}

otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: checkmk
  service.namespace: pul-library
  service.version: "{{ checkmk_version | default('2.5.0p9') }}"
  deployment.environment: "{{ checkmk_environment }}"
  environment: "{{ checkmk_environment }}"
  checkmk.site.name: "{{ checkmk_site_name }}"
  checkmk.site.role: >-
    {{
      'central'
      if checkmk_site_name == 'production'
      else 'remote'
    }}

otel_receivers:
  otlp/beyla:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # Public website probes run from each Checkmk host
  # Identify targets by http.url and probing hosts by probe.location.
  # Both Checkmk hosts probe these same public production URLs; each
  # exports to the SigNoz environment selected by the host mapping above.
  http_check/websites:
    collection_interval: 60s
    metrics:
      httpcheck.validation.passed:
        enabled: true
      httpcheck.validation.failed:
        enabled: true
      httpcheck.response.size:
        enabled: true
      httpcheck.tls.cert_remaining:
        enabled: true
    targets:
      # ILLIAD Website
      - endpoint: "https://princeton.illiad.oclc.org/logon/"
        method: GET
        timeout: 10s
        validations:
          - contains: "All current Princeton University faculty, students, and staff with an active NetID."

      # AEON Website
      - endpoint: "https://princeton.aeon.atlas-sys.com/logon"
        method: GET
        timeout: 10s
        validations:
          - contains: "All current Princeton University faculty, students, and staff with an active NetID."

      # EZproxy Client
      # Body validation is performed here. Enforce exact HTTP 200 with
      # a separate SigNoz alert on httpcheck.status: select the observed
      # response (value = 1) whose http.status_code is not 200.
      # Also alert on connection errors and missing probe/validation data.
      # A 2xx-only availability alert does not enforce exact HTTP 200.
      - endpoint: "https://login.ezproxy.princeton.edu/login?url=https%3A%2F%2Fwww.washingtonpost.com"
        method: GET
        timeout: 10s
        validations:
          - contains: "If your browser does not continue automatically"

  # solr9 check
  # probe solr
  http_check/solr9:
    collection_interval: 60s

    targets:
      - endpoint: "http://lib-solr-prod1.princeton.edu:8983/solr/geniza/admin/ping?wt=json&distrib=true&indent=true"
        method: GET
        timeout: 10s

      - endpoint: "http://lib-solr-prod2.princeton.edu:8983/solr/geniza/admin/ping?wt=json&distrib=true&indent=true"
        method: GET
        timeout: 10s

      - endpoint: "http://lib-solr-prod3.princeton.edu:8983/solr/geniza/admin/ping?wt=json&distrib=true&indent=true"
        method: GET
        timeout: 10s

  # Checkmk logs use Python-style numeric severity levels.
  # Only WARN (30) and above reach SigNoz through filter/warn_and_above.
  filelog/checkmk:
    include:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/*.log"
    exclude:
      # CMC uses a different logging scale and has its own pipeline.
      - "/omd/sites/{{ checkmk_site_name }}/var/log/cmc.log"
      # Ignore rotated logs.
      - "/omd/sites/{{ checkmk_site_name }}/var/log/*.gz"
      - "/omd/sites/{{ checkmk_site_name }}/var/log/*.[0-9]"
    start_at: end
    include_file_name: true
    include_file_path: true
    operators:
      - type: regex_parser
        regex: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:,\d{3})? \[(?P<severity>[0-9]+)\]'
        severity:
          parse_from: attributes.severity
          preset: none
          mapping:
            debug:
              - 10
              - 15
            info: 20
            warn: 30
            error: 40
            fatal: 50
          overwrite_text: true
      - type: add
        field: attributes["log.source"]
        value: checkmk
      - type: add
        field: attributes["checkmk.site.name"]
        value: "{{ checkmk_site_name }}"

  # CMC records such as [4] can contain actual errors. Keep unfiltered.
  # https://docs.checkmk.com/latest/en/notifications.html
  filelog/checkmk-cmc:
    include:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/cmc.log"
    exclude:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/cmc.log.*"
    start_at: end
    include_file_name: true
    include_file_path: true
    operators:
      - type: add
        field: attributes["log.source"]
        value: checkmk-cmc
      - type: add
        field: attributes["checkmk.site.name"]
        value: "{{ checkmk_site_name }}"

  # Apache error log only; access logs have no WARN/ERROR semantics.
  filelog/checkmk-apache-error:
    include:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/apache/error_log"
    exclude:
      - "/omd/sites/{{ checkmk_site_name }}/var/log/apache/*.gz"
      - "/omd/sites/{{ checkmk_site_name }}/var/log/apache/*.[0-9]"
    start_at: end
    include_file_name: true
    include_file_path: true
    operators:
      - type: regex_parser
        regex: '^\[[^\]]+\] \[[^:\]]+:(?P<severity>[^\]]+)\]'
        severity:
          parse_from: attributes.severity
          preset: none
          mapping:
            debug:
              - debug
              - trace1
              - trace2
              - trace3
              - trace4
              - trace5
              - trace6
              - trace7
              - trace8
            info:
              - info
              - notice
            warn: warn
            error: error
            fatal:
              - crit
              - alert
              - emerg
          overwrite_text: true
      - type: add
        field: attributes["log.source"]
        value: checkmk-apache
      - type: add
        field: attributes["checkmk.site.name"]
        value: "{{ checkmk_site_name }}"

  # Journald filters priority before sending records into the Collector.
  # Replaces direct tailing of /var/log/syslog and /var/log/auth.log.
  journald/system:
    start_at: end
    priority: warning
    operators:
      - type: add
        field: attributes["log.source"]
        value: system

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem:
        exclude_fs_types:
          match_type: strict
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - sysfs
            - tmpfs
            - tracefs
      network: {}
      paging: {}
      processes: {}

otel_processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Runs only on probe metrics, after the shared resource processor.
  resource/probes:
    attributes:
      - key: service.name
        value: uptime-probes
        action: upsert
      - key: service.version
        action: delete
      - key: probe.location
        value: "{{ inventory_hostname }}"
        action: upsert

  resource/solr9-probes:
    attributes:
      - key: application
        value: geniza
        action: upsert

      - key: probe.target.service
        value: solr9
        action: upsert

      - key: probe.target.environment
        value: production
        action: upsert

  # CMC intentionally uses a separate pipeline without this filter.
  filter/warn_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_WARN

  batch:
    timeout: 10s
    send_batch_size: 8192
    send_batch_max_size: 16384

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames: "{{ otel_signoz_backends }}"

otel_extensions: {}

otel_service_pipelines:
  metrics/solr9-probes:
    receivers:
      - http_check/solr9

    processors:
      - memory_limiter
      - resource
      - resource/probes
      - resource/solr9-probes
      - batch

    exporters:
      - loadbalancing
  # WARN and above only.
  logs:
    receivers:
      - filelog/checkmk
      - filelog/checkmk-apache-error
      - journald/system
    processors:
      - memory_limiter
      - resource
      - filter/warn_and_above
      - batch
    exporters:
      - loadbalancing

  # CMC does not use the generic WARN severity filter.
  logs/cmc:
    receivers:
      - filelog/checkmk-cmc
    processors:
      - memory_limiter
      - resource
      - batch
    exporters:
      - loadbalancing

  metrics:
    receivers:
      - hostmetrics
      - otlp/beyla
    processors:
      - memory_limiter
      - resource
      - batch
    exporters:
      - loadbalancing

  # Dedicated pipeline for all three website probes.
  metrics/probes:
    receivers:
      - http_check/websites
    processors:
      - memory_limiter
      - resource
      - resource/probes
      - batch
    exporters:
      - loadbalancing

  traces:
    receivers:
      - otlp/beyla
    processors:
      - memory_limiter
      - resource
      - batch
    exporters:
      - loadbalancing

beyla_enabled: true
beyla_service_name: checkmk
beyla_environment: "{{ checkmk_environment }}"
beyla_otlp_endpoint: http://127.0.0.1:4318
beyla_otlp_protocol: http/protobuf
beyla_bpf_context_propagation: all
beyla_log_level: info
beyla_privileged: true
beyla_open_ports:
  - 5000
