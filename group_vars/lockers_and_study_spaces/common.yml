desired_nodejs_version: 'v26.8.1'
install_ruby_from_source: true
passenger_ruby: "/usr/local/bin/ruby"
ruby_version_override: "ruby-3.4.1"
passenger_extra_http_config:
  - "passenger_preload_bundler on;"
rails_app_vars:
  - name: APP_SECRET_KEY_BASE
    value: '{{ app_secret_key }}'
  - name: APP_DB
    value: '{{ app_db_name }}'
  - name: APP_DB_USERNAME
    value: '{{ app_db_user }}'
  - name: APP_DB_PASSWORD
    value: '{{ app_db_password }}'
  - name: APP_DB_HOST
    value: '{{ app_db_host }}'
  - name: APPLICATION_HOST
    value: '{{ app_host_name }}'
  - name: APPLICATION_HOST_PROTOCOL
    value: '{{ application_host_protocol }}'
  - name: HONEYBADGER_API_KEY
    value: '{{ lockers_honeybadger_key }}'
  - name: HONEYBADGER_ENV
    value: '{{ rails_app_env }}'
  - name: SECRET_KEY_BASE
    value: '{{ lockers_secret_key_base }}'
  - name: LDAP_USERNAME
    value: '{{ vault_lockers_and_study_spaces_ldap_username }}'
  - name: LDAP_PASSWORD
    value: '{{ vault_lockers_and_study_spaces_ldap_password }}'
