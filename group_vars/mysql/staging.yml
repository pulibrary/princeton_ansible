---
mysql_server: true
mysql_host: "mysql-db-dev1.princeton.edu"
mysql_bind_address: "0.0.0.0"
mysql_root_password: "{{ vault_mysql_root_password }}"

# Beyla
beyla_enabled: true
beyla_service_name: mysql
beyla_environment: staging
beyla_otlp_endpoint: "http://127.0.0.1:4318"
beyla_otlp_protocol: "http/protobuf"
beyla_bpf_context_propagation: "all"

beyla_open_ports:
  - 3306

# SigNoz / OpenTelemetry Collector
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: mysql
  service.version: staging
  environment: staging
  deployment.environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  filelog/mysql-error:
    include:
      - /var/log/mysql/mysql_error.log
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: regex_parser
        id: parse_mysql_error
        regex: '^\S+(?:\s+\S+)?\s+\d+\s+\[(?P<level>[^\]]+)\]\s+(?P<message>[\s\S]*)$'
        parse_from: body
        on_error: send

      - type: severity_parser
        id: parse_mysql_severity
        parse_from: attributes.level
        mapping:
          debug:
            - Debug
          info:
            - Note
            - Info
          warn:
            - Warning
          error:
            - Error
          fatal:
            - Critical
            - Fatal
        on_error: send

      - type: move
        id: move_mysql_message_to_body
        from: attributes.message
        to: body
        on_error: send

      - type: add
        field: attributes.log_type
        value: mysql_error

      - type: add
        field: attributes.service_name
        value: mysql

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  filter/warn_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_WARN

  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/mysql-error
    processors:
      - resource
      - filter/warn_and_above
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - otlp
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug
