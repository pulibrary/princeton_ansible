---
step_ca_ssh_principals:
  - lib-vi008
  - lib-vi014
  - lib-vi002
  - libdoas
  - lib-vi011
  - lib-vi12

step_ca_oidc_enabled: true

step_ca_oidc_admins:
  - lib-vi008@princeton.edu
  - lib-vi014@princeton.edu
  - lib-vi002@princeton.edu
  - libdoas@princeton.edu
  - lib-vi011@princeton.edu
  - lib-vi12@princeton.edu


step_ca_oidc_listen_address: "localhost:10000"

step_ca_password: "{{ vault_step_ca_password }}"
step_ca_oidc_tenant_id: "2ff60116-7431-425d-b5af-077d7791bda4"
step_ca_oidc_client_id: "{{ vault_step_ca_oidc_client_id }}"
step_ca_oidc_client_secret: "{{ vault_step_ca_oidc_client_secret }}"

# principal users
ssh_ca_operator_group: opsys
ssh_ca_manage_operator_sudo: true
ssh_ca_users:
  - { name: lib-vi008, principals: [lib-vi008@princeton.edu] }
  - { name: lib-vi014, principals: [lib-vi014@princeton.edu] }
  - { name: lib-vi12, principals: [lib-vi12@princeton.edu] }
  - { name: lib-vi002, principals: [lib-vi002@princeton.edu] }
  - { name: libdoas, principals: [libdoas@princeton.edu] }
  - { name: lib-vi011, principals: [lib-vi011@princeton.edu] }

# The Veeam backup appliance logs in as a local service account with a
# password; it cannot present an SSH certificate. Keep password logins working
# for that one account instead of re-enabling passwords for the whole host.
ssh_ca_password_auth_users:
  - "{{ veeam_proxmox_user }}"

# Host and Proxmox API access for that account. The password hash lives in
# group_vars/proxmox/vault.yml; until it is added the account keeps whatever
# password it already has.
veeam_proxmox_user: veeam-service
veeam_proxmox_user_password: "{{ vault_veeam_service_password | default('') }}"
