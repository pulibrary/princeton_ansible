---
java_version: 17
install_ruby_from_source: true
install_zookeeper_from_source: true
desired_ruby_version: "3.4.1"
ruby_version_override: "ruby-3.4.1"
solr_heap_setting: "20g"
jardirectory: "/opt/solr/lib"
jolokia_agent_version: "2.5.1"
solr_trust_forwarded_headers: true

# Validate the rendered Collector configuration before restarting it.
otel_validate_config: true
otel_validate_cmd: >-
  {{ otel_binary_path }} validate
  --config {{ otel_config_path }}

solr_modules:
  - analysis-extras
  - scripting
  - langid
  - opentelemetry

solr_otel_enabled: true
solr_otel_service_name: solr
solr_otel_endpoint: "http://127.0.0.1:4317"
solr_otel_protocol: grpc
solr_otel_sampler: parentbased_always_on
solr_otel_propagators: "tracecontext,baggage"

# More granular option:
# solr_java_memory: "-Xms16g -Xmx20g"

# Solr shard and update timeouts
solr_shard_socket_timeout: 120000
solr_shard_conn_timeout: 60000
solr_update_socket_timeout: 120000
solr_update_conn_timeout: 60000
solr_update_max_connections: 512
solr_update_max_per_host: 64

solr_cloud_download_version: 9.9.0
solr_cloud_version: "{{ solr_version }}"
solr_version: "{{ solr_cloud_download_version }}"
solr_log4j_path: "/solr/log4j2.xml"
solr_znode: solr9

solr_nodes:
  - "lib-solr-staging1.princeton.edu"
  - "lib-solr-staging2.princeton.edu"
  - "lib-solr-staging3.princeton.edu"

solr_zookeeper_hosts:
  - "lib-zk-staging4.princeton.edu:2181"
  - "lib-zk-staging5.princeton.edu:2181"
  - "lib-zk-staging6.princeton.edu:2181"

cjkfoldingfilter: >-
  https://github.com/pulibrary/pul_solr/raw/master/solr8_jars/CJKFoldingFilter.jar

# gcsfuse logrotate
gcsfuse_directory: "/var/log/gcsfuse"

solr9_gcsfuse_logrotate_rules:
  - name: "gcsfuse"
    paths:
      - "{{ gcsfuse_directory }}/*.log"
    options:
      rotate: "{{ logrotate_global_defaults.rotate }}"
      maxsize: "{{ logrotate_global_defaults.maxsize }}"
      create_mode: "{{ logrotate_global_defaults.create_mode }}"
      create_owner: "deploy"
      create_group: "deploy"
      su_user: "{{ logrotate_global_defaults.su_user }}"
      su_group: "{{ logrotate_global_defaults.su_group }}"
      postrotate: |
        systemctl reload solr-gcsfuse.service 2>/dev/null || true

beyla_enabled: true
beyla_service_name: solr
beyla_environment: staging
beyla_otlp_endpoint: "http://127.0.0.1:4318"
beyla_otlp_protocol: "http/protobuf"
beyla_bpf_context_propagation: "all"
beyla_open_ports:
  - 8983

# SigNoz / OpenTelemetry Collector for Solr
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: solr
  service.version: staging
  environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "127.0.0.1:4317"
      http:
        endpoint: "127.0.0.1:4318"

  filelog/solr-main:
    include:
      - "/solr/logs/solr.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: recombine
        id: recombine_solr_stacktraces
        combine_field: body
        source_identifier: attributes["log.file.path"]
        is_first_entry: 'body matches "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3} "'
        force_flush_period: 5s

      - type: regex_parser
        id: parse_solr_log
        regex: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>[A-Z]+)\s+\((?P<thread>[^)]*)\)\s+\[(?P<solr_context>[^\]]*)\]\s+(?P<logger>\S+)\s+(?P<message>[\s\S]*)$'
        parse_from: body
        on_error: send

      - type: time_parser
        id: parse_solr_timestamp
        parse_from: attributes.timestamp
        layout_type: strptime
        layout: "%Y-%m-%d %H:%M:%S.%L"
        on_error: send

      - type: severity_parser
        id: parse_solr_severity
        parse_from: attributes.level
        on_error: send

      # Extract t:<trace_id> from the Log4j MDC context and assign it
      # to the OpenTelemetry log record's trace context.
      - type: regex_parser
        id: extract_solr_trace_id
        parse_from: attributes.solr_context
        if: 'attributes.solr_context != nil and attributes.solr_context matches ".*t:[0-9a-fA-F]{32}.*"'
        regex: '^.*t:(?P<trace_id>[0-9a-fA-F]{32}).*$'
        trace:
          trace_id:
            parse_from: attributes.trace_id
        on_error: send

      - type: add
        id: add_solr_main_log_type
        field: attributes.log_type
        value: solr_main

      - type: add
        id: add_solr_main_service_name
        field: attributes.service_name
        value: solr

  filelog/solr-request:
    include:
      - "/solr/logs/*.request.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: add
        id: add_solr_request_log_type
        field: attributes.log_type
        value: solr_request

      - type: add
        id: add_solr_request_service_name
        field: attributes.service_name
        value: solr

  filelog/solr-gc:
    include:
      - "/solr/logs/solr_gc.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: add
        id: add_solr_gc_log_type
        field: attributes.log_type
        value: solr_gc

      - type: add
        id: add_solr_gc_service_name
        field: attributes.service_name
        value: solr

  filelog/solr-slow-requests:
    include:
      - "/solr/logs/solr_slow_requests.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: add
        id: add_solr_slow_requests_log_type
        field: attributes.log_type
        value: solr_slow_requests

      - type: add
        id: add_solr_slow_requests_service_name
        field: attributes.service_name
        value: solr

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  filter/warn_and_above:
    error_mode: ignore
    log_conditions:
      - log.severity_number < SEVERITY_NUMBER_WARN

  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - "k8s-staging1.lib.princeton.edu:32317"
          - "k8s-staging2.lib.princeton.edu:32317"
          - "k8s-staging3.lib.princeton.edu:32317"

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/solr-main
      - filelog/solr-request
      - filelog/solr-gc
      - filelog/solr-slow-requests
    processors:
      - resource
      - filter/warn_and_above
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
