---
java_version: 17
install_ruby_from_source: true
install_zookeeper_from_source: true
desired_ruby_version: "3.4.1"
ruby_version_override: "ruby-3.4.1"
solr_heap_setting: "20g"
jardirectory: "/opt/solr/lib"
jolokia_agent_version: "2.5.1"
solr_trust_forwarded_headers: true

# Validate the rendered Collector configuration before restarting it.
otel_validate_config: true
otel_validate_cmd: >-
  {{ otel_binary_path }} validate
  --config {{ otel_config_path }}

solr_modules:
  - analysis-extras
  - scripting
  - langid
  - opentelemetry

solr_otel_enabled: true
solr_otel_service_name: solr
solr_otel_endpoint: "http://127.0.0.1:4317"
solr_otel_protocol: grpc
solr_otel_sampler: parentbased_always_on
solr_otel_propagators: "tracecontext,baggage"

# Solr shard and update timeouts
solr_shard_socket_timeout: 120000
solr_shard_conn_timeout: 60000
solr_update_socket_timeout: 120000
solr_update_conn_timeout: 60000
solr_update_max_connections: 512
solr_update_max_per_host: 64

solr_cloud_download_version: 9.9.0
solr_cloud_version: "{{ solr_version }}"
solr_version: "{{ solr_cloud_download_version }}"
solr_log4j_path: "/solr/log4j2.xml"
solr_znode: solr9

solr_nodes:
  - "lib-solr-staging1.princeton.edu"
  - "lib-solr-staging2.princeton.edu"
  - "lib-solr-staging3.princeton.edu"

solr_zookeeper_hosts:
  - "lib-zk-staging4.princeton.edu:2181"
  - "lib-zk-staging5.princeton.edu:2181"
  - "lib-zk-staging6.princeton.edu:2181"

cjkfoldingfilter: >-
  https://github.com/pulibrary/pul_solr/raw/master/solr8_jars/CJKFoldingFilter.jar

# gcsfuse logrotate
gcsfuse_directory: "/var/log/gcsfuse"

solr9_gcsfuse_logrotate_rules:
  - name: "gcsfuse"
    paths:
      - "{{ gcsfuse_directory }}/*.log"
    options:
      rotate: "{{ logrotate_global_defaults.rotate }}"
      maxsize: "{{ logrotate_global_defaults.maxsize }}"
      create_mode: "{{ logrotate_global_defaults.create_mode }}"
      create_owner: "deploy"
      create_group: "deploy"
      su_user: "{{ logrotate_global_defaults.su_user }}"
      su_group: "{{ logrotate_global_defaults.su_group }}"
      postrotate: |
        systemctl reload solr-gcsfuse.service 2>/dev/null || true

beyla_enabled: true
beyla_service_name: solr
beyla_environment: staging
beyla_otlp_endpoint: "http://127.0.0.1:4318"
beyla_otlp_protocol: "http/protobuf"
beyla_bpf_context_propagation: "all"
beyla_open_ports:
  - 8983

# SigNoz / OpenTelemetry Collector for Solr
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: solr
  service.version: staging
  environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "127.0.0.1:4317"
      http:
        endpoint: "127.0.0.1:4318"

  filelog/solr-main:
    include:
      - "/solr/logs/solr.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # Solr writes one JSON object per line, so multi-line stack traces
      # already arrive as a single log record.
      - type: json_parser
        id: parse_solr_log
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
        severity:
          parse_from: attributes.level
        on_error: send

      # trace_id is only present on requests that carry trace context.
      - type: trace_parser
        id: parse_solr_trace_id
        if: 'attributes.trace_id != nil'
        trace_id:
          parse_from: attributes.trace_id
        on_error: send

      - type: add
        id: add_solr_main_log_type
        field: attributes.log_type
        value: solr_main

      - type: add
        id: add_solr_main_service_name
        field: attributes.service_name
        value: solr

  filelog/solr-request:
    include:
      - "/solr/logs/solr_request.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_solr_request_log
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
        severity:
          parse_from: attributes.level
        on_error: send

      # The message field holds the Jetty access log entry:
      # <client ip> - <user> "<request line>" <status> <bytes> <millis>
      - type: regex_parser
        id: parse_solr_request_fields
        parse_from: attributes.message
        regex: >-
          ^(?P<client_ip>\S+) -
          (?P<user>\S+)
          "(?P<method>\S+) (?P<url>\S*) (?P<protocol>[^"]*)"
          (?P<status>\d{3}) (?P<bytes_sent>\S+) (?P<duration_ms>\d+)$
        on_error: send

      # SolrCloud addresses a replica by its core name, and the core name
      # encodes the collection, shard and replica, as in
      # /solr/catalog-staging1_shard1_replica_n31/update
      - type: regex_parser
        id: parse_solr_request_core
        if: 'attributes.url != nil and attributes.url matches "_shard[0-9]+_replica_"'
        parse_from: attributes.url
        regex: '^/solr/(?P<solr_core>(?P<solr_collection>.+?)_(?P<solr_shard>shard[0-9]+)_(?P<solr_replica>replica_[a-z][0-9]+))(?:/(?P<solr_handler>[^?]*))?'
        on_error: send

      # Requests addressed by collection or alias name have no shard or
      # replica segment, as in /solr/catalog/select
      - type: regex_parser
        id: parse_solr_request_collection
        if: >-
          attributes.url != nil
          and attributes.url matches "^/solr/[^/?#]+/[^?]"
          and not (attributes.url matches "^/solr/(admin/|.+_shard[0-9]+_replica_)")
        parse_from: attributes.url
        regex: '^/solr/(?P<solr_collection>[^/?#]+)/(?P<solr_handler>[^?]*)'
        on_error: send

      # Node level endpoints such as /solr/admin/collections belong to no
      # collection, so only the handler is worth keeping.
      - type: regex_parser
        id: parse_solr_request_admin
        if: 'attributes.url != nil and attributes.url matches "^/solr/admin/"'
        parse_from: attributes.url
        regex: '^/solr/(?P<solr_handler>admin/[^?]*)'
        on_error: send

      # Group the handlers into a few request types so that traffic can be
      # summarised without knowing every Solr endpoint name.
      - type: add
        id: add_solr_request_type_query
        if: >-
          attributes.solr_handler != nil
          and attributes.solr_handler matches "^(select|query|get|export|spell|suggest|terms|tvrh|browse)$"
        field: attributes.solr_request_type
        value: query

      - type: add
        id: add_solr_request_type_update
        if: 'attributes.solr_handler != nil and attributes.solr_handler matches "^update"'
        field: attributes.solr_request_type
        value: update

      - type: add
        id: add_solr_request_type_admin
        if: 'attributes.solr_handler != nil and attributes.solr_handler matches "^admin/"'
        field: attributes.solr_request_type
        value: admin

      - type: add
        id: add_solr_request_type_other
        if: 'attributes.solr_request_type == nil'
        field: attributes.solr_request_type
        value: other

      # distrib=false marks a per shard subquery fanned out by a coordinating
      # node, so top level queries can be told apart from internal ones.
      - type: regex_parser
        id: parse_solr_request_distrib
        if: 'attributes.url != nil and attributes.url matches "[?&]distrib="'
        parse_from: attributes.url
        regex: '[?&]distrib=(?P<solr_distrib>[^&]+)'
        on_error: send

      # update.distrib says how an update reached this replica, FROMLEADER
      # meaning that the shard leader forwarded it.
      - type: regex_parser
        id: parse_solr_request_update_distrib
        if: 'attributes.url != nil and attributes.url matches "update\\.distrib="'
        parse_from: attributes.url
        regex: '[?&]update\.distrib=(?P<solr_update_distrib>[^&]+)'
        on_error: send

      # distrib.from names the node and replica that forwarded the update.
      # Jetty logs the raw request target, so its URL may be percent encoded.
      - type: regex_parser
        id: parse_solr_request_distrib_from_host
        if: 'attributes.url != nil and attributes.url matches "distrib\\.from="'
        parse_from: attributes.url
        regex: '[?&]distrib\.from=https?(?:%3A|:)(?:%2F|/){2}(?P<solr_distrib_from_host>[^%&:/]+)'
        on_error: send

      - type: regex_parser
        id: parse_solr_request_distrib_from_core
        if: 'attributes.url != nil and attributes.url matches "distrib\\.from="'
        parse_from: attributes.url
        regex: '[?&]distrib\.from=[^&]*?(?:%2F|/)solr(?:%2F|/)(?P<solr_distrib_from_core>[^%&/]+)'
        on_error: send

      - type: add
        id: add_solr_request_log_type
        field: attributes.log_type
        value: solr_request

      - type: add
        id: add_solr_request_service_name
        field: attributes.service_name
        value: solr

  filelog/solr-gc:
    include:
      - "/solr/logs/solr_gc.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      # The JVM writes this log itself and its -Xlog framework has no JSON
      # output, so the [time][uptime][level][tags] prefix is parsed here.
      - type: regex_parser
        id: parse_solr_gc_log
        parse_from: body
        regex: '^\[(?P<timestamp>[^\]]+)\]\[(?P<uptime>[^\]]+)\]\[(?P<level>[^\]]+)\]\[(?P<gc_tags>[^\]]+)\]\s*(?P<message>[\s\S]*)$'
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: "%Y-%m-%dT%H:%M:%S.%L%z"
        on_error: send

      - id: parse_gc_time
        parse_from: body
        regex: 'User=(?P<gc_user_time>.*?)s '
        if: 'attributes.message matches "User="'
        type: regex_parser

      - type: add
        id: add_solr_gc_log_type
        field: attributes.log_type
        value: solr_gc

      - type: add
        id: add_solr_gc_service_name
        field: attributes.service_name
        value: solr

  filelog/solr-slow-requests:
    include:
      - "/solr/logs/solr_slow_requests.log"
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_solr_slow_request_log
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
        severity:
          parse_from: attributes.level
        on_error: send

      - type: trace_parser
        id: parse_solr_slow_request_trace_id
        if: 'attributes.trace_id != nil'
        trace_id:
          parse_from: attributes.trace_id
        on_error: send

      - type: add
        id: add_solr_slow_requests_log_type
        field: attributes.log_type
        value: solr_slow_requests

      - type: add
        id: add_solr_slow_requests_service_name
        field: attributes.service_name
        value: solr

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - "k8s-staging1.lib.princeton.edu:32317"
          - "k8s-staging2.lib.princeton.edu:32317"
          - "k8s-staging3.lib.princeton.edu:32317"

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/solr-main
      - filelog/solr-request
      - filelog/solr-gc
      - filelog/solr-slow-requests
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - otlp
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
