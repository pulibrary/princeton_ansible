---
host_ad_name: lib-sftp-staging1.princeton.edu
deploy_user_local_keys:
  - name: 'bibdata-worker-staging1'
    key: "{{ lookup('file', '../roles/lib_sftp/files/id_ed25519.pub') }}"

# Add each partner's public key as they supply it. An account may hold several
# keys: they all go into one file, which is how a key is replaced without an
# outage. Add the new one, wait for the partner to switch, then remove the old.
lib_sftp_transfer_keys:
  - account: "{{ almasftp_user }}"
    comment: 01PRI_INST
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzK1ULaqNf5CjhXng5sZaR/b354EJkOoj1GDJNc8O4K"
  - account: "{{ almasftp_user }}"
    comment: Mark_Z Key
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM7wMd/uwYZwNDGHUq6LLipblWTtHto8CJ/EDKgZHBgj"

# Alma authenticates with a key. ArchivesSpace still sends a password, so only
# that account keeps password logins; this overrides the list in
# group_vars/sftp/common.yml, where production keeps both.
lib_sftp_password_auth_users:
  - "{{ aspaceftp_user }}"

sssd_ldap_access_provider: permit

sssd_ldap_allow_users:
  - "{{ almasftp_user }}"
  - "{{ aspaceftp_user }}"

# Directory accounts are not in /etc/passwd, so usermod cannot add them to a
# local group. pusvc-g comes from Active Directory with gid 20204 and is already
# their primary group, so no local membership is needed.
lib_sftp_group_members: []
