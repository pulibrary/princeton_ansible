---
almasftp_user: almasftp
aspaceftp_user: lib-aspacesftp
almasftp_user_password: "{{ vault_almasftp_user_password }}"
aspaceftp_user_password: "{{ vault_aspaceftp_user_password }}"
allowed_ssh_users:
  - almasftp
  - lib-aspacesftp

# The transfer accounts and their sshd settings are the lib_sftp role's own
# defaults, which already cover both of these. They are named here only so the
# list of accounts that may log in to an SFTP host is visible in one place.
lib_sftp_password_auth_users:
  - "{{ almasftp_user }}"
  - "{{ aspaceftp_user }}"

lib_sftp_allow_users:
  - pulsys
  - deploy
  - "{{ almasftp_user }}"
  - "{{ aspaceftp_user }}"
