---
almasftp_user: almasftp
aspaceftp_user: lib-aspacesftp
almasftp_user_password: "{{ vault_almasftp_user_password }}"
aspaceftp_user_password: "{{ vault_aspaceftp_user_password }}"
allowed_ssh_users:
  - almasftp
  - lib-aspacesftp

# Staging and production still authenticate the transfer accounts with a
# password, because that is what Alma and ArchivesSpace are configured to send
# today. A key is preferable and the sandbox uses one, but switching these hosts
# needs the integration profile changed at each partner first, or the transfers
# stop. The sandbox overrides this with an empty list.
lib_sftp_password_auth_users:
  - "{{ almasftp_user }}"
  - "{{ aspaceftp_user }}"

lib_sftp_allow_users:
  - pulsys
  - deploy
  - "{{ almasftp_user }}"
  - "{{ aspaceftp_user }}"
