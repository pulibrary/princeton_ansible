---
database_connections:
  - db_host: 'figgy-db-staging1.princeton.edu'
    db_name: 'figgy_staging'
    db_user: '{{ vault_figgy_staging_db_user }}'
    db_password: '{{ vault_figgy_staging_db_password }}'
    db_admin_user: 'postgres'
nomad_vars:
  figgy-staging:
    SECRET_KEY_BASE: '{{ vault_figgy_secret_key }}'
    FIGGY_DB_USERNAME: '{{ vault_figgy_staging_db_user }}'
    FIGGY_DB_PASSWORD: '{{ vault_figgy_staging_db_password }}'
    FIGGY_DB_RO_USERNAME: '{{ vault_figgy_staging_db_ro_user }}'
    FIGGY_DB_RO_PASSWORD: '{{ vault_figgy_staging_db_ro_password }}'
    FIGGY_RABBIT_SERVER: >-
      amqp://{{ vault_rabbit_staging_user }}:{{ vault_rabbit_staging_password }}@{{ figgy_staging_rabbit_host }}:{{ figgy_staging_rabbit_port }}
    FIGGY_REDIS_PASSWORD: '{{ vault_nomad_redis_staging_password }}'
    FIGGY_READ_ONLY_MODE: 'false'
    FIGGY_PUDL_ROOT: '{{ vault_figgy_pudl_root }}'
    FIGGY_AWS_ACCESS_KEY_ID: '{{ vault_figgy_aws_access_key_id_staging }}'
    FIGGY_AWS_SECRET_ACCESS_KEY: '{{ vault_figgy_aws_secret_access_key_staging }}'
    HONEYBADGER_API_KEY: '{{ vault_figgy_honeybadger_key }}'
    READING_ROOM_IPS: '{{ vault_reading_room_ips }}'
    ASPACE_USER: '{{ vault_figgy_aspace_staging_user }}'
    ASPACE_PASSWORD: '{{ vault_figgy_aspace_staging_password }}'
    PULFALIGHT_UNPUBLISHED_TOKEN: '{{ vault_pulfalight_unpublished_auth_token }}'
    PLAUSIBLE_API_KEY: '{{ vault_figgy_plausible_api_key }}'
    GOOGLE_CLOUD_CREDENTIALS_BASE64: "{{ lookup('ansible.builtin.file', figgy_files ~ '/staging-google_cloud_credentials.json') | b64encode }}"
