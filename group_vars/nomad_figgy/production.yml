---
database_connections:
  - db_host: 'figgy-db-prod1.princeton.edu'
    db_name: 'figgy_production'
    db_user: '{{ vault_figgy_db_user }}'
    db_password: '{{ vault_figgy_db_password }}'
    db_admin_user: 'postgres'
nomad_vars:
  figgy-production:
    SECRET_KEY_BASE: '{{ vault_figgy_secret_key }}'
    FIGGY_DB_USERNAME: '{{ vault_figgy_db_user }}'
    FIGGY_DB_PASSWORD: '{{ vault_figgy_db_password }}'
    FIGGY_DB_RO_USERNAME: '{{ vault_figgy_db_ro_user }}'
    FIGGY_DB_RO_PASSWORD: '{{ vault_figgy_db_ro_password }}'
    FIGGY_RABBIT_SERVER: >-
      amqp://{{ vault_rabbit_production_user }}:{{ vault_rabbit_production_password }}@{{ figgy_rabbit_host }}:{{ figgy_rabbit_port }}
    FIGGY_REDIS_PASSWORD: '{{ vault_nomad_redis_production_password }}'
    FIGGY_READ_ONLY_MODE: 'false'
    FIGGY_PUDL_ROOT: '{{ vault_figgy_pudl_root }}'
    FIGGY_AWS_ACCESS_KEY_ID: '{{ vault_figgy_aws_access_key_id_production }}'
    FIGGY_AWS_SECRET_ACCESS_KEY: '{{ vault_figgy_aws_secret_access_key_production }}'
    HONEYBADGER_API_KEY: '{{ vault_figgy_honeybadger_key }}'
    READING_ROOM_IPS: '{{ vault_reading_room_ips }}'
    ASPACE_USER: '{{ vault_figgy_aspace_production_user }}'
    ASPACE_PASSWORD: '{{ vault_figgy_aspace_production_password }}'
    PULFALIGHT_UNPUBLISHED_TOKEN: '{{ vault_pulfalight_unpublished_auth_token }}'
    PLAUSIBLE_API_KEY: '{{ vault_figgy_plausible_api_key }}'
    EZID_DEFAULT_SHOULDER: '{{ vault_figgy_ezid_shoulder }}'
    EZID_USER: '{{ vault_figgy_ezid_username }}'
    EZID_PASSWORD: '{{ vault_figgy_ezid_password }}'
    GOOGLE_CLOUD_CREDENTIALS_BASE64: "{{ lookup('ansible.builtin.file', figgy_files ~ '/production-google_cloud_credentials.json') | b64encode }}"
