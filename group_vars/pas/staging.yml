---
php_version: "8.3"
php_unwanted_version: "8.1"
pas_db_driver: 'mysql'
pas_db_name: "pas_staging"
pas_db_user: "pas"
pas_password: '{{ vault_pas_db_password }}'
pas_security_key: '{{ vault_pas_security_key }}'
db_host: 'mysql-db-staging1.princeton.edu'
root_db_password: "{{ vault_mysql_root_password }}"
pas_default_site_url: 'https://slavery-staging.princeton.edu'
craft_version: 4

nfs_server_local: false

mysql_host: "mysql-db-staging1.princeton.edu"
mysql_root_password: "{{ vault_mysql_root_password }}"
mysql_databases:
  - name: "{{ pas_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_general_ci
mysql_users:
  - name: "{{ pas_db_user }}"
    host: "{{ ansible_default_ipv4.address }}"
    password: "{{ pas_password }}"
    priv: "{{ pas_db_name }}.*:ALL"
    update_password: on_create

install_ruby_from_source: true
install_mailcatcher: true
mailcatcher_user: "mailcatcher"
mailcatcher_group: "mailcatcher"
mailcatcher_home: /var/lib/mailcatcher

# beyla
beyla_enabled: true
beyla_service_name: pas
beyla_environment: staging
beyla_otlp_endpoint: "http://127.0.0.1:4318"
beyla_otlp_protocol: "http/protobuf"
beyla_bpf_context_propagation: "all"

beyla_open_ports:
  - 80

# signoz / otel collector for pas
otel_default_resource_attributes:
  host.name: "{{ inventory_hostname }}"
  service.name: pas
  service.version: staging
  environment: staging
  deployment.environment: staging

otel_receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # Apache writes these records as JSON (see apache_json_access_log in
  # group_vars/pas/common.yml), so there is no line format to pick apart and a
  # quote in a user agent cannot break a record.
  filelog/apache2-access:
    include:
      - /var/log/apache2/access_json.log
    exclude:
      - /var/log/apache2/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        id: parse_apache_access_json
        parse_from: body
        on_error: send

      - type: time_parser
        id: parse_apache_access_timestamp
        parse_from: attributes.timestamp
        layout_type: gotime
        layout: "2006-01-02T15:04:05-0700"
        on_error: send

      # Apache writes the status as a number, so the response class becomes a
      # severity without any string handling.
      - type: severity_parser
        id: parse_apache_access_severity
        parse_from: attributes.status
        preset: none
        # Without this the severity would read as the status code itself.
        overwrite_text: true
        mapping:
          info:
            - min: 100
              max: 399
          warn:
            - min: 400
              max: 499
          error:
            - min: 500
              max: 599
        on_error: send

      - type: move
        from: attributes.client_ip
        to: attributes.http.client_ip

      - type: move
        from: attributes.method
        to: attributes.http.request.method

      - type: move
        from: attributes.target
        to: attributes.url.path

      - type: move
        from: attributes.status
        to: attributes.http.response.status_code

      - type: move
        from: attributes.user_agent
        to: attributes.user_agent.original

      - type: move
        from: attributes.referrer
        to: attributes.http.request.header.referer

      - type: add
        field: attributes.log_type
        value: apache_access

  # Apache can only write its error log as text, so the shipper turns each entry
  # into structured fields instead.
  filelog/apache2-error:
    include:
      - /var/log/apache2/error.log
    exclude:
      - /var/log/apache2/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    # Continuation lines and stack traces belong with the entry above them.
    multiline:
      line_start_pattern: '^\[[A-Z][a-z]{2} [A-Z][a-z]{2} [ \d]\d '
    operators:
      - type: regex_parser
        id: parse_apache_error
        regex: '^\[(?P<timestamp>[^\]]+)\] \[(?P<module>[^:\]]+)(?::(?P<level>[^\]]+))?\] \[pid (?P<pid>\d+)(?::tid (?P<tid>\d+))?\](?: \[client (?P<client_ip>[^\]]+)\])? (?P<message>[\s\S]*)$'
        parse_from: body
        on_error: send

      - type: time_parser
        id: parse_apache_error_timestamp
        parse_from: attributes.timestamp
        layout_type: strptime
        layout: '%a %b %d %H:%M:%S.%f %Y'
        on_error: send

      - type: severity_parser
        id: parse_apache_error_severity
        parse_from: attributes.level
        mapping:
          debug:
            - debug
            - trace1
            - trace2
            - trace3
            - trace4
            - trace5
            - trace6
            - trace7
            - trace8
          info:
            - info
            - notice
          warn:
            - warn
          error:
            - error
          fatal:
            - crit
            - alert
            - emerg
        on_error: send

      - type: move
        id: move_apache_error_message_to_body
        from: attributes.message
        to: body
        on_error: send

      - type: add
        field: attributes.log_type
        value: apache_error

  # Craft writes one line per entry through Monolog, which the shipper splits
  # into the channel, the severity and the code path that logged it. Craft
  # starts a new file every day, hence the date in the names. These entries used
  # to be read with the Apache access regex, so nothing came out of them.
  filelog/craft:
    include:
      - /opt/pas_cap/current/storage/logs/web-*.log
      - /opt/pas_cap/current/storage/logs/queue-*.log
      - /opt/pas_cap/current/storage/logs/console-*.log
    exclude:
      - /opt/pas_cap/current/storage/logs/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    multiline:
      line_start_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \['
    operators:
      - type: regex_parser
        id: parse_craft_log
        regex: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?P<channel>[^.\]]+)\.(?P<level>[A-Z]+)\] \[(?P<category>[^\]]*)\] (?P<message>[\s\S]*)$'
        parse_from: body
        on_error: send

      # Craft writes local time without an offset, so the shipper has to be
      # told which zone the server keeps.
      - type: time_parser
        id: parse_craft_timestamp
        parse_from: attributes.timestamp
        layout_type: strptime
        layout: '%Y-%m-%d %H:%M:%S'
        location: America/New_York
        on_error: send

      - type: severity_parser
        id: parse_craft_severity
        parse_from: attributes.level
        mapping:
          debug:
            - DEBUG
          info:
            - INFO
            - NOTICE
          warn:
            - WARNING
          error:
            - ERROR
          fatal:
            - CRITICAL
            - ALERT
            - EMERGENCY
        on_error: send

      - type: move
        id: move_craft_message_to_body
        from: attributes.message
        to: body
        on_error: send

      - type: add
        field: attributes.log_type
        value: craft

  # PHP writes its own errors here, with the stack trace on the lines that
  # follow, so the trace stays attached to the error it belongs to.
  filelog/php-errors:
    include:
      - /opt/pas_cap/current/storage/logs/phperrors.log
    exclude:
      - /opt/pas_cap/current/storage/logs/*.gz
    start_at: end
    include_file_path: true
    include_file_name: true
    multiline:
      line_start_pattern: '^\[\d{2}-[A-Za-z]{3}-\d{4} '
    operators:
      - type: regex_parser
        id: parse_php_error
        regex: '^\[(?P<timestamp>\d{2}-[A-Za-z]{3}-\d{4} \d{2}:\d{2}:\d{2})[^\]]*\] PHP (?P<level>[A-Za-z ]+?):\s+(?P<message>[\s\S]*)$'
        parse_from: body
        on_error: send

      - type: time_parser
        id: parse_php_error_timestamp
        parse_from: attributes.timestamp
        layout_type: strptime
        layout: '%d-%b-%Y %H:%M:%S'
        location: America/New_York
        on_error: send

      - type: severity_parser
        id: parse_php_error_severity
        parse_from: attributes.level
        mapping:
          info:
            - Notice
          warn:
            - Warning
            - Deprecated
            - Startup Warning
          error:
            - Recoverable fatal error
          fatal:
            - Fatal error
            - Parse error
            - Core error
            - Compile error
        on_error: send

      - type: move
        id: move_php_error_message_to_body
        from: attributes.message
        to: body
        on_error: send

      - type: add
        field: attributes.log_type
        value: php_error

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}

otel_processors:
  # The optional parts of a text log line come through as empty attributes when
  # they are absent, which clutters every record in SigNoz.
  transform/drop_empty_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "tid") where attributes["tid"] == ""
          - delete_key(attributes, "client_ip") where attributes["client_ip"] == ""
          - delete_key(attributes, "category") where attributes["category"] == ""
          - delete_key(attributes, "user") where attributes["user"] == "-"
          - delete_key(attributes, "referrer") where attributes["referrer"] == "-"

  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 30s

otel_exporters:
  loadbalancing:
    routing_key: service
    protocol:
      otlp:
        timeout: 10s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    resolver:
      static:
        hostnames:
          - k8s-staging1.lib.princeton.edu:32317
          - k8s-staging2.lib.princeton.edu:32317
          - k8s-staging3.lib.princeton.edu:32317

  debug:
    verbosity: basic

otel_service_pipelines:
  logs:
    receivers:
      - filelog/apache2-access
      - filelog/apache2-error
      - filelog/craft
      - filelog/php-errors
    processors:
      - resource
      - transform/drop_empty_fields
      - batch
    exporters:
      - loadbalancing
      - debug

  metrics:
    receivers:
      - hostmetrics
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug

  traces:
    receivers:
      - otlp
    processors:
      - resource
      - batch
    exporters:
      - loadbalancing
      - debug
