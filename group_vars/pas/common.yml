---
server:
    timezone: 'America/New_York'
    locale: 'en_US.UTF-8'

apache:
    docroot: '/opt/pas_cap/current/web'
    servername: '{{ ansible_hostname }}'
    directory_options: '+Multiviews'

pas_memory_limit: '256M'
php_memory_limit: "{{ pas_memory_limit }}"

install_ruby_from_source: true
ruby_version_override: "ruby-4.0.6"
bundler_version: "4.0.16"

# Have Apache record each request as JSON so SigNoz receives structured fields
# instead of a line the shipper has to pick apart with a regex.
apache_json_access_log: true
apache_json_access_log_path: "/var/log/apache2/access_json.log"

db_port: '3306'
mysql_server: false
