---
db_name: 'pulmap'
db_user: 'pulmap_production'
db_password: '{{ vault_pulmap_production_db_password }}'
db_host: 'lib-postgres-staging1.princeton.edu'
db_admin_user: "postgres"
database_connections:
  - db_host: '{{ db_host }}'
    db_name: '{{ db_name }}'
    db_user: '{{ db_user }}'
    db_owner: '{{ db_user }}'
    db_password: '{{ db_password }}'
    db_admin_user: "{{ db_admin_user }}"
nomad_vars:
  pulmap-production:
    PULMAP_SOLR_URL: 'http://lib-solr9-prod.princeton.edu:8983/solr/pulmap'
    PULMAP_SECRET_KEY_BASE: '{{ vault_pulmap_production_secret_key_base }}'
    PULMAP_DOWNLOAD_PATH: '/opt/pulmap/shared/maplab/pulmap/downloads'
    PULMAP_DB_USERNAME: '{{ db_user }}'
    PULMAP_DB_PASSWORD: '{{ db_password }}'
    PULMAP_DB_HOST: '{{ db_host }}'
    PULMAP_DB: '{{ db_name }}'
    PULMAP_ADMIN_NETIDS: '{{ sidekiq_netids | join(" ") }}'
    OTEL_SERVICE_NAME: 'pulmap'
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: 'http/protobuf'
    OTEL_EXPORTER_OTLP_INSECURE: 'true'
    OTEL_EXPORTER_OTLP_ENDPOINT: 'http://172.17.0.1:4318'
    MAP_FEEDBACK_TO: '{{ vault_pulmap_feedback_to }}'
    HONEYBADGER_API_KEY: '{{ vault_pulmap_honeybadger_api_key }}'
    PULMAP_ENTRA_SECRET: '{{ vault_pulmap_production_entra_secret }}'
