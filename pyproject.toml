[project]
name = "princeton-ansible"
version = "1.0.0"
description = "Princeton University Library Ansible configuration management"
readme = "README.md"
requires-python = ">=3.14.7"
license = { text = "MIT" }
authors = [{ name = "Princeton University Library" }]

dependencies = [
  "ansible==14.3.1",
  "ansible-builder==3.1.1",
  "ansible-compat==26.8.0",
  "ansible-core==2.21.4rc1",
  "ansible-creator==26.8.0",
  "ansible-lint==6.22.2",
  "bcrypt==5.0.0",
  "bindep==2.14.0",
  "black>=26.5.1",
  "boto3==1.43.87",
  "cryptography==50.0.1",
  "dnspython==2.8.0",
  "docker==7.2.0",
  "GitPython==3.1.61",
  "jmespath==1.1.0",
  "molecule==26.8.0",
  "molecule-plugins==26.7.15",
  "netaddr==1.3.0",
  "passlib==1.7.4",
  "python-consul==1.1.0",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "requirements-parser==0.13.1",
  "selinux==0.3.0 ; sys_platform == 'linux'",
  "websocket-client==1.9.2",
  "yamllint==1.38.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
