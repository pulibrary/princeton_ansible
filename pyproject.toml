[project]
name = "princeton-ansible"
version = "1.0.0"
description = "Princeton University Library Ansible configuration management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Princeton University Library" }]

dependencies = [
  "ansible==12.3.0",
  "ansible-builder==3.1.1",
  "ansible-compat==26.8.0",
  "ansible-core==2.19.11rc1",
  "ansible-creator==25.12.0",
  "ansible-lint==6.22.2",
  "bcrypt==5.0.0",
  "bindep==2.14.0",
  "black>=26.3.1",
  "boto3==1.37.30",
  "cryptography==50.0.0",
  "dnspython==2.6.1",
  "docker==7.1.0",
  "GitPython==3.1.61",
  "jmespath==1.0.1",
  "molecule==6.0.3",
  "molecule-plugins==23.5.0",
  "netaddr==1.3.0",
  "passlib==1.7.4",
  "python-consul==1.1.0",
  "PyYAML==6.0.3",
  "requests==2.33.0",
  "requirements-parser==0.5.0",
  "selinux==0.3.0 ; sys_platform == 'linux'",
  "websocket-client==1.6.4",
  "yamllint==1.33.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
