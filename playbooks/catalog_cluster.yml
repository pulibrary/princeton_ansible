---
# by default this playbook runs in the staging environment
# to run in production, pass '-e runtime_env=production'
# If you want to just recompile the application, use `-t compile`
# To compile from a specific branch in the application's repo, pass `-e branch=my-feature-branch`
- name: Build the catalog cluster
  hosts: catalog_cluster_{{ runtime_env | default('staging') }}
  remote_user: pulsys
  become: true
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/catalog_cluster/{{ runtime_env | default('staging') }}.yml
    - ../group_vars/catalog_cluster/common.yml
    - ../group_vars/catalog_cluster/vault.yml

  roles:
    - role: deploy_user
    - role: catalog_cluster

  post_tasks:
    - name: Tell everyone on slack you ran an ansible playbook
      community.general.slack:
        token: "{{ vault_pul_slack_token }}"
        msg: "Ansible ran `{{ ansible_play_name }}` on {{ inventory_hostname }}"
        channel: "{{ slack_alerts_channel }}"
