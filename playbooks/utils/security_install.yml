---
# This playbook installs OIT-mandated security tools:
# Cortex XDR, the Rapid7 Insight Agent, and the Rapid7 Scan Assistant.
#
# By default, this playbook runs against all hosts in all environments.
# To run against a single host or group:
#
#   ansible-playbook playbooks/utils/security_install.yml \
#     --limit <group_or_host_name>
#
# To install or repair only the Rapid7 Scan Assistant:
#
#   ansible-playbook playbooks/utils/security_install.yml \
#     --limit <group_or_host_name> \
#     --tags rapid7_scan_assistant
#
# The Rapid7 Scan Assistant firewall rule defaults to allowing:
#
#   10.6.48.214 -> TCP/21047
#
# These defaults can be overridden with:
#
#   scan_assistant_engine_ips
#   scan_assistant_port
#   scan_assistant_firewalld_zone

- name: Install OIT security tools on a host
  hosts: all
  remote_user: pulsys
  become: true
  serial: "{{ concurrent_vms | default('5') }}"

  vars_files:
    - ../../group_vars/xdr/vault.yml
    - ../../group_vars/xdr/vars.yml
    - ../../group_vars/rapid7/vault.yml
    - ../../group_vars/rapid7/vars.yml
    - ../../group_vars/all/vars.yml
    - ../../group_vars/all/vault.yml

  vars:
    rapid7_scan_assistant_engine_ips: >-
      {{
        scan_assistant_engine_ips
        | default(['10.6.48.214'])
      }}
    rapid7_scan_assistant_port: >-
      {{
        scan_assistant_port
        | default('21047')
      }}
    rapid7_scan_assistant_firewalld_zone: >-
      {{
        scan_assistant_firewalld_zone
        | default('public')
      }}

  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Install XDR except on FreeBSD
      when:
        - ansible_distribution != "FreeBSD"
        - "'traps_pmd.service' not in ansible_facts.services"
      block:
        - name: Download the XDR deb file (Ubuntu)
          ansible.builtin.unarchive:
            src: >-
              https://pulmirror.princeton.edu/mirror/palo/Linux-{{ xdr_version }}_deb.tar.gz
            dest: /opt/
            creates: "/opt/{{ cortex_install }}.deb"
            remote_src: true
          when:
            - ansible_os_family == "Debian"

        - name: Download the XDR rpm file (RedHat)
          ansible.builtin.unarchive:
            src: >-
              https://pulmirror.princeton.edu/mirror/palo/Linux-{{ xdr_version }}_rpm.tar.gz
            dest: /opt/
            creates: "/opt/{{ cortex_install }}.rpm"
            remote_src: true
          when:
            - ansible_os_family == "RedHat"

        - name: Install Cortex XDR dependencies (RedHat)
          ansible.builtin.dnf:
            name: selinux-policy-devel
            state: present
          when:
            - ansible_os_family == "RedHat"

        - name: Create /etc/panw directory
          ansible.builtin.file:
            path: /etc/panw
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Build the XDR config file
          ansible.builtin.copy:
            content: |
              --distribution-id {{ xdr_vault_distribution_id }}
              --distribution-server {{ xdr_distribution_server }}
            dest: /etc/panw/cortex.conf
            owner: root
            group: root
            mode: "0744"

        - name: Install XDR agent (Ubuntu)
          ansible.builtin.apt:
            deb: "/opt/{{ cortex_install }}.deb"
          when:
            - ansible_os_family == "Debian"

        - name: Install XDR agent (RedHat)
          ansible.builtin.dnf:
            name: "/opt/{{ cortex_install }}.rpm"
            state: present
            disable_gpg_check: true
          when:
            - ansible_os_family == "RedHat"

        - name: Run cytool checkin
          ansible.builtin.command:
            cmd: /opt/traps/bin/cytool checkin
          register: cytool_result
          changed_when: cytool_result.rc == 0
          failed_when: false

        - name: Tag Cortex XDR endpoint except on FreeBSD
          when:
            - ansible_distribution != "FreeBSD"
          block:
            - name: Check for cytool
              ansible.builtin.stat:
                path: /opt/traps/bin/cytool
              register: cytool_stat

            - name: List Cortex XDR endpoint tags
              ansible.builtin.command:
                cmd: /opt/traps/bin/cytool endpoint_tags list
              register: xdr_endpoint_tags
              changed_when: false
              failed_when: false
              when:
                - cytool_stat.stat.exists

            - name: Add Cortex XDR endpoint tag
              ansible.builtin.command:
                cmd: >-
                  /opt/traps/bin/cytool endpoint_tags add
                  "{{ xdr_endpoint_tag }}"
              register: xdr_tag_add
              changed_when: xdr_tag_add.rc == 0
              failed_when: false
              when:
                - cytool_stat.stat.exists
                - xdr_endpoint_tags.rc is defined
                - xdr_endpoint_tags.rc == 0
                - xdr_endpoint_tag not in xdr_endpoint_tags.stdout

            - name: Run cytool checkin after endpoint tag update
              ansible.builtin.command:
                cmd: /opt/traps/bin/cytool checkin
              register: cytool_tag_checkin
              changed_when: cytool_tag_checkin.rc == 0
              failed_when: false
              when:
                - cytool_stat.stat.exists
                - xdr_tag_add is changed

        - name: Remove XDR package files to save space
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/opt/{{ cortex_install }}.deb"
            - "/opt/{{ cortex_install }}.rpm"

    - name: Install, configure, and start Rapid7 Insight Agent
      when:
        - ansible_distribution != "FreeBSD"
      block:
        - name: Download Rapid7 Insight Agent deb package (Ubuntu)
          ansible.builtin.get_url:
            url: >-
              https://us.storage.endpoint.ingress.rapid7.com/com.rapid7.razor.public/endpoint/agent/latest/linux/x86_64/rapid7_insight_agent_x64.deb
            dest: /tmp/rapid7-insight-agent_latest_amd64.deb
            owner: root
            group: root
            mode: "0644"
          when:
            - ansible_os_family == "Debian"

        - name: Extract version from Rapid7 Insight Agent deb package
          ansible.builtin.command:
            argv:
              - dpkg-deb
              - -f
              - /tmp/rapid7-insight-agent_latest_amd64.deb
              - Version
          register: r7_deb_version
          changed_when: false
          when:
            - ansible_os_family == "Debian"

        - name: Download Rapid7 Insight Agent rpm package (RedHat)
          ansible.builtin.get_url:
            url: >-
              https://us.storage.endpoint.ingress.rapid7.com/com.rapid7.razor.public/endpoint/agent/latest/linux/x86_64/rapid7_insight_agent_x64.rpm
            dest: /tmp/rapid7-insight-agent-latest.x86_64.rpm
            owner: root
            group: root
            mode: "0644"
          when:
            - ansible_os_family == "RedHat"

        - name: Install Rapid7 public signing key (RedHat)
          ansible.builtin.rpm_key:
            state: present
            key: >-
              https://us.storage.endpoint.ingress.rapid7.com/com.rapid7.razor.public/endpoint/agent/latest/linux/x86_64/Rapid7_public_key.pub
          when:
            - ansible_os_family == "RedHat"

        - name: Install Rapid7 Insight Agent (Ubuntu)
          ansible.builtin.apt:
            deb: /tmp/rapid7-insight-agent_latest_amd64.deb
          when:
            - ansible_os_family == "Debian"

        - name: Install Rapid7 Insight Agent (RedHat)
          ansible.builtin.dnf:
            name: /tmp/rapid7-insight-agent-latest.x86_64.rpm
            state: present
          when:
            - ansible_os_family == "RedHat"

        - name: Extract version from Rapid7 Insight Agent rpm package
          ansible.builtin.command:
            argv:
              - rpm
              - -qp
              - "--queryformat=%{VERSION}"
              - /tmp/rapid7-insight-agent-latest.x86_64.rpm
          register: r7_rpm_version
          changed_when: false
          when:
            - ansible_os_family == "RedHat"

        - name: Set Rapid7 Insight Agent component version (Ubuntu)
          ansible.builtin.set_fact:
            slim_rapid7_version: "{{ r7_deb_version.stdout.split('-')[0] }}"
          when:
            - ansible_os_family == "Debian"

        - name: Set Rapid7 Insight Agent component version (RedHat)
          ansible.builtin.set_fact:
            slim_rapid7_version: "{{ r7_rpm_version.stdout.split('-')[0] }}"
          when:
            - ansible_os_family == "RedHat"

        - name: Configure Rapid7 Insight Agent with token
          ansible.builtin.command:
            argv:
              - >-
                /opt/rapid7/ir_agent/components/insight_agent/{{ slim_rapid7_version }}/configure_agent.sh
              - --token
              - "{{ vault_Rapid7_token }}"
              - "--attributes=Library Operations"
          no_log: true

        - name: Enable and restart Rapid7 Insight Agent
          ansible.builtin.service:
            name: ir_agent
            enabled: true
            state: restarted

        - name: Remove Rapid7 Insight Agent package files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/rapid7-insight-agent_latest_amd64.deb
            - /tmp/rapid7-insight-agent-latest.x86_64.rpm

    - name: Install, configure, start, and verify Rapid7 Scan Assistant
      when:
        - ansible_distribution != "FreeBSD"
      tags:
        - rapid7_scan_assistant
      block:
        - name: Create Rapid7 Scan Assistant configuration directory
          ansible.builtin.file:
            path: /etc/rapid7/ScanAssistant
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Download Rapid7 Scan Assistant deb package (Ubuntu)
          ansible.builtin.get_url:
            url: "{{ scan_assistant_deb_pkg_url }}"
            dest: /tmp/R7ScanAssistant_amd64.deb
            checksum: "sha512:{{ scan_assistant_deb_checksum }}"
            owner: root
            group: root
            mode: "0644"
          when:
            - ansible_os_family == "Debian"

        - name: Download Rapid7 Scan Assistant rpm package (RedHat)
          ansible.builtin.get_url:
            url: "{{ scan_assistant_rpm_pkg_url }}"
            dest: /tmp/R7ScanAssistant_amd64.rpm
            checksum: "sha512:{{ scan_assistant_rpm_checksum }}"
            owner: root
            group: root
            mode: "0644"
          when:
            - ansible_os_family == "RedHat"

        - name: Install Rapid7 Scan Assistant package (Ubuntu)
          ansible.builtin.apt:
            deb: /tmp/R7ScanAssistant_amd64.deb
          register: scan_assistant_deb_install
          when:
            - ansible_os_family == "Debian"

        - name: Install Rapid7 Scan Assistant package (RedHat)
          ansible.builtin.dnf:
            name: /tmp/R7ScanAssistant_amd64.rpm
            state: present
            disable_gpg_check: true
          register: scan_assistant_rpm_install
          when:
            - ansible_os_family == "RedHat"

        - name: Verify Rapid7 Scan Assistant configuration was created
          ansible.builtin.stat:
            path: /etc/rapid7/ScanAssistant/config.json
          register: scan_assistant_config

        - name: Fail when Rapid7 Scan Assistant configuration is missing
          ansible.builtin.assert:
            that:
              - scan_assistant_config.stat.exists
              - scan_assistant_config.stat.isreg
            fail_msg: >-
              Rapid7 Scan Assistant installation did not create
              /etc/rapid7/ScanAssistant/config.json.

        - name: Install Rapid7 Scan Assistant certificate
          ansible.builtin.copy:
            content: "{{ vault_scan_assistant_pem_file | trim }}\n"
            dest: /etc/rapid7/ScanAssistant/scan-assistant.pem
            owner: root
            group: root
            mode: "0644"
          register: scan_assistant_pem
          no_log: true

        - name: Reload systemd after Rapid7 Scan Assistant installation
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Enable and start Rapid7 Scan Assistant
          ansible.builtin.systemd_service:
            name: R7ScanAssistant.service
            enabled: true
            state: started

        - name: Allow Rapid7 Scan Engine through UFW (Ubuntu)
          community.general.ufw:
            rule: allow
            direction: in
            proto: tcp
            from_ip: "{{ item }}"
            to_port: "{{ rapid7_scan_assistant_port }}"
            comment: Rapid7 Scan Assistant
          loop: "{{ rapid7_scan_assistant_engine_ips }}"
          loop_control:
            label: >-
              {{ item }} -> TCP/{{ rapid7_scan_assistant_port }}
          when:
            - ansible_os_family == "Debian"

        - name: Install firewalld dependencies (Rocky and RedHat)
          ansible.builtin.dnf:
            name:
              - firewalld
              - python3-firewall
            state: present
          when:
            - ansible_os_family == "RedHat"

        - name: Enable and start firewalld (Rocky and RedHat)
          ansible.builtin.systemd_service:
            name: firewalld
            enabled: true
            state: started
          when:
            - ansible_os_family == "RedHat"

        - name: Allow Rapid7 Scan Engine through firewalld
          ansible.posix.firewalld:
            zone: "{{ rapid7_scan_assistant_firewalld_zone }}"
            rich_rule: >-
              rule family="ipv4"
              source address="{{ item }}"
              port port="{{ rapid7_scan_assistant_port }}"
              protocol="tcp"
              accept
            permanent: true
            immediate: true
            state: enabled
          loop: "{{ rapid7_scan_assistant_engine_ips }}"
          loop_control:
            label: >-
              {{ item }} -> TCP/{{ rapid7_scan_assistant_port }}
          when:
            - ansible_os_family == "RedHat"

        - name: Restart Rapid7 Scan Assistant after package or certificate changes
          ansible.builtin.systemd_service:
            name: R7ScanAssistant.service
            state: restarted
          when:
            - >-
              (scan_assistant_pem.changed | default(false))
              or (scan_assistant_deb_install.changed | default(false))
              or (scan_assistant_rpm_install.changed | default(false))

        - name: Verify Rapid7 Scan Assistant listener
          block:
            - name: Wait for Rapid7 Scan Assistant to listen locally
              ansible.builtin.wait_for:
                host: 127.0.0.1
                port: "{{ rapid7_scan_assistant_port }}"
                state: started
                connect_timeout: 2
                timeout: 20

          rescue:
            - name: Restart Rapid7 Scan Assistant after failed listener check
              ansible.builtin.systemd_service:
                name: R7ScanAssistant.service
                state: restarted

            - name: Wait again for Rapid7 Scan Assistant to listen locally
              ansible.builtin.wait_for:
                host: 127.0.0.1
                port: "{{ rapid7_scan_assistant_port }}"
                state: started
                connect_timeout: 2
                timeout: 30

        - name: Verify Rapid7 Scan Assistant service is active
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - R7ScanAssistant.service
          register: scan_assistant_service_status
          changed_when: false
          failed_when: >-
            scan_assistant_service_status.rc != 0
            or scan_assistant_service_status.stdout != "active"

        - name: Remove Rapid7 Scan Assistant package files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/R7ScanAssistant_amd64.deb
            - /tmp/R7ScanAssistant_amd64.rpm
