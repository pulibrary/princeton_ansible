---
# you MUST pass --limit with this playbook
#
- name: Check the Ubuntu kernel, update and reboot if needed
  hosts: all
  remote_user: pulsys
  become: true
  serial: 1
  max_fail_percentage: 0

  pre_tasks:
    - name: Stop playbook if you didn't pass --limit
      fail:
        msg: "you must use -l or --limit"
      when: ansible_limit is not defined
      run_once: true

  tasks:
    - name: Check kernel on Debian-flavored VMs
      ansible.builtin.shell: dpkg-query -W -f='${binary:Package}\t${source:Package}\t${Version}\n' "linux-image-$(uname -r)"
      when: ansible_facts['os_family'] == "Debian"
      register: kernel_details

    - name: Display Jammy results
      ansible.builtin.debug:
        msg:
          - "Kernel output: {{ kernel_details.stdout }}"
          - "{% if '5.15.0-203.213' in kernel_details.stdout %} The kernel on '{{ inventory_hostname }}' is patched!{% else %} The kernel on '{{inventory_hostname}}' is still not patched!{% endif %}"
      when: ansible_facts['distribution_version'] == "22.04"
      # failed_when: "'5.15.0-203.213' not in kernel_details.stdout"

    - name: Display Noble results
      ansible.builtin.debug:
        msg:
          - "Kernel output: {{ kernel_details.stdout }}"
          - "{% if '6.8.0-149.149' in kernel_details.stdout %} The kernel on '{{ inventory_hostname }}' is patched!{% else %} The kernel on '{{inventory_hostname}}' is still not patched!{% endif %}"
      when: ansible_facts['distribution_version'] == "22.04"
      # failed_when: "'6.8.0-149.149' not in kernel_details.stdout"

    - name: Upgrade the Jammy kernel
      ansible.builtin.apt:
        name: [linux-generic, linux-image-generic, linux-headers-generic, linux-virtual, linux-image-virtual, linux-headers-virtual]
        state: latest # noqa package-latest
        only_upgrade: true
        update_cache: true
      when:
        - ansible_facts['distribution_version'] == "24.04"
        - "'5.15.0-203.213' not in kernel_details.stdout"

    - name: Upgrade the Noble kernel
      ansible.builtin.apt:
        name: [linux-generic, linux-image-generic, linux-headers-generic, linux-virtual, linux-image-virtual, linux-headers-virtual]
        state: latest # noqa package-latest
        only_upgrade: true
        update_cache: true
      when:
        - ansible_facts['distribution_version'] == "24.04"
        - "'6.8.0-149.149' not in kernel_details.stdout"

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot
      ansible.builtin.reboot:
      when: reboot_required.stat.exists
      # this module reboots and waits until the machine responds before ending
