---
# Shared preflight for playbooks that log in to the Proxmox nodes with step-ca
# SSH certificates. Import it as the first play:
#
#   - name: Preflight checks for Proxmox certificate login
#     ansible.builtin.import_playbook: proxmox_ssh_preflight.yml
#
# The Proxmox nodes only accept SSH certificates signed by step-ca (see
# roles/ssh_ca_trust); password logins, --ask-pass included, are refused for
# every account. Only the accounts listed in ssh_ca_users in
# group_vars/proxmox/common.yml can log in, and your certificate must carry
# that account's principal (<user>@princeton.edu). Before running a Proxmox
# playbook:
#
#   1. Bootstrap step once per workstation (fingerprint is in
#      group_vars/step_ca/vault.yml):
#        step ca bootstrap --ca-url https://step-ca.lib.princeton.edu:8443 --fingerprint <fingerprint>
#   2. Get a certificate loaded into your ssh-agent, signing in to Entra as
#      <user>:
#        step ssh login <user>@princeton.edu
#   3. Confirm the certificate carries <user>@princeton.edu:
#        ssh-add -L | grep cert-v01 | ssh-keygen -L -f - | grep -A3 Principals
#   4. Confirm a certificate login works:
#        ssh -o PreferredAuthentications=publickey -o PasswordAuthentication=no <user>@<node>
#
# The Proxmox playbooks connect as your local $USER. If that is not the
# account you logged in as, pass '-e proxmox_ssh_user=<user>'.
#
# If step 3 shows your own principal instead of <user>'s (the browser reused
# your Entra session), log out and sign in again without launching the default
# browser, then open the printed URL in a browser profile signed in as <user>
# (not a private window: Conditional Access rejects those with error 53003).
# See roles/ssh_ca_trust/README.md.
#   step ssh logout <user>@princeton.edu
#   STEP_OPEN_BROWSER=0 step ssh login <user>@princeton.edu --provisioner "Princeton Entra OIDC"
- name: Preflight checks for Proxmox certificate login
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/proxmox/common.yml
  vars:
    proxmox_login_user: "{{ proxmox_ssh_user | default(lookup('ansible.builtin.env', 'USER')) }}"

  tasks:
    - name: Proxmox | confirm the connecting account may log in
      ansible.builtin.assert:
        that:
          - proxmox_login_user in (ssh_ca_users | map(attribute='name') | list)
        fail_msg: >-
          '{{ proxmox_login_user }}' is not in ssh_ca_users in
          group_vars/proxmox/common.yml. Pass '-e proxmox_ssh_user=<netid>'
          if your local user is not your netid.

    - name: Proxmox | look for an SSH certificate in the local ssh-agent
      ansible.builtin.command: ssh-add -L
      register: proxmox_agent_keys
      changed_when: false
      failed_when: false

    - name: Proxmox | require a step-ca SSH certificate
      ansible.builtin.assert:
        that:
          - "'-cert-v01@openssh.com' in proxmox_agent_keys.stdout"
        fail_msg: >-
          No SSH certificate found in your ssh-agent. Run
          'step ssh login {{ proxmox_login_user }}@princeton.edu'
          first (see the header of playbooks/utils/proxmox_ssh_preflight.yml).

    # A browser already signed in to Entra as someone else issues their
    # certificate, so a certificate being present is not enough: it must
    # carry one of the principals this account accepts.
    - name: Proxmox | read the principals of the certificates in the ssh-agent
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          ssh-add -L | grep -- '-cert-v01@openssh.com' |
          while read -r cert; do printf '%s\n' "$cert" | ssh-keygen -L -f -; done
        executable: /bin/bash
      register: proxmox_agent_certs
      changed_when: false

    - name: Proxmox | require a certificate for the connecting account
      vars:
        proxmox_expected_principals: >-
          {{ (ssh_ca_users | selectattr('name', 'equalto', proxmox_login_user) | first).principals }}
        proxmox_cert_principals: >-
          {{ proxmox_agent_certs.stdout
             | regex_findall('(?s)Principals:\s*\n(.*?)\n\s*Critical Options:')
             | join('\n') | split | list }}
      ansible.builtin.assert:
        that:
          - proxmox_expected_principals | intersect(proxmox_cert_principals) | length > 0
        fail_msg: >-
          No certificate in your ssh-agent lets you log in as
          '{{ proxmox_login_user }}': it needs one of
          {{ proxmox_expected_principals | join(', ') }}, but the loaded
          certificates carry {{ proxmox_cert_principals | join(', ') or 'no principals' }}.
          The browser probably signed in to Entra as a different account. Run
          'step ssh logout {{ proxmox_login_user }}@princeton.edu', then
          'STEP_OPEN_BROWSER=0 step ssh login {{ proxmox_login_user }}@princeton.edu
          --provisioner "Princeton Entra OIDC"' and open the URL in a browser
          profile signed in as {{ proxmox_login_user }}.
        success_msg: >-
          Certificate for '{{ proxmox_login_user }}' found
          ({{ proxmox_expected_principals | intersect(proxmox_cert_principals) | join(', ') }}).
