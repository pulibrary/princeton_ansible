---
# Find the authoritative name of an Active Directory account.
#
# It binds over LDAPS as the sssd_ldap lookup account from group_vars/sftp, so
# it runs on any SFTP host with the LDAP client tools installed. It searches the
# Global Catalog rather than a single domain, so it finds the account whichever
# domain of the forest holds it.
#
# Because it binds as the lookup account, it cannot diagnose a lookup account
# that is itself wrong; the sssd_ldap pre-flight checks cover that case.
#
#   ansible-playbook playbooks/utils/ad_account_lookup.yml -e 'lookup_names=libops'
#   ansible-playbook playbooks/utils/ad_account_lookup.yml \
#     -e 'lookup_names=libops,almasftp,lib-aspacesftp'
#
# Nothing is changed. The staged lookup password is removed afterwards.
- name: Look up Active Directory accounts
  hosts: "{{ lookup_hosts | default('libsftp_staging') }}"
  remote_user: pulsys
  become: true
  gather_facts: true
  gather_subset:
    - min

  vars_files:
    - ../../group_vars/sftp/vault.yml
    - ../../group_vars/sftp/common.yml

  vars:
    lookup_names: ""
    # A Global Catalog server. Unlike an ordinary domain controller port, this
    # answers for every domain in the forest, so an account in another domain is
    # still found. 3269 is the Global Catalog over LDAPS.
    lookup_gc_host: pdom21tlkp.pu.win.princeton.edu
    lookup_gc_port: 3269
    # Bind as the sssd_ldap lookup account. A bare name is turned into a
    # userPrincipalName the same way sssd_ldap does it.
    lookup_bind_dn: >-
      {{ sssd_bind_dn if (',' in sssd_bind_dn or '@' in sssd_bind_dn)
         else sssd_bind_dn ~ '@' ~ (sssd_ldap_upn_suffix | default('princeton.edu')) }}
    lookup_bind_password_file: /root/.ad_account_lookup_bind
    # Trust the same CA bundle sssd_ldap configures, and verify the server.
    lookup_ldap_env:
      LDAPTLS_CACERT: >-
        {{ '/etc/pki/tls/certs/ca-bundle.crt'
           if ansible_facts['os_family'] == 'RedHat'
           else '/etc/ssl/certs/ca-certificates.crt' }}
      LDAPTLS_REQCERT: demand

  tasks:
    - name: Require at least one account name
      ansible.builtin.assert:
        that:
          - lookup_names | length > 0
        fail_msg: >-
          Pass the accounts to look up, for example
          -e 'lookup_names=libops,almasftp'

    - name: Split the requested names
      ansible.builtin.set_fact:
        lookup_account_list: >-
          {{ lookup_names.split(',') | map('trim')
             | reject('equalto', '') | list }}

    - name: Look the accounts up
      block:
        - name: Stage the lookup password out of the process list
          ansible.builtin.copy:
            content: "{{ sssd_bind_dn_password }}"
            dest: "{{ lookup_bind_password_file }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          changed_when: false

        - name: Find each account anywhere in the forest
          ansible.builtin.command:
            argv:
              - ldapsearch
              - -x
              - -LLL
              - -o
              - ldif-wrap=no
              - -H
              - "ldaps://{{ lookup_gc_host }}:{{ lookup_gc_port }}"
              - -D
              - "{{ lookup_bind_dn }}"
              - -y
              - "{{ lookup_bind_password_file }}"
              # An empty base against the Global Catalog searches every domain
              # in the forest, so this does not assume which one holds the
              # account.
              - -b
              - ""
              - "(sAMAccountName={{ item }})"
              - distinguishedName
              - userPrincipalName
              - sAMAccountName
              - userAccountControl
              - uidNumber
              - gidNumber
          loop: "{{ lookup_account_list }}"
          register: lookup_results
          changed_when: false
          failed_when: false
          environment: "{{ lookup_ldap_env }}"

        - name: Report what the forest holds for each account
          ansible.builtin.debug:
            msg: >-
              {{ item.item }}:
              {{ ('query failed -- ' ~ (item.stderr | default('') | trim))
                 if item.rc != 0
                 else (item.stdout_lines | default([]) | reject('match', '^$') | list
                       if (item.stdout | default('') | trim | length) > 0
                       else 'NOT FOUND anywhere in the forest. Check the spelling of
                       sAMAccountName; the name may differ from the display name.') }}
          loop: "{{ lookup_results.results }}"
          loop_control:
            label: "{{ item.item }}"

        # Print the value to store, rather than leaving it to be reassembled by
        # hand. A userPrincipalName is preferred when the account has one: it is
        # short, and its suffix is whatever the directory actually publishes,
        # which is not always the Active Directory DNS domain.
        - name: Give the exact value to store for each account
          ansible.builtin.debug:
            msg: >-
              {{ item.item }}:
              {{ ((item.stdout_lines | select('match', '^userPrincipalName: ')
                   | first | regex_replace('^userPrincipalName: ', ''))
                  if (item.stdout_lines | default([])
                      | select('match', '^userPrincipalName: ') | list | length > 0)
                  else ('no userPrincipalName, so use the full distinguished
                        name, quoted because it contains spaces: "'
                        ~ (item.stdout_lines
                           | select('match', '^distinguishedName: ') | first
                           | regex_replace('^distinguishedName: ', '')) ~ '"'))
                 if (item.stdout | default('') | trim | length) > 0
                 else 'not found, nothing to store' }}
          loop: "{{ lookup_results.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Explain how to read the result
          ansible.builtin.debug:
            msg:
              - "userPrincipalName is the value to use for vault_sssd_bind_dn."
              - "It cannot get the domain components wrong the way a full"
              - "distinguished name can."
              - ""
              - "distinguishedName shows which domain actually holds the"
              - "account. If its dc= components are not"
              - "dc=pu,dc=win,dc=princeton,dc=edu then sssd_ldap has to point at"
              - "controllers for that domain instead."
              - ""
              - "userAccountControl: 512 is a normal enabled account, 514 is"
              - "disabled, 66048 is enabled with a non-expiring password, and"
              - "8388608 means the password has expired."
              - ""
              - "An account with no uidNumber or gidNumber will not resolve"
              - "while sssd_ldap_id_mapping is false."

      always:
        - name: Remove the staged lookup password
          ansible.builtin.file:
            path: "{{ lookup_bind_password_file }}"
            state: absent
          changed_when: false
