---
# The tigerdata runner only exists in production, so this playbook takes no
# runtime_env.
- name: Tigerdata CircleCI Deployer | Provision Variables & Infrastructure
  # The [0] picks the first host, since we just run the nomad commands there.
  hosts: "nomad_production[0]"
  remote_user: pulsys
  become: true

  # Vault files (env-agnostic secrets or per-env keys within)
  vars_files:
    # This will auto include group_vars/nomad_production.yml
    # This will auto include group_vars/nomad_servers.yml
    - ../group_vars/nomad/vault.yml
    - "../group_vars/tigerdata/production.yml"
    - ../group_vars/tigerdata/vault.yml
  vars:
    runtime_env_or_default: "{{ runtime_env | default('production') }}"
    nomad_hcl: "{{ playbook_dir }}/../nomad/tigerdata/deploy/production.hcl"
  roles:
    - role: roles/nomad_app
