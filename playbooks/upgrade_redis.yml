# Required: pass a host group '-e host_group=pdc_describe_staging'
# Note: You may need to run the redis role on your host group to ensure recent
# configuration changes are in place (in particular, `supervised: auto`).
- name: upgrade the redis instance on the host group
  hosts: '{{ host_group }}'
  remote_user: pulsys
  become: true
  vars_files:
    - ../site_vars.yml
  vars:
    redis_packages:
      - python3-redis
      - redis-server
      - redis-tools

  tasks:
    - name: add the redis repository
      ansible.builtin.deb822_repository:
        name: redislabs-redis
        types: [deb]
        uris: https://ppa.launchpadcontent.net/redislabs/redis/ubuntu
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [main]
        signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60A0586666DE0BA4B481628ACC59E6B43FA6E3CA"
        state: present
        install_python_debian: true
    - name: Update the repository cache and update redis packages
      ansible.builtin.apt:
        name: "{{ redis_packages }}"
        state: latest
        update_cache: true
        install_recommends: no
        dpkg_options: 'force-confold,force-confdef'
    - name: restart redis
      ansible.builtin.service:
        name: "redis-server"
        state: restarted

  post_tasks:
    - name: tell everyone on slack you ran an ansible playbook
      community.general.slack:
        token: "{{ vault_pul_slack_token }}"
        msg: "Ansible ran `{{ ansible_play_name }}` on {{ inventory_hostname }}"
        channel: "{{ slack_alerts_channel }}"
      when: not ansible_check_mode
