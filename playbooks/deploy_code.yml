---
- name: Deploy code with Capistrano
  hosts: "towerdeploy_{{ towerdeploy_env | default('staging') }}"
  remote_user: pulsys
  become: true

  vars:
    project_dir: "/tmp/{{ repo_name }}"

  pre_tasks:
    - name: Validate deployment parameters
      ansible.builtin.assert:
        that:
          - repo_name is defined
          - repo_name | length > 0
          - runtime_env is defined
          - runtime_env | length > 0
          - towerdeploy_env in ['staging', 'production']
        fail_msg: >-
          Invalid deployment parameters:
          repo_name={{ repo_name | default('UNSET') }},
          branch_name={{ branch_name | default('main') }},
          runtime_env={{ runtime_env | default('UNSET') }},
          towerdeploy_env={{ towerdeploy_env | default('UNSET') }}

    - name: Display deployment request
      ansible.builtin.debug:
        msg:
          - "Application repository: {{ repo_name }}"
          - "Application branch: {{ branch_name | default('main') }}"
          - "Capistrano environment: {{ runtime_env }}"
          - "Deployment server environment: {{ towerdeploy_env }}"
          - "Deployment server: {{ inventory_hostname }}"

    - name: Tell GitHub you are planning to deploy
      ansible.builtin.uri:
        url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/deployments"
        method: POST
        body:
          ref: "{{ branch_name | default('main') }}"
          description: Deploy request from Ansible
          auto_merge: false
          environment: "{{ runtime_env }}"
          required_contexts: []
        body_format: json
        headers:
          Authorization: "Bearer {{ vault_tower_github_token }}"
          Accept: "application/vnd.github+json"
        follow_redirects: true
        status_code:
          - 201
          - 202
      register: git_result
