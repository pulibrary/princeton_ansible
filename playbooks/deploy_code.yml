---
- name: Deploy code with Capistrano
  hosts: "towerdeploy_{{ towerdeploy_env | default('staging') }}"
  remote_user: pulsys
  become: true

  vars:
    project_dir: "/tmp/{{ repo_name }}"
    nomad_addr: "https://nomad.lib.princeton.edu"
    nomad_version: "2.0.5"

  pre_tasks:
    - name: Validate deployment parameters
      ansible.builtin.assert:
        that:
          - repo_name is defined
          - repo_name | length > 0
          - runtime_env is defined
          - runtime_env | length > 0
          - towerdeploy_env | default('staging') in ['staging', 'production']
        fail_msg: >-
          Invalid deployment parameters:
          repo_name={{ repo_name | default('UNSET') }},
          branch_name={{ branch_name | default('main') }},
          runtime_env={{ runtime_env | default('UNSET') }},
          towerdeploy_env={{ towerdeploy_env | default('staging') }}

    - name: Display deployment request
      ansible.builtin.debug:
        msg:
          - "Application repository: {{ repo_name }}"
          - "Application branch: {{ branch_name | default('main') }}"
          - "Capistrano environment: {{ runtime_env }}"
          - "Deployment server environment: {{ towerdeploy_env | default('staging') }}"
          - "Deployment server: {{ inventory_hostname }}"
          - "Success Tag: {{ success_tag | default('UNSET') }}"

    - name: Tell GitHub you are planning to deploy
      ansible.builtin.uri:
        url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/deployments"
        method: POST
        body:
          ref: "{{ branch_name | default('main') }}"
          description: Deploy request from Ansible
          auto_merge: false
          environment: "{{ runtime_env }}"
          required_contexts: []
        body_format: json
        headers:
          Authorization: "Bearer {{ vault_tower_github_token }}"
          Accept: "application/vnd.github+json"
        follow_redirects: safe
        status_code:
          - 201
          - 202
      register: git_result

    - name: Report GitHub deployment ID
      ansible.builtin.debug:
        msg: "Told GitHub we were starting deployment {{ git_result.json.id }}"

    - name: Let folks on Slack know a deploy has begun
      community.general.slack:
        token: "{{ vault_tower_slack_token }}"
        msg: >-
          {{ tower_user_first_name | default('Ansible') }} has started a deploy of the
          `{{ branch_name | default('main') }}` branch of `{{ repo_name }}` to the {{ runtime_env }} environment.
          If you don't see a 'success' message, check the #ansible-alerts channel for failure details.
        channel: "{{ slack_alerts_channel }}"

    - name: Let folks on Slack know where to find the log
      community.general.slack:
        token: "{{ vault_tower_slack_token }}"
        msg: "Job progress can be found: https://ansible-tower.princeton.edu/#/jobs/playbook/{{ tower_job_id }}/output"
        channel: "{{ slack_alerts_channel }}"
      when: tower_job_id is defined

  tasks:
    - name: Update code repo
      ansible.builtin.git:
        repo: "https://github.com/pulibrary/{{ repo_name }}.git"
        dest: "{{ project_dir }}"
        version: "{{ branch_name | default('main') }}"
        clone: true
        update: true
      become: true
      become_user: deploy
      register: repo_checkout

    - name: Check for Nomad job file
      ansible.builtin.stat:
        path: "{{ project_dir }}/config/deploy/{{ runtime_env }}.hcl"
      register: nomad_job_file

    - name: Run Capistrano deploy
      ansible.builtin.command:
        cmd: "/usr/local/bin/cap {{ runtime_env }} deploy"
        chdir: "{{ project_dir }}"
      environment:
        BRANCH: "{{ branch_name | default('main') }}"
      become: true
      become_user: deploy
      changed_when: true
      when: not nomad_job_file.stat.exists

    - name: Deploy with Nomad
      when: nomad_job_file.stat.exists
      block:
        - name: Find Nomad job files
          ansible.builtin.find:
            paths: "{{ project_dir }}/config/deploy"
            patterns:
              - "{{ runtime_env }}.hcl"
              - "{{ runtime_env }}-periodic.hcl"
          register: nomad_job_files

        - name: Read Nomad job files
          ansible.builtin.slurp:
            src: "{{ item.path }}"
          loop: "{{ nomad_job_files.files | sort(attribute='path', reverse=true) }}"
          loop_control:
            label: "{{ item.path | basename }}"
          register: nomad_job_hcl

        - name: Download Nomad CLI
          ansible.builtin.get_url:
            url: "https://releases.hashicorp.com/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_linux_amd64.zip"
            checksum: "sha256:https://releases.hashicorp.com/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_SHA256SUMS"
            dest: /tmp/nomad.zip
            mode: "0644"
          delegate_to: localhost
          become: false

        - name: Extract Nomad CLI
          ansible.builtin.shell:
            cmd: python3 -m zipfile -e nomad.zip . && chmod +x nomad
            chdir: /tmp
            creates: /tmp/nomad
          delegate_to: localhost
          become: false

        - name: Run Nomad deploy
          ansible.builtin.command:
            cmd: "/tmp/nomad job run -var branch_or_sha={{ repo_checkout.after[:7] }} -"
            stdin: "{{ item.content | b64decode }}"
          environment:
            NOMAD_ADDR: "{{ nomad_addr }}"
          loop: "{{ nomad_job_hcl.results }}"
          loop_control:
            label: "{{ item.source | basename }}"
          delegate_to: localhost
          become: false
          changed_when: true

    - name: Create a tag
      when: success_tag is defined
      block:
        - name: Try updating tag
          ansible.builtin.uri:
            url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/git/refs/tags/{{ success_tag }}"
            method: PATCH
            body:
              sha: "{{ repo_checkout.after }}"
              force: true
            body_format: json
            headers:
              Authorization: "Bearer {{ vault_tower_github_token }}"
              Accept: "application/vnd.github+json"
            follow_redirects: safe
            status_code:
              - 200
              - 422 # tag doesn't exist yet
          register: tag_update

        - name: Create tag if it doesn't exist
          ansible.builtin.uri:
            url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/git/refs"
            method: POST
            body:
              ref: "refs/tags/{{ success_tag }}"
              sha: "{{ repo_checkout.after }}"
            body_format: json
            headers:
              Authorization: "Bearer {{ vault_tower_github_token }}"
              Accept: "application/vnd.github+json"
            follow_redirects: safe
            status_code:
              - 201
          when:
            - tag_update.status == 422

  post_tasks:
    - name: Let folks on Slack know you deployed
      community.general.slack:
        token: "{{ vault_tower_slack_token }}"
        msg: "Ansible has successfully deployed the `{{ branch_name | default('main') }}` branch of `{{ repo_name }}` to the {{ runtime_env }} environment"
        channel: "{{ slack_alerts_channel }}"

    - name: Tell GitHub you finished deploying
      ansible.builtin.uri:
        url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/deployments/{{ git_result.json.id }}/statuses"
        method: POST
        body:
          environment: "{{ runtime_env }}"
          state: success
          log_url: "https://ansible-tower.princeton.edu/#/jobs/playbook/{{ tower_job_id | default('') }}/output"
          description: Deployment finished successfully.
        body_format: json
        headers:
          Authorization: "Bearer {{ vault_tower_github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        follow_redirects: safe
        status_code:
          - 201
          - 202
