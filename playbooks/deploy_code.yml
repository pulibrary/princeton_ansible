---
- name: Deploy code with Capistrano
  hosts: "towerdeploy_{{ towerdeploy_env | default('staging') }}"
  remote_user: pulsys
  become: true

  vars:
    project_dir: "/tmp/{{ repo_name }}"

  pre_tasks:
    - name: Validate deployment parameters
      ansible.builtin.assert:
        that:
          - repo_name is defined
          - repo_name | length > 0
          - runtime_env is defined
          - runtime_env | length > 0
          - towerdeploy_env | default('staging') in ['staging', 'production']
        fail_msg: >-
          Invalid deployment parameters:
          repo_name={{ repo_name | default('UNSET') }},
          branch_name={{ branch_name | default('main') }},
          runtime_env={{ runtime_env | default('UNSET') }},
          towerdeploy_env={{ towerdeploy_env | default('staging') }}

    - name: Display deployment request
      ansible.builtin.debug:
        msg:
          - "Application repository: {{ repo_name }}"
          - "Application branch: {{ branch_name | default('main') }}"
          - "Capistrano environment: {{ runtime_env }}"
          - "Deployment server environment: {{ towerdeploy_env | default('staging') }}"
          - "Deployment server: {{ inventory_hostname }}"

    - name: Tell GitHub you are planning to deploy
      ansible.builtin.uri:
        url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/deployments"
        method: POST
        body:
          ref: "{{ branch_name | default('main') }}"
          description: Deploy request from Ansible
          auto_merge: false
          environment: "{{ runtime_env }}"
          required_contexts: []
        body_format: json
        headers:
          Authorization: "Bearer {{ vault_tower_github_token }}"
          Accept: "application/vnd.github+json"
        follow_redirects: true
        status_code:
          - 201
          - 202
      register: git_result

    - name: Report GitHub deployment ID
      ansible.builtin.debug:
        msg: "Told GitHub we were starting deployment {{ git_result.json.id }}"

    - name: Let folks on Slack know a deploy has begun
      community.general.slack:
        token: "{{ vault_tower_slack_token }}"
        msg: >-
          {{ tower_user_first_name | default('Ansible') }} has started a deploy of the
          `{{ branch_name | default('main') }}` branch of `{{ repo_name }}` to the {{ runtime_env }} environment.
          If you don't see a 'success' message, check the #ansible-alerts channel for failure details.
        channel: "{{ slack_alerts_channel }}"

    - name: Let folks on Slack know where to find the log
      community.general.slack:
        token: "{{ vault_tower_slack_token }}"
        msg: "Job progress can be found: https://ansible-tower.princeton.edu/#/jobs/playbook/{{ tower_job_id }}/output"
        channel: "{{ slack_alerts_channel }}"
      when: tower_job_id is defined

  tasks:
    - name: Update code repo
      ansible.builtin.git:
        repo: "https://github.com/pulibrary/{{ repo_name }}.git"
        dest: "{{ project_dir }}"
        version: "{{ branch_name | default('main') }}"
        clone: true
        update: true
      become: true
      become_user: deploy

    - name: Run Capistrano deploy
      ansible.builtin.command:
        cmd: "/usr/local/bin/cap {{ runtime_env }} deploy"
        chdir: "{{ project_dir }}"
      environment:
        BRANCH: "{{ branch_name | default('main') }}"
      become: true
      become_user: deploy
      changed_when: true

  post_tasks:
    - name: Let folks on Slack know you deployed
      community.general.slack:
        token: "{{ vault_tower_slack_token }}"
        msg: "Ansible has successfully deployed the `{{ branch_name | default('main') }}` branch of `{{ repo_name }}` to the {{ runtime_env }} environment"
        channel: "{{ slack_alerts_channel }}"

    - name: Tell GitHub you finished deploying
      ansible.builtin.uri:
        url: "https://api.github.com/repos/pulibrary/{{ repo_name }}/deployments/{{ git_result.json.id }}/statuses"
        method: POST
        body:
          environment: "{{ runtime_env }}"
          state: success
          log_url: "https://ansible-tower.princeton.edu/#/jobs/playbook/{{ tower_job_id | default('') }}/output"
          description: Deployment finished successfully.
        body_format: json
        headers:
          Authorization: "Bearer {{ vault_tower_github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        follow_redirects: safe
        status_code:
          - 201
          - 202
