---
# CircleCI Deployer only has a production setup.
- name: CircleCI Deployer | Provision Variables & Infrastructure
  # Production deploys run on the production Nomad infrastructure.
  # The [0] picks the first host, since we just run the nomad commands there.
  hosts: "nomad_production[0]"
  remote_user: pulsys
  become: true

  # Vault files (env-agnostic secrets or per-env keys within)
  vars_files:
    # This will auto include group_vars/nomad_production.yml
    # This will auto include group_vars/nomad_servers.yml
    - ../group_vars/nomad/vault.yml
    - "../group_vars/circleci_deployer/production.yml"
    - ../group_vars/circleci_deployer/vault.yml
  vars:
    # One job covers both staging and production runners, so there's only a production.hcl.
    nomad_hcl: "{{ playbook_dir }}/../nomad/circleci_deployer/deploy/production.hcl"
  roles:
    - role: roles/nomad_app
