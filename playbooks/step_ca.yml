---
# Configure the Library Smallstep certificate authority.
#
# This playbook builds and maintains step-ca on step-ca.lib.princeton.edu.
# The Certicicate Authority uses Entra ID/OIDC to authenticate people and issue short-lived SSH
# user certificates. Hosts do not use this playbook directly; they use the
# ssh_ca_trust role to trust the User CA public key produced by this service.

- name: Configure Step CA
  hosts: step_ca
  remote_user: pulsys
  become: true
  vars_files:
    - ../group_vars/step_ca/main.yml
    - ../group_vars/step_ca/vault.yml
  roles:
    - role: step_ca
