---
# by default this playbook runs in the staging environment
# to run in the sandbox, pass '-e runtime_env=sandbox'
#
# A fresh node has no bootstrap account yet, so the first run connects as
# root with its password:
#   ansible-playbook playbooks/proxmox.yml --ask-pass -e runtime_env=sandbox -e proxmox_ssh_user=root
# After that run sshd only accepts SSH certificates, so connect as an opsys
# account with your step-ca certificate loaded (no --ask-pass):
#   ansible-playbook playbooks/proxmox.yml -e runtime_env=sandbox -e proxmox_ssh_user=<netid>
- name: proxmox add host to CA
  hosts: step_ca
  remote_user: pulsys
  become: true
  vars_files:
    - ../group_vars/proxmox/common.yml
    - ../group_vars/all/vars.yml
    - ../group_vars/step_ca/vault.yml

  roles:
    - role: step_ca

- name: proxmox add users to host
  hosts: proxmox_servers_{{ runtime_env | default('staging') }}
  remote_user: "{{ proxmox_ssh_user | default('bootstrap') }}"
  become: true
  vars_files:
    - ../group_vars/proxmox/common.yml
    - ../group_vars/all/vars.yml

  pre_tasks:
    # Environment overrides and secrets are optional, so the playbook still
    # runs on a checkout where neither file exists yet.
    - name: Load environment overrides when present
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "../group_vars/proxmox/{{ runtime_env | default('staging') }}.yml"
          skip: true

    - name: Load the Proxmox secrets when present
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - ../group_vars/proxmox/vault.yml
          skip: true

    # Nodes without a subscription get 401 from enterprise.proxmox.com, which
    # fails every apt cache update. Switch those nodes to the no-subscription
    # repositories; subscribed nodes keep the enterprise ones.
    - name: Check the Proxmox subscription status
      ansible.builtin.command: pvesubscription get
      register: proxmox_subscription
      changed_when: false

    - name: Switch unsubscribed nodes to the no-subscription repositories
      when: "'status: active' not in proxmox_subscription.stdout | lower"
      block:
        - name: Find the enterprise repository files
          ansible.builtin.stat:
            path: "/etc/apt/sources.list.d/{{ item }}"
          loop:
            - pve-enterprise.sources
            - ceph.sources
          register: proxmox_enterprise_sources

        - name: Disable the enterprise repositories
          ansible.builtin.lineinfile:
            path: "{{ item.stat.path }}"
            regexp: "^Enabled:"
            line: "Enabled: false"
            insertafter: "^Types:"
          loop: "{{ proxmox_enterprise_sources.results | selectattr('stat.exists') | list }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Add the no-subscription repositories
          ansible.builtin.copy:
            dest: "/etc/apt/sources.list.d/{{ item.name }}.sources"
            content: |
              Types: deb
              URIs: {{ item.uri }}
              Suites: {{ ansible_facts['distribution_release'] }}
              Components: {{ item.component }}
              Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
            owner: root
            group: root
            mode: "0644"
          loop:
            - { name: pve-no-subscription, uri: "http://download.proxmox.com/debian/pve", component: pve-no-subscription }
            - { name: ceph-no-subscription, uri: "http://download.proxmox.com/debian/ceph-squid", component: no-subscription }
          loop_control:
            label: "{{ item.name }}"

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true

    - name: Create Ops Group
      ansible.builtin.group:
        name: opsys
        state: present

    - name: Grant sudo privileges to opsys group
      ansible.builtin.copy:
        content: |
          %opsys ALL=(ALL:ALL) NOPASSWD:ALL
        dest: /etc/sudoers.d/opsys
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
  roles:
    - role: ssh_ca_trust
    - role: veeam_proxmox
    - role: flyline
