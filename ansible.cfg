[defaults]
timeout = 60
# automated host key checking may be added in 2.0
# see https://github.com/ansible/ansible-modules-core/issues/575
#
host_key_checking = False
inventory = ./inventory
# keep automatic interpreter discovery (Ubuntu 22.04 -> python3.10,
# 24.04 -> python3.12) without the per-host warning. Hosts that need a
# specific path (e.g. FreeBSD) still set ansible_python_interpreter.
interpreter_python = auto_silent
allow_broken_conditionals = True

# vendorize external roles
roles_path = external_roles
pipelining = true
local_tmp  = ~/.ansible/tmp
remote_tmp = /tmp
[connection]
pipelining =True
[inventory]
enable_plugins = ini, yaml, auto, toml, script, host_list
[ssh_connection]
pipelining=True
